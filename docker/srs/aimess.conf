# SRS (OSSRS) configuration for local AIMess development.
#
# Ports:
#   1935  — RTMP ingest  (OBS: rtmp://10.0.127.212:1935/live/<key>)
#   1985  — HTTP API + WHIP WebRTC ingest
#   8080  — HTTP playback (FLV + HLS)
#   8000  — WebRTC UDP (ICE / DTLS)
#
# FLV playback:  http://10.0.127.212:8080/live/<key>.flv
# HLS playback:  http://10.0.127.212:8080/live/<key>.m3u8
# WHIP publish:  http://10.0.127.212:1985/rtc/v1/whip/?app=live&stream=<key>
# RTMP publish:  rtmp://10.0.127.212/live/<key>

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    # Port number only — no "udp://" prefix (SRS 6 parse error otherwise).
    listen          8000;
    # $CANDIDATE is replaced by the CANDIDATE env var passed to the container.
    # Set SRS_CANDIDATE=10.0.127.212 in .env so LAN devices can reach the ICE port.
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    # Match production I-01: absorb publishers with non-monotonic timestamps
    # (e.g. ffmpeg restreamers). Fixes viewer glitches on long streams.
    mix_correct on;

    # ---- HLS output ----
    # 4s fragments (was 2s) halve the manifest+segment request rate for local
    # dev; production stays on 2s. Trade: ~4s more player latency locally, but
    # far quieter Network tab and no visible glitches from request churn.
    # hls_window 60 keeps a 60s live window in the playlist.
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    4;
        hls_window      60;
    }

    # ---- HTTP-FLV remux ----
    # mount must be [app]/[stream].flv so the URL is /live/<key>.flv (no vhost prefix).
    http_remux {
        enabled     on;
        mount       [app]/[stream].flv;
    }

    # ---- WebRTC (WHIP publish / WHEP playback) ----
    rtc {
        enabled     on;
        # Bridge WebRTC publisher into the RTMP pipeline so HLS/FLV pick it up.
        rtc_to_rtmp on;
        # RTMP/FLV/HLS can't carry B-frames cleanly — drop them on the bridge.
        keep_bframe off;
        # How often (s) to request a keyframe (PLI) from the WebRTC publisher so
        # the RTMP/HLS side gets IDR frames promptly. Lower = faster first frame.
        pli_for_rtmp 2.0;
    }

    # ---- ABR transcode: spawn ffmpeg per publish → 480p + 360p renditions.
    # CRITICAL: renditions are published with `?vhost=abr` so they land in the
    # `abr` vhost below, which has NO transcode. Publishing them back into THIS
    # vhost would re-transcode them (`_480p_360p`, `_360p_360p`, …) in an
    # exponential 2^N loop that saturates SRS and drops the OBS/camera publisher.
    # The default vhost's transcode must only ever see the original <key>.
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine 480p {
            enabled         on;
            vcodec          libx264;
            vbitrate        800;
            vfps            30;
            vwidth          854;
            vheight         480;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                g            60;
                sc_threshold 0;
            }
            acodec          copy;
            output          rtmp://127.0.0.1:[port]/[app]/[stream]_480p?vhost=abr;
        }
        engine 360p {
            enabled         on;
            vcodec          libx264;
            vbitrate        400;
            vfps            30;
            vwidth          640;
            vheight         360;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            vparams {
                g            60;
                sc_threshold 0;
            }
            acodec          copy;
            output          rtmp://127.0.0.1:[port]/[app]/[stream]_360p?vhost=abr;
        }
    }

    # ---- SRS HTTP hooks → stream-service /internal/srs/hooks ----
    # host.docker.internal resolves to the Windows host from inside the container.
    # ENABLED: on_publish flips PENDING->LIVE, on_unpublish flips LIVE->ENDED for
    # BOTH OBS (RTMP) and camera (WHIP, via the rtc_to_rtmp bridge). No manual
    # go-live needed. REQUIRES stream-service running and reachable at
    # host.docker.internal:3007 — if it's down, on_publish errors deny the publish.
    # SRS can't set custom headers on hook requests, so the shared secret is
    # embedded in the URL's query string; it must match stream-service's
    # SRS_HOOK_SECRET env var (see apps/stream-service/.env). The endpoint
    # rejects every hook call with no/wrong secret. The __SRS_HOOK_SECRET__
    # placeholder is substituted at container start (see docker-compose.yml)
    # from the SRS_HOOK_SECRET env var — never commit a real secret here.
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:3007/internal/srs/hooks?secret=__SRS_HOOK_SECRET__;
        on_unpublish    http://host.docker.internal:3007/internal/srs/hooks?secret=__SRS_HOOK_SECRET__;
        on_play         http://host.docker.internal:3007/internal/srs/hooks?secret=__SRS_HOOK_SECRET__;
        on_stop         http://host.docker.internal:3007/internal/srs/hooks?secret=__SRS_HOOK_SECRET__;
    }
}

# Rendition sink. The default vhost's transcode publishes 480p/360p here via
# `?vhost=abr`. Deliberately minimal:
#   - NO transcode  → breaks the 2^N recursion (this is the whole point).
#   - NO http_hooks → renditions don't fire on_publish/on_play at the backend.
#   - NO rtc        → renditions arrive as RTMP only.
# HLS writes to the SAME html dir as the default vhost, so <key>_480p.m3u8 /
# <key>_360p.m3u8 sit beside <key>.m3u8 and are served statically by the global
# http_server at :8080 with no vhost query. The http_remux block is required
# (FLV remux is per-vhost) and, with a mount template that has no [vhost] token,
# the FLV endpoint is served by plain path too: /live/<key>_480p.flv.
vhost abr {
    mix_correct on;

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    4;
        hls_window      60;
    }

    http_remux {
        enabled     on;
        mount       [app]/[stream].flv;
    }
}
