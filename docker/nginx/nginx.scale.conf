worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # ── Socket.IO upstream — 3 chat-service pods, ip_hash sticky ────────────────
    # ip_hash pins each client IP to the same pod so Socket.IO connection-state
    # recovery works across brief disconnects without a full re-handshake.
    # The Redis adapter keeps all pods in sync, so any pod can handle any room.
    upstream chat_ws {
        ip_hash;
        server chat-service-1:3004;
        server chat-service-2:3004;
        server chat-service-3:3004;
    }

    # ── REST API upstream ─────────────────────────────────────────────────────────
    # api-gateway container when running apps in Docker.
    # Change to `host.docker.internal:8000` if api-gateway still runs via pnpm dev.
    upstream api_gateway {
        server api-gateway:8000;
    }

    proxy_buffer_size   64k;
    proxy_buffers       8 32k;

    server {
        listen 80;

        # ── Socket.IO WebSocket path ──────────────────────────────────────────────
        location /z-socket/ {
            proxy_pass         http://chat_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── REST API ──────────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
