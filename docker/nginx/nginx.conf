worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # ── Socket.IO / WebSocket upstream (ip_hash for sticky sessions) ─────────────
    # ip_hash pins each client IP to the same backend pod so Socket.IO's
    # connection-state recovery works across brief disconnects without forcing
    # a full re-handshake to a different server.
    #
    # Local dev: chat-service runs on the host via `pnpm dev` at port 3004.
    # Add more `server` lines (e.g. host.docker.internal:3005) for additional pods.
    upstream chat_ws {
        ip_hash;
        server host.docker.internal:3004;
        # server host.docker.internal:3005;
    }

    # ── REST API upstream ─────────────────────────────────────────────────────────
    upstream api_gateway {
        server host.docker.internal:8000;
    }

    proxy_buffer_size   64k;
    proxy_buffers       8 32k;

    server {
        listen 80;

        # ── Socket.IO path (WebSocket upgrade) ───────────────────────────────────
        location /z-socket/ {
            proxy_pass         http://chat_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            # Keep long-lived WebSocket connections open
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── REST API ──────────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
