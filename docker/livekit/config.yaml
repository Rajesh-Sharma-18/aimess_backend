# LiveKit self-hosted config. See Docs/calls/CALLS-LIVEKIT.md.
# Keys injected via env (LIVEKIT_KEYS_YAML) — kept out of source control.

port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # ⚠️ LiveKit reads this file ONCE AT STARTUP. After changing anything here you
  # MUST `docker compose restart livekit` — otherwise the container keeps
  # advertising the OLD node_ip and every call dies with "could not establish
  # pc connection" while signaling still works (so it looks like a code bug).
  # Verify what's actually live:
  #   docker logs aimess-livekit | grep "starting LiveKit server"   → "nodeIP"
  #
  # advertise the media (ICE) address the peers must send UDP/TCP media to.
  # This MUST be an address every participant's machine can reach:
  #  - same-machine two-tab testing only  → 127.0.0.1
  #  - real devices on the same LAN        → the host's LAN IP (below)
  #  - public / internet                   → use_external_ip:true (remove node_ip)
  # The host LAN IP works for BOTH same-machine and cross-machine on the LAN
  # (the host reaches itself at this IP too), so it's the safe default for dev.
  # Docker publishes UDP 50000-50100 + TCP 7881 to the host; Windows Firewall
  # must allow inbound UDP 50000-50100 for other machines to reach media.
  use_external_ip: false
  # node_ip: 13.203.130.146
  # node_ip: 10.0.127.227
  node_ip: 10.0.127.212

redis:
  address: redis:6379

# Embedded TURN. TLS/production port config lives in a prod overlay.
# ponytail: dev mode leaves TURN off — direct/STUN works on same LAN.
turn:
  enabled: false

# Webhooks: LiveKit signs each request with the api_key below and POSTs to the
# gateway. `host.docker.internal` resolves to the Docker host (Windows/mac
# out of the box; on Linux we set extra_hosts). The gateway's public port
# defaults to API_GATEWAY_PORT — update the URL if you change it.
# LIVEKIT_WEBHOOK_URL env override lets non-default gateways receive events.
webhook:
  api_key: devkey
  urls:
    # api-gateway listens on API_GATEWAY_PORT=3000. host.docker.internal
    # resolves to the Docker host (Windows/mac out-of-the-box).
    - http://host.docker.internal:3000/livekit/webhook
