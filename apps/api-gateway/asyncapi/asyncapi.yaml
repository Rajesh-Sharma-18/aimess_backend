      examples:
        - name: sinceId mode — gap-fill on reconnect
          payload:
            rooms:
              - roomId: "6843e1a2b5c3d4e5f6a7b8c9"
                sinceId: "683abc100def000000000001"
                limit: 100
        - name: sinceTs mode — mutation sweep after returning from background
          payload:
            rooms:
              - roomId: "6843e1a2b5c3d4e5f6a7b8c9"
                sinceTs: 1749465000000
                limit: 100
        - name: First load (no cursor)
