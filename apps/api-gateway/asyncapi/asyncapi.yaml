asyncapi: 3.0.0

info:
  title: AIMess Real-time API (Socket.IO)
  version: 2.0.0
  description: |
    Real-time contract between AIMess mobile/web clients and the backend.

    All Socket.IO traffic terminates at the **api-gateway**; the gateway
    authenticates the handshake, validates payloads (Zod), calls the owning
    microservice over gRPC, and fans events back out via the Redis adapter.
    Backend services never hold sockets — they `publish` to a Redis channel and
    the gateway re-emits to the matching room.

    **Notification spine (2026-06-17):** Real-time inbox delivery is now complete.
    When any business action triggers (community member-added, friend request, chat mention),
    chat-service's `createNotification` gRPC writes the inbox row AND publishes to
    Redis `notify:<userId>`. The gateway relays the event in real time; offline users
    receive FCM push (suppressed for online users to avoid duplication).

    **Perspective.** This document is written from the **client** application's
    point of view: `action: send` = the client emits to the server;
    `action: receive` = the client receives a server push. Request/response
    events declare a `reply` carrying the ack envelope.

    **Transport note.** The wire protocol is **Socket.IO** (not raw WebSocket).
    AsyncAPI has no official Socket.IO binding, so the protocol is modelled as
    `ws`/`wss` and Socket.IO specifics (namespaces, rooms, acks, multiplexed
    event names) are documented in descriptions and `x-socketio-*` extensions.
    Each AsyncAPI **channel** maps to a Socket.IO **namespace**; each
    **message** maps to a Socket.IO **event** (its `name` is the wire event).

    **Contract highlights.**
    - `message:new`, `message:edited`, and forwards all emit the **same canonical
      `ChatMessage`** (field names match REST `ChatMessage`) plus legacy V1 aliases —
      the client uses one mapper.
    - `contentType` is the single field name for message kind on every surface
      (socket + REST); values are always UPPER-CASE; there is no `messageType` alias.
    - Reactions broadcast as grouped `ChatReactionGroup[]`; presence timestamps are
      epoch-ms integers; `message:delete` carries `conversationId` + `sequenceNumber`.
    - Multi-device: `read_sync` clears unread across a user's own devices and
      `pin:updated` syncs the pinned banner.
    - Handshake query optionally carries `platform` / `clientType` (recorded in presence).
    - **Ordering:** per-room `sequenceNumber` is the sole message-ordering key.
      Events from different Redis channels have **no** cross-channel ordering
      guarantee (e.g. `message:new` vs `conv:updated`) — order messages by
      `sequenceNumber` and handle out-of-order arrivals defensively.
    - **Acks:** every request/response event answers an `AckEnvelope`
      (`{ success: true, message, data }` or
      `{ success: false, error, retryable, message }`). `message` is a localized,
      display-ready sentence (resolved from `x-lang` / `Accept-Language`). The
      **failure** shape is identical for every event — branch on `error` +
      `retryable`, not on the operation.
    - **⚠️ Ack integer wart:** in **ack** payloads **only**, `sentAt` and
      `sequenceNumber` arrive as **strings** (gRPC `int64` serialization) —
      always `Number()`-coerce them. Broadcast events (`message:new`, …) carry
      proper integers.
    - **Reconnect:** Socket.IO `connectionStateRecovery` restores rooms + missed
      emits for up to **2 min**; past that, the client re-joins rooms and runs
      `chat:catchup` / `community:catchup`. See SOCKET_EVENTS.md
      "Reconnection & State Recovery".
    - **Cursor pagination (socket ↔ REST).** History scroll and sync use different
      cursor codecs per transport — do not feed one transport's cursor into the
      other verbatim. Mapping:
      | Operation | REST (HTTP) | Socket.IO |
      | --- | --- | --- |
      | Newest page | `GET .../messages` (no cursor) | `messages:fetch` / `community:messages:fetch` (no cursor) |
      | Page backward (history) | `?before_ts=<epoch-ms>` (inclusive, `createdAt`) | `messages:fetch { cursor }` (ISO-8601 string, exclusive, `createdAt`) |
      | Page forward (history) | `?after_ts=<epoch-ms>` (inclusive, `createdAt`) | — (use catch-up) |
      | Incremental sync (edits/reactions/deletes) | community `?after_ts=<epoch-ms>` (inclusive, `updatedAt`) | `community:catchup { sinceTs }` (exclusive, `updatedAt`) |
      | Jump to message | `?around=<id>` | — |
      REST boundaries are **inclusive** (de-dupe by id); socket `messages:fetch`
      and `community:catchup` boundaries are **exclusive** (the cursor item is not
      re-returned). REST timestamp cursors are epoch-ms; socket `messages:fetch`
      cursors are ISO-8601 strings.
    - **Throttling:** fire-and-forget events (`typing:*`, `presence:heartbeat`,
      `call:ice`) carry client-side throttle expectations — see SOCKET_EVENTS.md
      "Rate limiting & throttling".
    - **Media:** attachments reference an `objectKey` / `url`; file bytes never
      cross the socket — see `docs/MEDIA_UPLOAD.md`.
    - **Client config:** Socket.IO v4 client; transports `["websocket","polling"]`
      (WS-first, polling fallback); ONE multiplexed connection serves `/chat` +
      `/community` + `/notify`; reconnection uses Socket.IO default exponential
      backoff (see SOCKET_EVENTS.md §8.1).
    - **Lifecycle:** conversations & communities are created/managed over REST
      (gateway HTTP); the socket assumes they already exist.
    - **Mobile / reliability:** typing-indicator expiry, offline send queue,
      background + push fallback, `forMe`-delete reconciliation on catch-up, and
      blocking/privacy semantics are specified in SOCKET_EVENTS.md §8; V1 scope
      gaps (group calls, group read receipts, community `read_sync`, reaction
      moderation, server-proxied sticker/GIF search) are listed in §8.9.

    **Breaking changes (this revision).** Clean renames with **no** back-compat
    alias — update client emitters/listeners:
    - message-kind field `messageType` → **`contentType`** (UPPER-CASE) on every
      socket + REST surface;
    - call field `type` → **`callType`** (`call:initiate`, `call:incoming`);
    - notification event `notification:forwarded` → **`notification:new`**.

    **Major feature: Notification Spine (2026-06-17).** The real-time inbox delivery
    pipeline is now **complete and working end-to-end**: DB write → RabbitMQ event →
    consumer → chat-service gRPC → Redis publish → gateway relay → socket → client.
    Every business action (community member-added, friend request, chat mention) now
    delivers notifications in real time to all connected devices + FCM to offline users.

    Source of truth: `apps/api-gateway/src/sockets/` and `docs/SOCKET_EVENTS.md`.
  contact:
    name: AIMess Backend
  tags:
    - name: chat
      description: 1-1 + group messaging, receipts, reactions, typing, presence, calls
    - name: community
      description: Many-member community chat
    - name: notify
      description: In-app notification feed + unread badge
    - name: stream
      description: Livestream comments, moderation, and viewer presence
    - name: multi-device
      description: "Own-device sync: read_sync (unread high-water mark) + presence"

