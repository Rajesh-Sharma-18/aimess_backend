        tombstone for a retracted PERSONAL system line — published to the
        affected user's own `user:<id>` channel only (never `community:<id>`)
        when a stale personal line is hard-deleted server-side: a superseded
        "You joined the community" line on rejoin, or the CURRENT
        "You are muted until …" MEMBER_MUTED line when the mute session ends
        (see retractPersonalMuteMessage). `deletedBy` is `""` for these
        system-initiated retractions (no human actor).
