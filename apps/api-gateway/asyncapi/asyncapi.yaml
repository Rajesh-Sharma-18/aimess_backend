        - name: Transfer ownership
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            newAdminId: "user_def456"
    CommunityMemberRoleChange:
      name: "community.member.role_change"
      title: "community.member.role_change"
      summary: "Promote or demote a member (admin only). newRole ∈ {MODERATOR, MEMBER}."
      payload: { $ref: "#/components/schemas/CommunityRoleChangePayload" }
      examples:
        - name: Promote to moderator
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            targetUserId: "user_def456"
            newRole: MODERATOR
        - name: Demote to member
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            targetUserId: "user_def456"
            newRole: MEMBER
    CommunityReportCreate:
      name: "community.report.create"
      title: "community.report.create"
      summary: "File a report against a community or a specific message."
      payload: { $ref: "#/components/schemas/CommunityReportPayload" }
      examples:
        - name: Report a message
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            reason: "Off-topic advertising"
            targetMessageId: "683abc123def456789012345"
        - name: Report the whole community
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            reason: "Coordinated harassment"
    CommunityDelete:
      name: "community.delete"
      title: "community.delete"
      summary: "Delete a community (admin only). Broadcasts community.deleted before acking."
      payload: { $ref: "#/components/schemas/CommunityDeletePayload" }
      examples:
        - name: Delete a community
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            reason: "Community no longer active"

    # -------- /community moderation (server -> client) --------
    CommunityDeleted:
      name: "community.deleted"
      title: "community.deleted"
      summary: "Broadcast to all members of community:<id> when it is deleted."
      payload: { $ref: "#/components/schemas/CommunityDeletedPayload" }
      examples:
        - name: The community was deleted
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            deletedBy: "user_admin_001"

    # -------- /community owner lifecycle (server -> client) --------
    CommunityClosed:
      name: "community:closed"
      title: "community:closed"
      summary: "Broadcast to community:<id> AND each ex-member's user:<id> when the owner closes the community (status → CLOSED). All members are auto-removed; clients disable all community actions immediately."
      payload: { $ref: "#/components/schemas/CommunityClosedPayload" }
      examples:
        - name: Owner closed the community with a reason
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            status: "CLOSED"
            closedAt: 1749983445000
            reason: "Archiving for the season"
        - name: Owner closed the community (no reason)
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            status: "CLOSED"
            closedAt: 1749983445000
    CommunityReopened:
      name: "community:reopened"
      title: "community:reopened"
      summary: "Broadcast to community:<id> when the owner reopens a closed community (status → ACTIVE). Former members re-join via the normal flow."
      payload: { $ref: "#/components/schemas/CommunityReopenedPayload" }
      examples:
        - name: Owner reopened the community
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            status: "ACTIVE"
            reopenedAt: 1749990000000

    # -------- /community typing (fire-and-forget) --------
    CommunityTypingStart:
      name: "typing:start"
      title: "typing:start (request)"
      summary: >-
        Client emits after debounce when the user starts typing in a community
        chat room. No ack. New canonical alias `community:typing:start` also accepted.
      payload:
        type: object
        required: [communityId]
        properties:
          communityId: { type: string, minLength: 1 }
          roomId:
            { type: string, description: "Optional; forward-compat only." }
      examples:
        - name: Start typing in Community B
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
    CommunityTypingStop:
      name: "typing:stop"
      title: "typing:stop (request)"
      summary: >-
        Client emits on idle timeout, message send, input clear, or unmount.
        No ack. New canonical alias `community:typing:stop` also accepted.
      payload:
        type: object
        required: [communityId]
