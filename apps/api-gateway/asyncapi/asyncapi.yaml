    # -------- /notify --------
    NotificationsFetch:
      name: "notifications:fetch"
      title: "notifications:fetch"
      payload: { $ref: "#/components/schemas/NotificationsFetchPayload" }
      examples:
        - name: Fetch latest notifications
          payload:
            limit: 20
        - name: Fetch next page
          payload:
            cursor: "683abc100def000000000099"
            limit: 20
    NotificationsMarkRead:
      name: "notifications:mark_read"
      title: "notifications:mark_read"
      payload: { $ref: "#/components/schemas/NotificationsMarkReadPayload" }
      examples:
        - name: Mark two notifications as read
          payload:
            notificationIds:
              - "683abc100def000000000099"
              - "683abc100def000000000098"
        - name: Mark all as read
          payload:
            notificationIds: []
    NotificationCount:
      name: "notification:count"
      title: "notification:count"
      payload: { $ref: "#/components/schemas/NotificationCountPayload" }
      examples:
        - name: Five unread notifications
          payload:
            count: 5
        - name: All notifications read
          payload:
            count: 0
    NotificationCountUpdate:
      name: "notification:count_update"
      title: "notification:count_update"
      summary: "Real-time unread badge count refresh (all devices)"
      description: |
        Emitted to `user:<userId>` (all connected devices) whenever the
        aggregate unread notification count changes:
        - After a successful `notifications:mark_read` the gateway pushes the
          updated count so all devices sync immediately.
        - When the notifications-service creates a new notification it publishes
          `{ event: "notification:count_update", data: { count } }` to the
          `notify:<userId>` Redis channel, which the gateway forwards verbatim.

        Client rule: on receipt replace the badge/tab-count with `count`.
        Aggregate total only — no per-type breakdown in V1.
      payload: { $ref: "#/components/schemas/NotificationCountPayload" }
      examples:
        - name: Count updated to 3 after mark-read
          payload:
            count: 3
        - name: New notification bumps count to 7
          payload:
            count: 7
    NotificationForwarded:
      name: "notification:new"
      title: "notification:new (forwarded in-app notification)"
      summary: |
        An in-app notification forwarded from `notify:<userId>` to `user:<userId>`.
        Typed as `NotificationItem`: a stable envelope (`type`, `title`, `body`,
        `referenceId`, `isRead`, `createdAt`) plus a `data` map of type-specific
        fields. `type` is the discriminator. The namespace forwards ANY event
        published to the channel verbatim, so treat unknown `type` values
        defensively.
      payload: { $ref: "#/components/schemas/NotificationItem" }
      examples:
        - name: New message
          payload:
            notificationId: "683abc100def000000000099"
            type: MESSAGE
            title: "Alice"
            body: "Hey! How are you?"
            referenceId: "6843e1a2b5c3d4e5f6a7b8c9"
            isRead: false
            createdAt: 1749465231234
            data:
              conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
              conversationType: PRIVATE
              messageId: "msg_9876543210abcdef"
              senderId: "user_abc123"
              senderName: "Alice"
              contentType: TEXT
              preview: "Hey! How are you?"
              sentAt: "1749465231234"
        - name: Friend request
          payload:
            notificationId: "683abc100def0000000000a0"
            type: friend.requested
            title: "New friend request"
            body: "Bob sent you a friend request"
            referenceId: "frnd_123"
            isRead: false
            createdAt: 1749465300000
            data:
              friendshipId: "frnd_123"
              requesterId: "user_def456"
        - name: Community member added
          payload:
            notificationId: "683abc100def0000000000a1"
            type: community.member_added
            title: "Added to a community"
            body: "You were added to Design Guild"
            referenceId: "6843e1a2b5c3d4e5f6a7b8c9"
            isRead: false
            createdAt: 1749465400000
            data:
              communityId: "6843e1a2b5c3d4e5f6a7b8c9"

  schemas:
    # -------- generic --------
    AckEnvelope:
      type: object
      description: Ack callback envelope. `success` discriminates the two shapes.
      properties:
        success: { type: boolean }
        message:
          type: string
          description: |
            Always present (success AND failure). A localized, display-ready
            sentence describing the outcome — resolved from the shared `t()`
            catalog using the socket's `x-lang` / `Accept-Language` at handshake
            (defaults: English in dev, Vietnamese in prod). On success a
            confirmation (e.g. "Message sent successfully", "Joined the community
            successfully"); on failure a human-readable reason. Clients may show
            it directly; branch logic on `success`/`error`/`retryable`, not on
            this string.
        data:
          type: object
          description: Present on success — the gRPC result (shape varies per event).
          additionalProperties: true
        error:
          type: string
          enum:
            [
              INVALID_PAYLOAD,
              SERVICE_ERROR,
              FORBIDDEN,
              NOT_FOUND,
              RATE_LIMITED,
              CONFLICT,
            ]
          description: |
            Present on failure. Stable, branchable error codes:
            - `INVALID_PAYLOAD` — Zod validation failed at the gateway (fix the payload).
            - `SERVICE_ERROR` — downstream gRPC/service error (transient).
            - `FORBIDDEN` — authenticated but not allowed (not a participant/member, blocked, insufficient role).
            - `NOT_FOUND` — the target message/conversation/community does not exist.
            - `RATE_LIMITED` — a server rate limit tripped (back off).
            - `CONFLICT` — the operation conflicts with current state (e.g. already applied / edit window expired).
        retryable:
          type: boolean
          description: |
            Present on failure. `true` when re-emitting the SAME payload may
            succeed later (`SERVICE_ERROR`, `RATE_LIMITED`); `false` for
            permanent failures (`INVALID_PAYLOAD`, `FORBIDDEN`, `NOT_FOUND`,
            `CONFLICT`) — do not blind-retry.

            For **`SERVICE_ERROR`** (retryable): use exponential backoff — start at 500 ms,
            double each attempt (with ±50% jitter), cap at 30 s, maximum **3 attempts**.
            Resend with the same `clientMessageId` (idempotency is guaranteed server-side).
            For **`RATE_LIMITED`** (retryable): back off for the full rate-limit window
            (use 30 s as a safe default if no `retryAfter` is present), then retry once.
        retryAfter:
          type: integer
          description: |
            Optional. Present on failure when `error` is `RATE_LIMITED`. Epoch-ms
            timestamp after which the client may safely retry. If absent, use
            **30 s** as the default back-off window. Clients MUST NOT retry before
            this time. Not present for any other error code.
      required: [success, message]
    MessageSendResult:
      type: object
      description: |
        `data` of the `message:send` and `message:forward` acks. The full message
        is ALSO broadcast as `message:new` to the conversation room. Numeric
        fields backed by gRPC int64 (`sentAt`, `sequenceNumber`) arrive on the
        **ack** as **strings** — coerce with `Number()` (see §3 numeric note).
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        sequenceNumber:
          {
            type: integer,
            description: "per-room monotonic seq (string on the ack).",
          }
        sentAt: { type: integer, description: "epoch ms (string on the ack)." }
        alreadySent:
          {
            type: boolean,
            description: "true = same clientMessageId was already saved (idempotent retry — safe).",
          }
      required: [messageId, conversationId]
    CommunityMessageSendResult:
      type: object
      description: |
        `data` of the `community:message:send` ack. The full message is broadcast
        as `community:message:new` to the `community:<communityId>` room. `sentAt`
        arrives as a string on the ack — coerce with `Number()`.
      properties:
        messageId: { type: string }
        roomId: { type: string }
        sentAt: { type: integer, description: "epoch ms (string on the ack)." }
        alreadySent: { type: boolean }
      required: [messageId, roomId]
    ConversationRef:
      type: object
      properties:
        conversationId: { type: string }
      required: [conversationId]
    CommunityRef:
      type: object
      properties:
        communityId: { type: string }
      required: [communityId]
    CallRef:
      type: object
      properties:
        callId: { type: string }
      required: [callId]
    ConversationType:
      type: string
      enum: [private, group]
      default: private
      description: Case-insensitive; selects private vs group code path.
    ContentType:
      type: string
      enum:
        [
          TEXT,
          IMAGE,
          VIDEO,
          AUDIO,
          VOICE,
          DOCUMENT,
          GIF,
          STICKER,
          LOCATION,
          CONTACT,
          SYSTEM,
        ]
      description: |
        Message kind — **UPPER-CASE on every surface** (socket + REST,
        private/group/community). This is the single field name for message
        classification; there is no `messageType` alias.

        The server normalizes **any** incoming value to UPPER-CASE (legacy
        lower-case stored values like `text` are normalized on read) and falls
        back to `TEXT` when empty. The enum above is the **recommended, rendered**
        set; an unrecognized UPPER-CASE value is forwarded verbatim and a client
        should render it as a generic/text bubble rather than crash.

        - `TEXT` — plain text (emoji included).
        - `IMAGE` / `VIDEO` / `GIF` — require `files[]` (or `media.files[]` on community).
        - `AUDIO` — audio file; `VOICE` — recorded voice note (waveform metadata).
        - `DOCUMENT` — generic file attachment.
        - `STICKER` — requires `sticker`; `LOCATION` — requires `location`;
          `CONTACT` — requires `contact`.
        - `SYSTEM` — group/community lifecycle event (carries `systemEvent`/`systemData`).

    # -------- chat send payloads --------
    FileAttachment:
      type: object
      description: |
        One attachment. Either `objectKey` (a key from the media-upload flow —
        see `docs/MEDIA_UPLOAD.md`) **or** `url` (an external URL, e.g. a Tenor
        GIF) is expected. The server never receives file bytes over the socket.
      properties:
        objectKey: { type: string, maxLength: 500 }
        url: { type: string, format: uri, maxLength: 3000 }
        name: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 0 }
        mime: { type: string, maxLength: 150 }
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 0 }
        blurhash:
          {
            type: string,
            maxLength: 120,
            description: "§3.5: blur preview for image/video (instant aspect-ratio render).",
          }
        waveform:
          type: array
          maxItems: 2048
          items: { type: number }
          description: "§3.5: voice-note amplitude samples (render bars pre-download)."
    Location:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
        placeName: { type: string }
        placeAddress: { type: string }
    Contact:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        avatar: { type: string }
        userId: { type: string }
    MessageSendPayload:
      type: object
      description: |
        Message send payload (client → server). The server derives sender
        identity from the authenticated socket — clients never stamp their own
        `senderId`. `clientTs` (epoch ms) is the optional display-only compose time.
        Stickers are community-only in V1 — there is no `sticker` field here; send a
        STICKER-typed reference via `files[]` or use a community.
      properties:
        conversationId: { type: string, minLength: 1, maxLength: 200 }
        clientMessageId:
          {
            type: string,
            maxLength: 200,
            description: "Client-generated idempotency key (a UUID is recommended).",
          }
        contentType: { $ref: "#/components/schemas/ContentType" }
        contentText: { type: string, maxLength: 4000 }
        mediaKey:
          type: string
          maxLength: 3000
          deprecated: true
          description: |
            **Deprecated** — single object-key shorthand. Prefer `files[]` (a
            single file is an array of one). Still accepted: when set and no
            `files[]` entry carries an `objectKey`, the gateway folds it into
            `files[]`. New clients should not send this.
        files:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/FileAttachment" }
        urls:
          type: array
          maxItems: 20
          items: { type: string, format: uri, maxLength: 3000 }
        location: { $ref: "#/components/schemas/Location" }
        contact: { $ref: "#/components/schemas/Contact" }
        repliedToId: { type: string, maxLength: 200 }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
        receiverId: { type: string, maxLength: 200 }
        senderName: { type: string, maxLength: 120 }
        senderAvatar: { type: string, maxLength: 3000 }
        clientTs:
          {
            type: integer,
            description: "§5.1: client compose time (epoch ms), display-only.",
          }
      required: [conversationId, clientMessageId, contentType]
    ReadUpTo:
      type: object
      properties:
        conversationId: { type: string }
        upToMessageId: { type: string }
      required: [conversationId, upToMessageId]
    MessageReactPayload:
      type: object
      properties:
        messageId: { type: string, minLength: 1, maxLength: 200 }
        conversationId: { type: string, minLength: 1, maxLength: 200 }
        emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            A single emoji grapheme. Bounded length tolerates multi-codepoint
            ZWJ / skin-tone sequences but rejects pasted text. Sending the same
            emoji again toggles (removes) the reaction.
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId, emoji]
    MessageReactionsGetPayload:
      type: object
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId]
    MessageEditPayload:
      type: object
      properties:
        messageId: { type: string, minLength: 1, maxLength: 200 }
        conversationId: { type: string, minLength: 1, maxLength: 200 }
        contentText: { type: string, maxLength: 4000 }
        contentJson: { type: string, maxLength: 16384 }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId]
    MessageForwardPayload:
      type: object
      properties:
        messageId: { type: string }
        targetConversationId: { type: string }
        clientMessageId: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
        receiverId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
      required: [messageId, targetConversationId, clientMessageId]
    MessagesFetchPayload:
      type: object
      properties:
        conversationId: { type: string }
        cursor: { type: string }
        limit: { type: integer, maximum: 100 }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [conversationId]
    ChatCatchupPayload:
      type: object
      properties:
        rooms:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              roomId: { type: string }
              sinceSeq: { type: integer, minimum: 0, default: 0 }
              conversationType:
                { $ref: "#/components/schemas/ConversationType" }
              limit: { type: integer, minimum: 1, maximum: 200, default: 100 }
            required: [roomId]
      required: [rooms]
    PresenceHeartbeatPayload:
      type: object
      description: |
        Payload for `presence:heartbeat`. The server renews the device-presence TTL on each
        heartbeat; the TTL is **10 minutes**. Stop sending heartbeats and the user will appear
        offline to peers after ~10 minutes. Recommended client interval: every 30–60 s while
        the app is in the foreground.
      properties:
        appState: { type: string, default: FOREGROUND }
    PeerIds:
      type: object
      description: |
        Up to **500** peer ids per call. Exceeding 500 is **rejected** — the ack
        is `INVALID_PAYLOAD` (the server does not silently truncate). Re-subscribe
        in batches if you watch more than 500 peers.
      properties:
        peerIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 200 }
      required: [peerIds]
    CallInitiatePayload:
      type: object
      description: |
        **1-1 calls only (V1).** Signaling targets a single `calleeId`; group /
        community calls are out of scope — see SOCKET_EVENTS.md §7.5.

        **Canceling a ringing call (V1):** the caller emits `call:end { callId }` before
        the callee answers. The callee receives `call:ended { durationSec: 0 }`. There is
        no server-side ring timeout in V1 — implement a client-side auto-cancel after ~60 s
        of ringing. `call:cancel`, `call:missed`, and server-enforced ring timeout are
        deferred to V2.
      properties:
        calleeId: { type: string, minLength: 1, maxLength: 200 }
        callType: { type: string, enum: [AUDIO, VIDEO], default: AUDIO }
        privateRoomId: { type: string, maxLength: 200 }
      required: [calleeId]
    IceCandidate:
      type: object
      description: |
        A WebRTC ICE candidate (RTCIceCandidateInit). The backend relays it
        opaquely — it is never parsed or persisted. An empty `candidate` string
        signals end-of-candidates.
      properties:
        candidate: { type: string, maxLength: 1000 }
        sdpMid: { type: string, maxLength: 100 }
        sdpMLineIndex: { type: integer, minimum: 0 }
        usernameFragment: { type: string, maxLength: 256 }
    CallIceSendPayload:
      type: object
      description: "Trickle a single WebRTC ICE candidate to the peer. Fire-and-forget: no ack, no retry. On weak networks candidates can drop and call setup may fail — re-send the latest candidate on a short timer."
      properties:
        callId: { type: string, minLength: 1, maxLength: 200 }
        candidate:
          description: WebRTC ICE candidate (opaque to the backend).
          oneOf:
            - { $ref: "#/components/schemas/IceCandidate" }
            - { type: string, maxLength: 1000 }
      required: [callId, candidate]

    # -------- chat receive payloads --------
    QuoteData:
      type: object
      description: "§9: canonical reply snapshot (survives parent eviction)."
      nullable: true
      properties:
        messageId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        preview: { type: string }
        isDeleted: { type: boolean }
    ReactionGroup:
      type: object
      description: "§2.4: grouped reaction (selfReacted derived client-side from users[])."
      properties:
        emoji: { type: string }
        count: { type: integer }
        users:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              displayName: { type: string }
              avatar: { type: string }
    MessageContent:
      type: object
      additionalProperties: true
      description: |
        The SINGLE shared structured message body, referenced by BOTH
        `MessageNewPayload.content` (chat `message:new` / `message:edited`) and
        `CommunityMessageNewPayload.content` (`community:message:new`) so mobile
        uses ONE content mapper across chat + community. All fields are optional;
        the enclosing payload's `contentType` says which is authoritative (e.g.
        LOCATION → `location`, STICKER → `sticker`, IMAGE/VIDEO/GIF → `files`).
        `additionalProperties: true` keeps it forward-compatible — unknown keys
        are forwarded verbatim.

        Field provenance in V1 (verified against the chat-service serializer +
        grpc emit paths): `text` / `files` / `location` / `contact` are emitted by
        BOTH surfaces; `urls` is chat-only (passed through from the sender);
        `sticker` is community-only. NOTE: `quoteData` and `parentMessageId` are
        NOT part of content — they live at the payload level.
      properties:
        text:
          type: string
          description: "Message text. May be empty for non-text kinds (location, contact, sticker, …)."
        urls:
          type: array
          description: "Chat-only: URLs carried alongside the body (passed through verbatim). Absent on community."
          items: { type: string, format: uri }
        files:
          type: array
          description: "Gallery / files attachment — images, videos, documents, audio, voice notes, GIFs."
          items: { $ref: "#/components/schemas/FileAttachment" }
        location: { $ref: "#/components/schemas/Location" }
        contact: { $ref: "#/components/schemas/Contact" }
        sticker:
          type: object
          description: |
            Sticker / GIF attachment — a REFERENCE only (the socket never carries
            bytes). Community-emitted in V1; see SOCKET_EVENTS §8.9.
          properties:
            objectKey: { type: string }
            url: { type: string, format: uri }
            packId: { type: string }
            stickerId: { type: string }
    MessageNewPayload:
      type: object
      description: |
        Server → client broadcast for every new message (§1/§9 canonical
        ChatMessage). Field names match the REST `ChatMessage` so the client uses
        ONE mapper; the legacy V1 aliases (messageId, conversationId,
        contentText, contentJson, sentAt) are kept for back-compat. The SAME shape
        is emitted on `message:edited`.
      properties:
        # ── canonical (REST ChatMessage names) ──
        id: { type: string, description: server id (== messageId). }
        clientMessageId:
          {
            type: string,
            description: "§2.1: echoed on the sender's own message for dedupe.",
          }
        roomId: { type: string }
        conversationType: { type: string, enum: [PRIVATE, GROUP] }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        senderRole:
          {
            type: string,
            description: "§2.2: ADMIN|MEMBER|… for groups; '' for private.",
          }
        receiverId: { type: string, description: private only; '' for groups. }
        contentType: { $ref: "#/components/schemas/ContentType" }
        content:
          allOf: [{ $ref: "#/components/schemas/MessageContent" }]
          description: "Structured body — the shared MessageContent shape (text, urls[] chat-only, files[], location, contact, sticker). forward-compat via additionalProperties."
        parentMessageId: { type: string }
        quoteData: { $ref: "#/components/schemas/QuoteData" }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
        isForwarded:
          { type: boolean, description: present on forwarded messages. }
        isDeleted: { type: boolean }
        deletedType: { type: string, description: 'forEveryone | forMe | "".' }
        editedAt: { type: integer, description: "epoch ms, 0 = never edited." }
        clientTs:
          {
            type: integer,
            description: "§5.1: client compose time (epoch ms), display-only.",
          }
        serverTs:
          { type: integer, description: server-authoritative time (epoch ms). }
        sequenceNumber:
          {
            type: integer,
            description: per-room monotonic sequence (sole ordering key).,
          }
        # ── V1-compat aliases ──
        messageId: { type: string }
        conversationId: { type: string }
        contentText: { type: string }
        contentJson: { type: string }
        sentAt: { type: integer, description: epoch ms (== serverTs). }
        systemEvent:
          type: string
          description: Set when contentType=SYSTEM.
          enum:
            [
              GROUP_CREATED,
              MEMBER_ADDED,
              MEMBER_JOINED,
              MEMBER_LEFT,
              MEMBER_REMOVED,
              ROLE_CHANGED,
              ROOM_RENAMED,
              AVATAR_CHANGED,
              DESCRIPTION_CHANGED,
            ]
        systemData:
          type: object
          description: actorId/actorName (+ targetUserId/targetName, newRole, newName where relevant).
          additionalProperties: true
      required:
        [
          id,
          roomId,
          conversationType,
          senderId,
          contentType,
          content,
          serverTs,
          sequenceNumber,
        ]
    MessageEditedPayload:
      description: |
        §9: emits the FULL canonical ChatMessage shape (identical to
        MessageNewPayload), not a thin {contentText,contentJson}. A client
        re-renders the edited bubble with the same mapper.
      allOf:
        - { $ref: "#/components/schemas/MessageNewPayload" }
    ListBumpLastMessage:
      type: object
      description: |
        Last-message preview for a chat/community list row. `contentType` is the
        UPPER-CASE kind; `text` is a ready-to-render preview string the client
        may show verbatim. Server convention by type (clients may localize):
        - `TEXT` → first ~200 chars of the body (truncated; `text` ≤512).
        - `IMAGE` → "📷 Photo"   · `VIDEO` → "🎥 Video"   · `GIF` → "🎞 GIF"
        - `DOCUMENT` → "📎 {filename}"   · `AUDIO` → "🎵 Audio"
        - `VOICE` → "🎤 Voice message"   · `STICKER` → "🌟 Sticker"
        - `LOCATION` → "📍 {placeName}"   · `CONTACT` → "👤 {contactName}"
        - `SYSTEM` → the rendered system-event sentence.
        For non-text types `text` is the placeholder above (never the raw body).
      properties:
        contentType: { $ref: "#/components/schemas/ContentType" }
        text: { type: string, maxLength: 512 }
    ConvUpdatedPayload:
      type: object
      description: Chat list bump-to-top hint (idempotent). Delivered to user:<id>.
      properties:
        type: { type: string, enum: [PRIVATE, GROUP] }
        roomId: { type: string }
        lastMessageId: { type: string }
        lastMessage: { $ref: "#/components/schemas/ListBumpLastMessage" }
        lastMessageAt: { type: integer, description: epoch ms. }
        senderId: { type: string }
        unread:
          {
            type: boolean,
            description: "v1 boolean hint: false on the sender's copy.",
          }
    CommunityUpdatedPayload:
      type: object
      description: Community list bump-to-top hint. Delivered on /chat to user:<id>.
      properties:
        communityId: { type: string }
        roomId: { type: string }
        lastMessageId: { type: string }
        lastMessage: { $ref: "#/components/schemas/ListBumpLastMessage" }
        lastMessageAt: { type: integer, description: epoch ms. }
        senderId: { type: string }
        unread: { type: boolean }
    CatchupEvent:
      type: object
      description: |
        A single gap-fill row. Catch-up INCLUDES tombstones: `forEveryone` deletes
        return with isDeleted=true (+deletedType) and edits carry editedAt, so an
        offline client reconciles. NOTE on `forMe`: forMe deletes are client-local
        (never broadcast, never flagged here) — a message you hid forMe MAY reappear
        on catch-up. Keep your own hiddenMessageIds set and re-apply it on render.
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        senderId: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        contentText: { type: string }
        contentJson: { type: string }
        sentAt: { type: integer, description: epoch ms. }
        sequenceNumber: { type: integer }
        isDeleted: { type: boolean }
        deletedType:
          {
            type: string,
            description: 'group tombstones only; "" for private.',
          }
        editedAt: { type: integer, description: "epoch ms, 0 if never edited." }
        systemEvent:
          {
            type: string,
            description: 'set for SYSTEM messages; "" otherwise.',
          }
        systemData:
          {
            type: string,
            description: 'JSON-encoded object for SYSTEM messages; "" otherwise.',
          }
    ChatCatchupResultPayload:
      type: object
      description: One emit per room (direct to socket), plus an aggregate ack.
      properties:
        roomId: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/CatchupEvent" }
        hasMore:
          { type: boolean, description: re-request with sinceSeq=lastSeq. }
        lastSeq:
          { type: integer, description: highest sequenceNumber in this page. }
      required: [roomId, events, hasMore, lastSeq]
    MessageReadReceiptPayload:
      type: object
      description: |
        Read receipt broadcast to the conversation room. PRIVATE only: groups and
        communities are sent + read aggregate only — there is NO per-member delivery
        receipt and NO per-member "seen by X of Y" in V1 (deferred to V2; see the
        info `Breaking changes` block / SOCKET_EVENTS §8.9). message:delivered is
        likewise private-only.
      properties:
        conversationId: { type: string }
        readerId: { type: string }
        upToMessageId: { type: string }
    ReadSyncPayload:
      type: object
      description: |
        §5.5: multi-device read high-water mark. Delivered to the reader's OWN
        devices (channel user:<readerId>) so every screen clears unread together.
        SCOPE: emitted on /chat for PRIVATE + GROUP rooms only. There is no
        community read_sync in V1 — community unread reconciles via bulk mark-read
        + the community:updated list hint (deferred to V2).
      properties:
        conversationId: { type: string }
        readerId: { type: string }
        read_to_seq:
          {
            type: integer,
            description: highest read sequenceNumber for this room.,
          }
        unreadCount: { type: integer }
        conversationType: { type: string, enum: [PRIVATE, GROUP] }
    PinUpdatedPayload:
      type: object
      description: "§2.5: pin/unpin banner broadcast to conv:<roomId>."
      properties:
        roomId: { type: string }
        conversationId: { type: string }
        messageId: { type: string }
        action: { type: string, enum: [pinned, unpinned] }
        pinnedBy: { type: string, description: present on action=pinned. }
        unpinnedBy: { type: string, description: present on action=unpinned. }
        pinnedAt: { type: integer, description: epoch ms (action=pinned). }
        pinnedCount: { type: integer }
    MessageDeliveredReceiptPayload:
      type: object
      properties:
        conversationId: { type: string }
        recipientId: { type: string }
        upToMessageId: { type: string }
        messageIds:
          type: array
          items: { type: string }
    MessageReactionPayload:
      type: object
      description: |
        §2.4: emits the grouped ChatReactionGroup[] shape (emoji/count/users)
        so the live reaction bar renders without a refetch. `selfReacted` is
        intentionally omitted — derive it client-side from users[].userId.
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
    MessageDeletePayload:
      type: object
      description: |
        §2.3: self-describing tombstone. conversationId lets a client route the
        delete even if the room isn't loaded; sequenceNumber locates the message.
        Client rule: on `type:"forEveryone"` hide for everyone; on `forMe` hide
        only when deletedBy === your own userId. forMe hides are client-local and
        may not survive a catch-up — re-apply your hiddenMessageIds on render.
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        type: { type: string, enum: [forEveryone, forMe] }
        deletedType:
          {
            type: string,
            description: "group/community: SELF_DELETE | ADMIN_DELETE.",
          }
        deletedBy: { type: string }
        sequenceNumber: { type: integer }
      required: [messageId, conversationId, type, deletedBy]
    TypingBroadcastPayload:
      type: object
      description: |
        Fire-and-forget typing signal re-emitted to the room. The server keeps NO
        typing state, so a crashed sender cannot be cleaned up server-side. EXPIRY
        CONTRACT: the RECEIVER auto-clears a "typing…" indicator after ~6 s with no
        fresh typing:start; the SENDER re-emits typing:start every ~3–5 s while
        typing and one typing:stop when it ends.
      properties:
        userId: { type: string }
        conversationId: { type: string }
    PresenceStatusPayload:
      type: object
      properties:
        userId: { type: string }
        isOnline: { type: boolean }
        # §2.7: epoch-ms INTEGERS (match REST ChatPresence.lastSeen), not strings.
        lastActiveAt: { type: integer, description: epoch ms. }
        lastSeen:
          {
            type: integer,
            nullable: true,
            description: "epoch ms; null while online.",
          }
    CallIncomingPayload:
      type: object
      properties:
        callId: { type: string }
        callerId: { type: string }
        callType: { type: string, enum: [AUDIO, VIDEO] }
    CallEndedPayload:
      type: object
      properties:
        callId: { type: string }
        endedBy: { type: string }
        durationSec: { type: integer }
    CallIceRecvPayload:
      type: object
      properties:
        callId: { type: string }
        candidate:
          oneOf:
            - { $ref: "#/components/schemas/IceCandidate" }
            - { type: string, maxLength: 1000 }
        from: { type: string }

    # -------- community payloads --------
    # NOTE: community messages use the SAME `ContentType` enum as /chat (UPPER-CASE).
    # The former lower-case `CommunityMessageType` was removed — there is one
    # content-type vocabulary across both namespaces (one client mapper).
    CommunityJoinPayload:
      type: object
      properties:
        communityId: { type: string }
        roomId: { type: string }
      required: [communityId, roomId]
    CommunityMessageSendPayload:
      type: object
      properties:
        communityId: { type: string, minLength: 1, maxLength: 200 }
        roomId: { type: string, minLength: 1, maxLength: 200 }
        clientMessageId: { type: string, maxLength: 200 }
        message:
          type: string
          default: ""
          maxLength: 4000
          description: "Message text. May be empty for non-text types (location, contact, sticker, gif, etc.)."
        contentType: { $ref: "#/components/schemas/ContentType" }
        media:
          type: object
          description: "Gallery / files attachment. One files[] array holds images, videos, documents, audio, voice notes, and GIFs."
          properties:
            files:
              type: array
              maxItems: 30
              items: { $ref: "#/components/schemas/FileAttachment" }
        location: { $ref: "#/components/schemas/Location" }
        contact: { $ref: "#/components/schemas/Contact" }
        sticker:
          type: object
          description: |
            Sticker / GIF attachment — a REFERENCE only; the socket never carries
            bytes. Discovery is client-side in V1: the client integrates the
            provider directly (Tenor/Giphy for GIFs, its own sticker catalog) and
            sends the resolved `url` (GIF) or `packId`+`stickerId`+`objectKey`
            (sticker). There is NO server-proxied sticker-pack / GIF-search API in
            V1 (deferred to V2 — see SOCKET_EVENTS §8.9).
          properties:
            objectKey: { type: string, maxLength: 500 }
            url: { type: string, format: uri, maxLength: 3000 }
            packId: { type: string, maxLength: 100 }
            stickerId: { type: string, maxLength: 100 }
        parentMessageId:
          type: string
          maxLength: 200
          description: "Optional. messageId of the message being replied to. Omit for top-level messages."
      required: [communityId, roomId, contentType]
    CommunityMessagesFetchPayload:
      type: object
      properties:
        roomId: { type: string }
        cursor:
          type: string
          format: date-time
          description: |
            ISO 8601 UTC timestamp (e.g. `"2025-01-15T10:00:00.000Z"`).
            Must not be in the future (a 5 s clock-skew grace window is
            applied server-side). Omit for the most recent page.
            Pass the `nextCursor` from the previous response to page
            backwards.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
          description: "Number of messages to return (default 30)."
      required: [roomId]
    CommunityMessageContent:
      description: |
        Deprecated alias of `MessageContent` — the single shared chat+community
        content shape. Kept so existing `$ref`s keep resolving; new refs should
        point at `MessageContent` directly.
      allOf:
        - { $ref: "#/components/schemas/MessageContent" }
    CommunityMessageNewPayload:
      type: object
      description: |
        Server → client broadcast for every new community message. Sender
        identity (senderName/senderAvatar) is resolved server-side; `contentType`
        is the single UPPER-CASE field for community message kind.
      properties:
        id: { type: string, description: server id (== messageId). }
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        content:
          allOf: [{ $ref: "#/components/schemas/MessageContent" }]
          description: "Structured body — the shared MessageContent shape (text, files[], location?, contact?, sticker?). forward-compat via additionalProperties."
        parentMessageId:
          {
            type: string,
            description: "messageId being replied to; '' for top-level.",
          }
        quoteData: { $ref: "#/components/schemas/QuoteData" }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
        message:
          {
            type: string,
            description: "V1 alias for content.text. `content.text` is authoritative.",
          }
        clientMessageId: { type: string }
        serverTs: { type: integer, description: epoch ms. }
        sentAt: { type: integer, description: epoch ms (== serverTs). }
    CommunityMemberDTO:
      type: object
      additionalProperties: true
      description: |
        Member snapshot for `community:member:joined`. NOTE: in V1 NO backend
        service publishes this event yet — the schema is reserved; the gateway
        will forward it verbatim once a producer exists.
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        role: { type: string, enum: [ADMIN, MODERATOR, MEMBER] }
        joinedAt: { type: integer, description: "epoch ms." }
      required: [userId]
    CommunityCatchupPayload:
      type: object
      properties:
        rooms:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              roomId: { type: string }
              sinceId:
                type: string
                description: "Exclusive lower bound — last message id the client already has. Omit for first load. Mutually exclusive with sinceTs; sinceTs takes precedence."
              sinceTs:
                type: integer
                description: "Epoch-ms alternative cursor. When > 0 the server switches to an updatedAt-based query that surfaces edits, reaction changes, and tombstones in addition to new messages. Use after returning from background. Mutually exclusive with sinceId."
              limit: { type: integer, maximum: 200 }
            required: [roomId]
      required: [rooms]
    CommunityCatchupEventDto:
      type: object
      properties:
        messageId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        message: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        sentAt: { type: integer, description: "epoch ms." }
        isDeleted: { type: boolean }
        deletedType:
          type: string
          description: 'Value is "forEveryone", "forMe", or "" (empty string when not deleted).'
        editedAt: { type: integer, description: "epoch ms; 0 if not edited." }
        syncEventType:
          type: string
          enum: [new, edited, deleted, reacted]
          description: |
            What happened to this message since the cursor.
            - `new` — insertion-ordered new message (sinceId mode) or genuinely new (sinceTs mode)
            - `edited` — message text was changed
            - `deleted` — message was deleted for everyone (tombstone)
            - `reacted` — only reactions changed (sinceTs mode only)
        reactions:
          type: array
          description: "Current grouped reaction state at the time of catch-up."
          items: { $ref: "#/components/schemas/ReactionGroup" }
    CommunityCatchupResultPayload:
      type: object
      description: |
        Server → client per room in response to `community:catchup`.
        One event emitted per requested room. Store `lastId` as the next `sinceId`,
        or `nextTs` as the next `sinceTs` when using the updatedAt-cursor mode.
      properties:
        roomId: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/CommunityCatchupEventDto" }
        hasMore: { type: boolean }
        lastId:
          type: string
          description: "id of the last returned message; pass as sinceId on the next reconnect (sinceId mode)."
        nextTs:
          type: integer
          description: "Epoch-ms of the last event's updatedAt. Pass as sinceTs on the next call to continue paging in sinceTs mode. 0 in sinceId mode."
      required: [roomId, events, hasMore, lastId]

    CommunityMessageReactPayload:
      type: object
      properties:
        messageId: { type: string, minLength: 1, maxLength: 200 }
        communityId: { type: string, minLength: 1, maxLength: 200 }
        emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: "A single emoji grapheme (same rule as chat). Sending it again toggles it off."
      required: [messageId, communityId, emoji]
    CommunityMessageReactionPayload:
      type: object
      description: Broadcast to all members of the community room after any react/unreact. Contains the full updated reaction state — clients replace, not merge.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
      required: [messageId, communityId, reactions]

    # ---- community edit/delete/pin/unpin payloads ----
    CommunityMessageEditPayload:
      type: object
      description: Client → server. Edit the text of an own community message (within the edit window).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        content:
          type: object
          properties:
            text: { type: string, minLength: 1, maxLength: 4000 }
          required: [text]
      required: [messageId, communityId, roomId, content]
    CommunityMessageEditedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after a successful edit.
        Clients update the matching message in-place. Edit is text-only in V1; merge
        `message` + `editedAt` into the existing message in place (non-text edits are
        rejected server-side).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        message: { type: string, description: "Updated text content." }
        contentType: { $ref: "#/components/schemas/ContentType" }
        editedAt:
          { type: integer, description: "Epoch ms when the edit was applied." }
      required: [messageId, communityId, roomId, senderId, message, editedAt]
    CommunityMessageDeletePayload:
      type: object
      description: |
        Client → server. Delete a community message.
        `forEveryone` — only sender / moderator / admin. Broadcasts a tombstone.
        `forMe` — any participant; message hidden for the caller only (no broadcast).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        type:
          type: string
          enum: [forEveryone, forMe]
      required: [messageId, communityId, roomId, type]
    CommunityMessageDeletedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after a `forEveryone` delete.
        Clients replace the message body with a tombstone placeholder.
        NOT emitted for `forMe` deletes.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        deleteType: { type: string, enum: [forEveryone, forMe] }
        deletedBy:
          {
            type: string,
            description: "userId of the actor who deleted the message.",
          }
      required: [messageId, communityId, roomId, deleteType, deletedBy]
    CommunityMessagePinPayload:
      type: object
      description: "Client → server. Pin a message (moderator / admin only)."
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
      required: [messageId, communityId, roomId]
    CommunityMessagePinnedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after a pin.
        Clients show / update the pinned-message banner.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        pinnedIds:
          type: array
          items: { type: string }
          description: "Complete list of pinned message IDs in this room after this pin."
        pinnedCount: { type: integer }
        pinnedAt: { type: integer, description: "Epoch ms when pinned." }
        pinnedBy:
          {
            type: string,
            description: "userId of the moderator/admin who pinned.",
          }
      required:
        [
          messageId,
          communityId,
          roomId,
          pinnedIds,
          pinnedCount,
          pinnedAt,
          pinnedBy,
        ]
    CommunityMessageUnpinPayload:
      type: object
      description: "Client → server. Unpin a message (moderator / admin only)."
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
      required: [messageId, communityId, roomId]
    CommunityMessageUnpinnedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after an unpin.
        Clients hide / update the pinned-message banner.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        pinnedIds:
          type: array
          items: { type: string }
          description: "Complete list of remaining pinned message IDs after this unpin."
        pinnedCount: { type: integer }
        unpinnedBy:
          {
            type: string,
            description: "userId of the moderator/admin who unpinned.",
          }
      required:
        [messageId, communityId, roomId, pinnedIds, pinnedCount, unpinnedBy]

    # -------- notify payloads --------
    NotificationsFetchPayload:
      type: object
      properties:
        cursor: { type: string }
        limit: { type: integer, maximum: 100 }
    NotificationsMarkReadPayload:
      type: object
      properties:
        notificationIds:
          type: array
          maxItems: 500
          description: "Ids to mark read. An empty array marks ALL unread as read. Capped at 500 per call (matches the gateway Zod bound)."
          items: { type: string }
      required: [notificationIds]
    NotificationCountPayload:
      type: object
      description: "Aggregate unread only; no per-type breakdown in V1 — fetch the feed for category counts."
      properties:
        count: { type: integer }
      required: [count]
    NotificationItem:
      type: object
      description: |
        An in-app notification (the `notification:new` push and each row of the
        `notifications:fetch` ack). A stable envelope plus a `data` map of
        type-specific fields. The auth/OTP system events (email relays) are NOT
        delivered here. Treat unknown `type` values defensively — the set grows.
      properties:
        notificationId: { type: string }
        id:
          type: string
          description: |
            Deprecated alias of `notificationId` present in some legacy payloads.
            Prefer `notificationId`. Clients should coalesce: `notificationId ?? id`.
            This alias will be removed in V2.
        type:
          type: string
          description: |
            Discriminator. Known in-app values:
            `MESSAGE` · `friend.requested` · `friend.accepted` ·
            `community.join_requested` · `community.member_added` ·
            `community.admin_transferred` · `community.member_role_changed` ·
            `community.member_kicked` · `community.member_banned` ·
            `community.invite_sent` · `community.invite_accepted` ·
            `community.report_created` · `community.report_actioned` ·
            `community.deleted`.
        title: { type: string }
        body: { type: string }
        referenceId:
          {
            type: string,
            description: "primary context id (conversationId / friendshipId / communityId …).",
          }
        isRead: { type: boolean }
        createdAt: { type: integer, description: "epoch ms." }
        data:
          type: object
          additionalProperties: { type: string }
          description: |
            Type-specific fields (FCM-style — all string values). For `MESSAGE`:
            `{ conversationId, conversationType, messageId, clientMessageId,
            senderId, senderName, senderAvatar, contentType, preview, sentAt }`.
            For `friend.*`: `{ friendshipId, requesterId | addresseeId }`.
            For `community.*`: `{ communityId, … }`.
      required: [type]
