    CommunityMemberBan:
      name: "community.member.ban"
      title: "community.member.ban"
      summary: "Ban a member from the community (moderator / admin only)."
      payload: { $ref: "#/components/schemas/CommunityModerateMemberPayload" }
      examples:
        - name: Ban a member
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            targetUserId: "user_def456"
            reason: "Harassment"
    CommunityMemberUnban:
      name: "community.member.unban"
      title: "community.member.unban"
      summary: "Lift a member's ban (moderator / admin only)."
      payload: { $ref: "#/components/schemas/CommunityMemberRef" }
      examples:
        - name: Unban a member
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            targetUserId: "user_def456"
    CommunityAdminTransfer:
      name: "community.admin.transfer"
      title: "community.admin.transfer"
