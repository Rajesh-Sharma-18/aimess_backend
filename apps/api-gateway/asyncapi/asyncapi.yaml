    TypingStartRequest:
      name: "typing:start"
      title: "typing:start (request)"
      summary: |
        Fire-and-forget. Re-emit every ~3–5 s while still typing; send one
        typing:stop when typing ends.
        Server-side auto-expiry: the gateway keeps a per-socket 6 s countdown.
        If typing:stop is never received (crash / network drop), the server
        broadcasts typing:stop automatically after 6 s. On disconnect all
        pending timers are flushed and typing:stop is broadcast for every
        active conversation. The RECEIVER should also auto-clear after ~6 s
        without a fresh typing:start (belt-and-suspenders).
      payload: { $ref: "#/components/schemas/TypingRequestPayload" }
      examples:
        - name: Start typing indicator
          payload:
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
        - name: Start typing with sender name (avoids a profile fetch on the peer)
          payload:
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
            senderName: "Alice"
    TypingStopRequest:
      name: "typing:stop"
      title: "typing:stop (request)"
      payload: { $ref: "#/components/schemas/TypingRequestPayload" }
      examples:
        - name: Stop typing indicator
          payload:
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
    RecordingStartRequest:
      name: "recording:start"
      title: "recording:start (request)"
      summary: |
        Fire-and-forget. Sent when the local user starts recording a voice
        message. Same expiry contract as `typing:start`: the gateway keeps a
        per-socket 6 s countdown and auto-broadcasts `recording:stop` if the
        stop event is never received (crash / network drop). On disconnect
        all pending timers are flushed and `recording:stop` is broadcast for
        every conversation the socket was recording in. Payload and
        validator (`TypingSchema`, chat.ns.ts) are identical to `typing:start`
        — reused as-is, no new schema.
      payload: { $ref: "#/components/schemas/TypingRequestPayload" }
      examples:
        - name: Start recording a voice message
          payload:
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
        - name: Start recording with sender name (avoids a profile fetch on the peer)
          payload:
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
            senderName: "Alice"
    RecordingStopRequest:
      name: "recording:stop"
      title: "recording:stop (request)"
      summary: |
        Sent when the recording ends (send, cancel, or discard). No ack.
      payload: { $ref: "#/components/schemas/TypingRequestPayload" }
      examples:
        - name: Stop recording a voice message
          payload:
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
