            conversationType: group
    MessageEdit:
      name: "message:edit"
      title: "message:edit"
      payload: { $ref: "#/components/schemas/MessageEditPayload" }
      examples:
        - name: Edit a text message
          payload:
            messageId: "msg_9876543210abcdef"
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
