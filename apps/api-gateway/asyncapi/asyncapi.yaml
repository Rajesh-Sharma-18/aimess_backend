            messageId: "683abc123def456789012345"
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            roomId: "6843e1a2b5c3d4e5f6a7b8c9"
            pinnedIds: ["683abc123def456789012345"]
            pinnedCount: 1
            pinnedAt: 1749466100000
            pinnedBy: "user_mod001"
    CommunityMessageUnpin:
      name: "community:message:unpin"
      title: "community:message:unpin"
      summary: Unpin a message in the community room (moderator / admin only).
      payload: { $ref: "#/components/schemas/CommunityMessageUnpinPayload" }
      examples:
        - name: Unpin a message
          payload:
            messageId: "683abc123def456789012345"
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            roomId: "6843e1a2b5c3d4e5f6a7b8c9"
    CommunityMessageUnpinned:
      name: "community:message:unpinned"
      title: "community:message:unpinned"
      summary: Broadcast to all room members when a message is unpinned.
      payload: { $ref: "#/components/schemas/CommunityMessageUnpinnedPayload" }
      examples:
        - name: Message unpinned broadcast
          payload:
            messageId: "683abc123def456789012345"
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            roomId: "6843e1a2b5c3d4e5f6a7b8c9"
            pinnedIds: []
            pinnedCount: 0
            unpinnedBy: "user_mod001"

    # -------- /notify --------
    NotificationsFetch:
      name: "notifications:fetch"
      title: "notifications:fetch"
      payload: { $ref: "#/components/schemas/NotificationsFetchPayload" }
      examples:
        - name: Fetch latest notifications
          payload:
            limit: 20
        - name: Fetch next page
          payload:
            cursor: "683abc100def000000000099"
            limit: 20
    NotificationsMarkRead:
      name: "notifications:mark_read"
      title: "notifications:mark_read"
      payload: { $ref: "#/components/schemas/NotificationsMarkReadPayload" }
      examples:
        - name: Mark two notifications as read
          payload:
            notificationIds:
              - "683abc100def000000000099"
              - "683abc100def000000000098"
        - name: Mark all as read
          payload:
            notificationIds: []
    NotificationCount:
      name: "notification:count"
      title: "notification:count"
      payload: { $ref: "#/components/schemas/NotificationCountPayload" }
      examples:
        - name: Five unread notifications
          payload:
            count: 5
        - name: All notifications read
          payload:
            count: 0
    NotificationForwarded:
      name: "notification:forwarded"
      title: "forwarded notification event"
      summary: |
        Any event published to notify:<userId> is forwarded verbatim. The event
        name and payload are defined by notifications-service; shape is open.
      payload: { $ref: "#/components/schemas/AnyObject" }
      examples:
        - name: New message push notification
          payload:
            type: MESSAGE
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
            conversationType: private
            messageId: "msg_9876543210abcdef"
            preview: "Hey! How are you?"
            senderId: "user_abc123"
            sentAt: 1749465231234

  schemas:
    # -------- generic --------
    AckEnvelope:
      type: object
      description: Ack callback envelope. `success` discriminates the two shapes.
      properties:
        success: { type: boolean }
        data:
          type: object
          description: Present on success — the gRPC result (shape varies per event).
          additionalProperties: true
        error:
          type: string
          enum: [INVALID_PAYLOAD, SERVICE_ERROR]
          description: Present on failure.
      required: [success]
    AnyObject:
      type: object
      additionalProperties: true
    ConversationRef:
      type: object
      properties:
        conversationId: { type: string }
      required: [conversationId]
    CommunityRef:
      type: object
      properties:
        communityId: { type: string }
      required: [communityId]
    CallRef:
      type: object
      properties:
        callId: { type: string }
      required: [callId]
    ConversationType:
      type: string
      enum: [private, group]
      default: private
      description: Case-insensitive; selects private vs group code path.
    ContentType:
      type: string
      enum: [TEXT, IMAGE, VIDEO, FILE, AUDIO, LOCATION, CONTACT, SYSTEM]

    # -------- chat send payloads --------
    FileAttachment:
      type: object
      description: Either objectKey or url is expected.
      properties:
        objectKey: { type: string }
        url: { type: string }
        name: { type: string }
        size: { type: integer }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
        blurhash:
          {
            type: string,
            description: "§3.5: blur preview for image/video (instant aspect-ratio render).",
          }
        waveform:
          type: array
          items: { type: number }
          description: "§3.5: voice-note amplitude samples (render bars pre-download)."
    Location:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
        placeName: { type: string }
        placeAddress: { type: string }
    Contact:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        avatar: { type: string }
        userId: { type: string }
    MessageSendPayload:
      type: object
      description: |
        Message send payload (client → server). The server derives sender
        identity from the authenticated socket — clients never stamp their own
        `senderId`. `clientTs` (epoch ms) is the optional display-only compose time.
      properties:
        conversationId: { type: string }
        clientMessageId:
          { type: string, description: Client-generated idempotency key. }
        contentType: { $ref: "#/components/schemas/ContentType" }
        contentText: { type: string }
        mediaKey: { type: string, description: Single object-key shorthand. }
        files:
          type: array
          items: { $ref: "#/components/schemas/FileAttachment" }
        urls:
          type: array
          items: { type: string }
        location: { $ref: "#/components/schemas/Location" }
        contact: { $ref: "#/components/schemas/Contact" }
        repliedToId: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
        receiverId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        clientTs:
          {
            type: integer,
            description: "§5.1: client compose time (epoch ms), display-only.",
          }
      required: [conversationId, clientMessageId, contentType]
    ReadUpTo:
      type: object
      properties:
        conversationId: { type: string }
        upToMessageId: { type: string }
      required: [conversationId, upToMessageId]
    MessageReactPayload:
      type: object
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        emoji: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId, emoji]
    MessageReactionsGetPayload:
      type: object
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId]
    MessageEditPayload:
      type: object
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        contentText: { type: string }
        contentJson: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId]
    MessageForwardPayload:
      type: object
      properties:
        messageId: { type: string }
        targetConversationId: { type: string }
        clientMessageId: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
        receiverId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
      required: [messageId, targetConversationId, clientMessageId]
    MessagesFetchPayload:
      type: object
      properties:
        conversationId: { type: string }
        cursor: { type: string }
        limit: { type: integer, maximum: 100 }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [conversationId]
    ChatCatchupPayload:
      type: object
      properties:
        rooms:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              roomId: { type: string }
              sinceSeq: { type: integer, minimum: 0, default: 0 }
              conversationType:
                { $ref: "#/components/schemas/ConversationType" }
              limit: { type: integer, minimum: 1, maximum: 200, default: 100 }
            required: [roomId]
      required: [rooms]
    PresenceHeartbeatPayload:
      type: object
      properties:
        appState: { type: string, default: FOREGROUND }
    PeerIds:
      type: object
      properties:
        peerIds:
          type: array
          maxItems: 500
          items: { type: string }
      required: [peerIds]
    CallInitiatePayload:
      type: object
      properties:
        calleeId: { type: string }
        type: { type: string, enum: [AUDIO, VIDEO] }
        privateRoomId: { type: string }
      required: [calleeId]
    CallIceSendPayload:
      type: object
      properties:
        callId: { type: string }
        candidate:
          description: WebRTC ICE candidate (opaque to the backend).
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: string }
      required: [callId, candidate]

    # -------- chat receive payloads --------
    QuoteData:
      type: object
      description: "§9: canonical reply snapshot (survives parent eviction)."
      nullable: true
      properties:
        messageId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        messageType: { $ref: "#/components/schemas/ContentType" }
        preview: { type: string }
        isDeleted: { type: boolean }
    ReactionGroup:
      type: object
      description: "§2.4: grouped reaction (selfReacted derived client-side from users[])."
      properties:
        emoji: { type: string }
        count: { type: integer }
        users:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              displayName: { type: string }
              avatar: { type: string }
    MessageNewPayload:
      type: object
      description: |
        Server → client broadcast for every new message (§1/§9 canonical
        ChatMessage). Field names match the REST `ChatMessage` so the client uses
        ONE mapper; the legacy V1 aliases (messageId, conversationId, contentType,
        contentText, contentJson, sentAt) are kept for back-compat. The SAME shape
        is emitted on `message:edited`.
      properties:
        # ── canonical (REST ChatMessage names) ──
        id: { type: string, description: server id (== messageId). }
        clientMessageId:
          {
            type: string,
            description: "§2.1: echoed on the sender's own message for dedupe.",
          }
        roomId: { type: string }
        conversationType: { type: string, enum: [PRIVATE, GROUP] }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        senderRole:
          {
            type: string,
            description: "§2.2: ADMIN|MEMBER|… for groups; '' for private.",
          }
        receiverId: { type: string, description: private only; '' for groups. }
        messageType: { $ref: "#/components/schemas/ContentType" }
        content:
          type: object
          description: "structured body { text, files[], location, contact, sticker }."
          additionalProperties: true
        parentMessageId: { type: string }
        quoteData: { $ref: "#/components/schemas/QuoteData" }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
        isForwarded:
          { type: boolean, description: present on forwarded messages. }
        isDeleted: { type: boolean }
        deletedType: { type: string, description: 'forEveryone | forMe | "".' }
        editedAt: { type: integer, description: "epoch ms, 0 = never edited." }
        clientTs:
          {
            type: integer,
            description: "§5.1: client compose time (epoch ms), display-only.",
          }
        serverTs:
          { type: integer, description: server-authoritative time (epoch ms). }
        sequenceNumber:
          {
            type: integer,
            description: per-room monotonic sequence (sole ordering key).,
          }
        # ── V1-compat aliases ──
        messageId: { type: string }
        conversationId: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        contentText: { type: string }
        contentJson: { type: string }
        sentAt: { type: integer, description: epoch ms (== serverTs). }
        systemEvent:
          type: string
          description: Set when messageType=SYSTEM.
          enum:
            [
              GROUP_CREATED,
              MEMBER_ADDED,
              MEMBER_JOINED,
              MEMBER_LEFT,
              MEMBER_REMOVED,
              ROLE_CHANGED,
              ROOM_RENAMED,
              AVATAR_CHANGED,
              DESCRIPTION_CHANGED,
            ]
        systemData:
          type: object
          description: actorId/actorName (+ targetUserId/targetName, newRole, newName where relevant).
          additionalProperties: true
      required:
        [
          id,
          roomId,
          conversationType,
          senderId,
          messageType,
          content,
          serverTs,
          sequenceNumber,
        ]
    MessageEditedPayload:
      description: |
        §9: emits the FULL canonical ChatMessage shape (identical to
        MessageNewPayload), not a thin {contentText,contentJson}. A client
        re-renders the edited bubble with the same mapper.
      allOf:
        - { $ref: "#/components/schemas/MessageNewPayload" }
    ListBumpLastMessage:
      type: object
      properties:
        contentType: { $ref: "#/components/schemas/ContentType" }
        text: { type: string }
    ConvUpdatedPayload:
      type: object
      description: Chat list bump-to-top hint (idempotent). Delivered to user:<id>.
      properties:
        type: { type: string, enum: [PRIVATE, GROUP] }
        roomId: { type: string }
        lastMessageId: { type: string }
        lastMessage: { $ref: "#/components/schemas/ListBumpLastMessage" }
        lastMessageAt: { type: integer, description: epoch ms. }
        senderId: { type: string }
        unread:
          {
            type: boolean,
            description: "v1 boolean hint: false on the sender's copy.",
          }
    CommunityUpdatedPayload:
      type: object
      description: Community list bump-to-top hint. Delivered on /chat to user:<id>.
      properties:
        communityId: { type: string }
        roomId: { type: string }
        lastMessageId: { type: string }
        lastMessage: { $ref: "#/components/schemas/ListBumpLastMessage" }
        lastMessageAt: { type: integer, description: epoch ms. }
        senderId: { type: string }
        unread: { type: boolean }
    CatchupEvent:
      type: object
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        senderId: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        contentText: { type: string }
        contentJson: { type: string }
        sentAt: { type: integer, description: epoch ms. }
        sequenceNumber: { type: integer }
        isDeleted: { type: boolean }
        deletedType:
          {
            type: string,
            description: 'group tombstones only; "" for private.',
          }
        editedAt: { type: integer, description: "epoch ms, 0 if never edited." }
        systemEvent:
          {
            type: string,
            description: 'set for SYSTEM messages; "" otherwise.',
          }
        systemData:
          {
            type: string,
            description: 'JSON-encoded object for SYSTEM messages; "" otherwise.',
          }
    ChatCatchupResultPayload:
      type: object
      description: One emit per room (direct to socket), plus an aggregate ack.
      properties:
        roomId: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/CatchupEvent" }
        hasMore:
          { type: boolean, description: re-request with sinceSeq=lastSeq. }
        lastSeq:
          { type: integer, description: highest sequenceNumber in this page. }
      required: [roomId, events, hasMore, lastSeq]
    MessageReadReceiptPayload:
      type: object
      description: Read receipt broadcast to the conversation room (private only).
      properties:
        conversationId: { type: string }
        readerId: { type: string }
        upToMessageId: { type: string }
    ReadSyncPayload:
      type: object
      description: |
        §5.5: multi-device read high-water mark. Delivered to the reader's OWN
        devices (channel user:<readerId>) so every screen clears unread together.
      properties:
        conversationId: { type: string }
        readerId: { type: string }
        read_to_seq:
          {
            type: integer,
            description: highest read sequenceNumber for this room.,
          }
        unreadCount: { type: integer }
        conversationType: { type: string, enum: [PRIVATE, GROUP] }
    PinUpdatedPayload:
      type: object
      description: "§2.5: pin/unpin banner broadcast to conv:<roomId>."
      properties:
        roomId: { type: string }
        conversationId: { type: string }
        messageId: { type: string }
        action: { type: string, enum: [pinned, unpinned] }
        pinnedBy: { type: string, description: present on action=pinned. }
        unpinnedBy: { type: string, description: present on action=unpinned. }
        pinnedAt: { type: integer, description: epoch ms (action=pinned). }
        pinnedCount: { type: integer }
    MessageDeliveredReceiptPayload:
      type: object
      properties:
        conversationId: { type: string }
        recipientId: { type: string }
        upToMessageId: { type: string }
        messageIds:
          type: array
          items: { type: string }
    MessageReactionPayload:
      type: object
      description: |
        §2.4: emits the grouped ChatReactionGroup[] shape (emoji/count/users)
        so the live reaction bar renders without a refetch. `selfReacted` is
        intentionally omitted — derive it client-side from users[].userId.
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
    MessageDeletePayload:
      type: object
      description: |
        §2.3: self-describing tombstone. conversationId lets a client route the
        delete even if the room isn't loaded; sequenceNumber locates the message.
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        type: { type: string, enum: [forEveryone, forMe] }
        deletedType:
          {
            type: string,
            description: "group/community: SELF_DELETE | ADMIN_DELETE.",
          }
        deletedBy: { type: string }
        sequenceNumber: { type: integer }
      required: [messageId, conversationId, type, deletedBy]
    TypingBroadcastPayload:
      type: object
      properties:
        userId: { type: string }
        conversationId: { type: string }
    PresenceStatusPayload:
      type: object
      properties:
        userId: { type: string }
        isOnline: { type: boolean }
        # §2.7: epoch-ms INTEGERS (match REST ChatPresence.lastSeen), not strings.
        lastActiveAt: { type: integer, description: epoch ms. }
        lastSeen:
          {
            type: integer,
            nullable: true,
            description: "epoch ms; null while online.",
          }
    CallIncomingPayload:
      type: object
      properties:
        callId: { type: string }
        callerId: { type: string }
        type: { type: string, enum: [AUDIO, VIDEO] }
    CallEndedPayload:
      type: object
      properties:
        callId: { type: string }
        endedBy: { type: string }
        durationSec: { type: integer }
    CallIceRecvPayload:
      type: object
      properties:
        callId: { type: string }
        candidate:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: string }
        from: { type: string }

    # -------- community payloads --------
    CommunityMessageType:
      type: string
      enum:
        [
          text,
          image,
          video,
          voice,
          audio,
          document,
          gif,
          location,
          contact,
          sticker,
          custom,
        ]
      description: |
        Community message type (lower-case). `text` — plain text (emojis included).
        `image`/`video`/`gif`/`voice`/`audio`/`document` — require `media.files[]`.
        `location` — requires `location` field.
        `contact` — requires `contact` field.
        `sticker` — requires `sticker` field.
        `custom` — reserved for backward compatibility with legacy stored messages.
    CommunityJoinPayload:
      type: object
      properties:
        communityId: { type: string }
        roomId: { type: string }
      required: [communityId, roomId]
    CommunityMessageSendPayload:
      type: object
      properties:
        communityId: { type: string }
        roomId: { type: string }
        clientMessageId: { type: string }
        message:
          type: string
          default: ""
          description: "Message text. May be empty for non-text types (location, contact, sticker, gif, etc.)."
        messageType: { $ref: "#/components/schemas/CommunityMessageType" }
        media:
          type: object
          description: "Gallery / files attachment. One files[] array holds images, videos, documents, audio, voice notes, and GIFs."
          properties:
            files:
              type: array
              items: { $ref: "#/components/schemas/FileAttachment" }
        location: { $ref: "#/components/schemas/Location" }
        contact: { $ref: "#/components/schemas/Contact" }
        sticker:
          type: object
          description: "Sticker attachment."
          properties:
            objectKey: { type: string }
            url: { type: string }
            packId: { type: string }
            stickerId: { type: string }
        parentMessageId:
          type: string
          description: "Optional. messageId of the message being replied to. Omit for top-level messages."
      required: [communityId, roomId, messageType]
    CommunityMessagesFetchPayload:
      type: object
      properties:
        roomId: { type: string }
        cursor: { type: string }
        limit: { type: integer, maximum: 100 }
      required: [roomId]
    CommunityMessageNewPayload:
      type: object
      description: |
        Server → client broadcast for every new community message. Sender
        identity (senderName/senderAvatar) is resolved server-side; messageType
        is lower-case (community enum); `contentType` is an UPPER-CASE V1 alias.
      properties:
        id: { type: string, description: server id (== messageId). }
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        messageType: { $ref: "#/components/schemas/CommunityMessageType" }
        content:
          type: object
          description: "structured body { text, files[], location?, contact?, sticker? }."
          additionalProperties: true
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
        message: { type: string, description: V1 alias for content.text. }
        contentType: { $ref: "#/components/schemas/ContentType" }
        clientMessageId: { type: string }
        serverTs: { type: integer, description: epoch ms. }
        sentAt: { type: integer, description: epoch ms (== serverTs). }
    CommunityMemberDTO:
      type: object
      description: Member DTO forwarded verbatim from the Redis channel.
      additionalProperties: true
    CommunityCatchupPayload:
      type: object
      properties:
        rooms:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              roomId: { type: string }
              sinceId:
                type: string
                description: "Exclusive lower bound — last message id the client already has. Omit for first load. Mutually exclusive with sinceTs; sinceTs takes precedence."
              sinceTs:
                type: integer
                description: "Epoch-ms alternative cursor. When > 0 the server switches to an updatedAt-based query that surfaces edits, reaction changes, and tombstones in addition to new messages. Use after returning from background. Mutually exclusive with sinceId."
              limit: { type: integer, maximum: 200 }
            required: [roomId]
      required: [rooms]
    CommunityCatchupEventDto:
      type: object
      properties:
        messageId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        message: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        sentAt: { type: integer, description: "epoch ms." }
        isDeleted: { type: boolean }
        deletedType: { type: string }
        editedAt: { type: integer, description: "epoch ms; 0 if not edited." }
        syncEventType:
          type: string
          enum: [new, edited, deleted, reacted]
          description: |
            What happened to this message since the cursor.
            - `new` — insertion-ordered new message (sinceId mode) or genuinely new (sinceTs mode)
            - `edited` — message text was changed
            - `deleted` — message was deleted for everyone (tombstone)
            - `reacted` — only reactions changed (sinceTs mode only)
        reactions:
          type: array
          description: "Current grouped reaction state at the time of catch-up."
          items: { $ref: "#/components/schemas/CommunityReactionGroupDto" }
    CommunityCatchupResultPayload:
      type: object
      description: |
        Server → client per room in response to `community:catchup`.
        One event emitted per requested room. Store `lastId` as the next `sinceId`,
        or `nextTs` as the next `sinceTs` when using the updatedAt-cursor mode.
      properties:
        roomId: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/CommunityCatchupEventDto" }
        hasMore: { type: boolean }
        lastId:
          type: string
          description: "id of the last returned message; pass as sinceId on the next reconnect (sinceId mode)."
        nextTs:
          type: integer
          description: "Epoch-ms of the last event's updatedAt. Pass as sinceTs on the next call to continue paging in sinceTs mode. 0 in sinceId mode."
      required: [roomId, events, hasMore, lastId]

    CommunityMessageReactPayload:
      type: object
      properties:
        messageId: { type: string }
        communityId: { type: string }
        emoji: { type: string }
      required: [messageId, communityId, emoji]
    CommunityReactionUserDto:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        avatar: { type: string }
      required: [userId, displayName, avatar]
    CommunityReactionGroupDto:
      type: object
      properties:
        emoji: { type: string }
        count: { type: integer }
        users:
          type: array
          items: { $ref: "#/components/schemas/CommunityReactionUserDto" }
      required: [emoji, count, users]
    CommunityMessageReactionPayload:
      type: object
      description: Broadcast to all members of the community room after any react/unreact. Contains the full updated reaction state — clients replace, not merge.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/CommunityReactionGroupDto" }
      required: [messageId, communityId, reactions]

    # ---- community edit/delete/pin/unpin payloads ----
    CommunityMessageEditPayload:
      type: object
      description: Client → server. Edit the text of an own community message (within the edit window).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        content:
          type: object
          properties:
            text: { type: string, minLength: 1, maxLength: 4000 }
          required: [text]
      required: [messageId, communityId, roomId, content]
    CommunityMessageEditedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after a successful edit.
        Clients update the matching message in-place.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        message: { type: string, description: "Updated text content." }
        messageType: { $ref: "#/components/schemas/ContentType" }
        contentType: { $ref: "#/components/schemas/ContentType" }
        editedAt:
          { type: integer, description: "Epoch ms when the edit was applied." }
      required: [messageId, communityId, roomId, senderId, message, editedAt]
    CommunityMessageDeletePayload:
      type: object
      description: |
        Client → server. Delete a community message.
        `forEveryone` — only sender / moderator / admin. Broadcasts a tombstone.
        `forMe` — any participant; message hidden for the caller only (no broadcast).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        type:
          type: string
          enum: [forEveryone, forMe]
      required: [messageId, communityId, roomId, type]
    CommunityMessageDeletedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after a `forEveryone` delete.
        Clients replace the message body with a tombstone placeholder.
        NOT emitted for `forMe` deletes.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        deleteType: { type: string, enum: [forEveryone, forMe] }
        deletedBy:
          {
            type: string,
            description: "userId of the actor who deleted the message.",
          }
      required: [messageId, communityId, roomId, deleteType, deletedBy]
    CommunityMessagePinPayload:
      type: object
      description: "Client → server. Pin a message (moderator / admin only)."
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
      required: [messageId, communityId, roomId]
    CommunityMessagePinnedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after a pin.
        Clients show / update the pinned-message banner.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        pinnedIds:
          type: array
          items: { type: string }
          description: "Complete list of pinned message IDs in this room after this pin."
        pinnedCount: { type: integer }
        pinnedAt: { type: integer, description: "Epoch ms when pinned." }
        pinnedBy:
          {
            type: string,
            description: "userId of the moderator/admin who pinned.",
          }
      required:
        [
          messageId,
          communityId,
          roomId,
          pinnedIds,
          pinnedCount,
          pinnedAt,
          pinnedBy,
        ]
    CommunityMessageUnpinPayload:
      type: object
      description: "Client → server. Unpin a message (moderator / admin only)."
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
      required: [messageId, communityId, roomId]
    CommunityMessageUnpinnedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after an unpin.
        Clients hide / update the pinned-message banner.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        pinnedIds:
          type: array
          items: { type: string }
          description: "Complete list of remaining pinned message IDs after this unpin."
        pinnedCount: { type: integer }
        unpinnedBy:
          {
            type: string,
            description: "userId of the moderator/admin who unpinned.",
          }
      required:
        [messageId, communityId, roomId, pinnedIds, pinnedCount, unpinnedBy]

    # -------- notify payloads --------
    NotificationsFetchPayload:
      type: object
      properties:
        cursor: { type: string }
        limit: { type: integer, maximum: 100 }
    NotificationsMarkReadPayload:
      type: object
      properties:
        notificationIds:
          type: array
          description: Empty array allowed.
          items: { type: string }
      required: [notificationIds]
    NotificationCountPayload:
      type: object
      properties:
        count: { type: integer }
      required: [count]
