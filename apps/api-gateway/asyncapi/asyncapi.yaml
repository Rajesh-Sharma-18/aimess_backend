    RecordingStartBroadcast:
      name: "recording:start"
      title: "recording:start (broadcast)"
      summary: |
        Broadcast to `conv:<conversationId>`, sender excluded (via
        `socket.to()`). Uses a separate per-socket timer map from typing, so
        an active typing indicator and an active recording indicator can
        coexist for the same conversation without interfering with each
        other. Payload shape is identical to `typing:start`.
      payload: { $ref: "#/components/schemas/TypingBroadcastPayload" }
      examples:
        - name: Peer started recording a voice message
          payload:
            userId: "user_abc123"
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
    RecordingStopBroadcast:
      name: "recording:stop"
      title: "recording:stop (broadcast)"
      summary: |
        Broadcast on explicit stop, 6 s TTL expiry, or sender disconnect
        (pending timers are flushed and this is broadcast for every
        in-progress recording).
      payload: { $ref: "#/components/schemas/TypingBroadcastPayload" }
      examples:
        - name: Peer stopped recording a voice message
          payload:
            userId: "user_abc123"
            conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
    PresenceStatus:
      name: "presence:status"
      title: "presence:status"
      payload: { $ref: "#/components/schemas/PresenceStatusPayload" }
      summary: |
        A watched peer's ONLINE/OFFLINE state changed. Emitted only on a real
        transition — never as a keepalive — and only to `presence:<subjectId>`,
        which is joined by `presence:subscribe` after a whoCanSeeOnlineStatus
        check. A user with several devices stays ONLINE until the LAST one goes.
      examples:
        - name: Peer came online
          payload:
            userId: "user_abc123"
            isOnline: true
            lastActiveAt: 1749465700000
            lastSeen: null
            version: 7
        - name: Peer went offline
          payload:
            userId: "user_abc123"
            isOnline: false
            lastActiveAt: 1749465700000
            lastSeen: 1749465700000
            version: 8
        - name: Presence access revoked (unfriended / setting changed)
          payload:
            userId: "user_abc123"
            isOnline: false
            lastSeen: null
