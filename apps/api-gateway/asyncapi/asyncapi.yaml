      name: "presence:unsubscribe_all"
      title: "presence:unsubscribe_all"
      summary: "Clear all peer presence subscriptions in one call"
      description: |
        Payload is ignored — send `{}`. Ack `data` is
        `{ unsubscribedCount: number }`. The socket's own `user:<userId>`
        identity room is NOT left.
      payload:
        type: object
        description: "No fields required — send an empty object."
      examples:
        - name: Clear all subscriptions
          payload: {}
    PresenceList:
      name: "presence:list"
      title: "presence:list"
      summary: "Query currently-watched peer IDs"
      description: |
        Payload is ignored — send `{}`. Ack `data` is
        `{ peerIds: string[] }` — IDs of all peers currently subscribed to
        via `presence:subscribe`. The socket's own userId is never included.
      payload:
        type: object
        description: "No fields required — send an empty object."
