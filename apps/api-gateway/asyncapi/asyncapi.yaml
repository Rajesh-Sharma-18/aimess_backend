  # -------------------------------------------------------------- /notify
  notify:
    address: /notify
    title: /notify namespace
    description: |
      Real-time in-app notification feed + unread badge count.

      **Real-time bridge (S1):** chat-service's createNotification gRPC (called by notifications-service consumers)
      publishes `notification:new` + `notification:count_update` to Redis channel `notify:<userId>`.

      **Inbox read (S2):** notifications are fetched + marked-read from chat-service (`:4004`),
      the same store that CreateNotification writes to. notifications-service (`:4006`) is FCM-only.

      **Push gating (S3):** for online users (active socket), FCM is suppressed — real-time
      socket delivery is sufficient. Offline users receive FCM push + inbox row on reconnect.

      The gateway subscribes each logged-in user to their `notify:<userId>` Redis channel and
      fans events to socket namespaces `/notify` (client connected to gateway).
    x-socketio-namespace: /notify
    messages:
      notificationsFetch: { $ref: "#/components/messages/NotificationsFetch" }
      notificationsMarkRead:
        { $ref: "#/components/messages/NotificationsMarkRead" }
      notificationsDelete: { $ref: "#/components/messages/NotificationsDelete" }
      notificationCount: { $ref: "#/components/messages/NotificationCount" }
      notificationCountUpdate:
        { $ref: "#/components/messages/NotificationCountUpdate" }
      notificationRead: { $ref: "#/components/messages/NotificationRead" }
      notificationAllRead: { $ref: "#/components/messages/NotificationAllRead" }
      notificationForwarded:
        { $ref: "#/components/messages/NotificationForwarded" }
      notificationDeleted: { $ref: "#/components/messages/NotificationDeleted" }
      mediaScanResult: { $ref: "#/components/messages/MediaScanResult" }
      communityJoinRequestUpdate:
