          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
    CommunityRecordingStop:
      name: "recording:stop"
      title: "recording:stop (request)"
      summary: >-
        Client emits when the recording ends (send, cancel, or discard).
        No ack. Canonical alias `community:recording:stop` also accepted.
      payload:
        type: object
        required: [communityId]
        properties:
          communityId: { type: string, minLength: 1 }
          roomId:
