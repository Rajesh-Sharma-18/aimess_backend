      summary: "Targeted notice to a just-banned viewer, immediately followed by a forced room eviction server-side. Never room-broadcast."
      payload: { $ref: "#/components/schemas/StreamBannedPayload" }
      examples:
        - name: Viewer banned from the stream
          payload:
            streamId: "684abc123def4567890123ff"
    StreamMemberMuted:
      name: "stream:member_muted"
      title: "stream:member_muted"
      summary: "Targeted notice that the recipient was muted. Never evicts — the viewer stays in the room, only the composer is disabled client-side."
      payload: { $ref: "#/components/schemas/StreamMemberMutedPayload" }
      examples:
        - name: Timed mute
          payload:
            streamId: "684abc123def4567890123ff"
            userId: "user_def456"
            mutedUntil: 1750004100000
            reason: "Spamming"
        - name: Indefinite mute (no reason given)
          payload:
            streamId: "684abc123def4567890123ff"
            userId: "user_def456"
            mutedUntil: 0
            reason: null
    StreamMemberUnmuted:
      name: "stream:member_unmuted"
      title: "stream:member_unmuted"
      summary: "Targeted notice that the recipient's mute was lifted."
      payload: { $ref: "#/components/schemas/StreamMemberUnmutedPayload" }
      examples:
        - name: Mute lifted
          payload:
            streamId: "684abc123def4567890123ff"
            userId: "user_def456"
    StreamReactNew:
      name: "stream:react:new"
      title: "stream:react:new"
      summary: "Ephemeral emoji reaction broadcast to the whole room. Never persisted — a live visual effect only."
      payload: { $ref: "#/components/schemas/StreamReactNewPayload" }
      examples:
        - name: Reaction broadcast
          payload:
            streamId: "684abc123def4567890123ff"
            userId: "user_abc123"
            emoji: "❤️"
    StreamError:
      name: "stream:error"
      title: "stream:error"
      summary: "Out-of-band error push. Currently emitted only when stream:join's access check itself fails (service outage), alongside a SERVICE_ERROR ack."
      payload: { $ref: "#/components/schemas/StreamErrorPayload" }
      examples:
        - name: Access-check service unavailable during join
          payload:
            streamId: "684abc123def4567890123ff"
            code: SERVICE_UNAVAILABLE

  schemas:
    # -------- generic --------
    AckEnvelope:
      type: object
      description: Ack callback envelope. `success` discriminates the two shapes.
      properties:
        success: { type: boolean }
        message:
          type: string
          description: |
            Always present (success AND failure). A localized, display-ready
            sentence describing the outcome — resolved from the shared `t()`
            catalog using the socket's `x-lang` / `Accept-Language` at handshake
            (defaults: English in dev, Vietnamese in prod). On success a
            confirmation (e.g. "Message sent successfully", "Joined the community
            successfully"); on failure a human-readable reason. Clients may show
            it directly; branch logic on `success`/`error`/`retryable`, not on
            this string.
        data:
          type: object
          description: Present on success — the gRPC result (shape varies per event).
          additionalProperties: true
        error:
          type: string
          enum:
            [
              INVALID_PAYLOAD,
              SERVICE_ERROR,
              FORBIDDEN,
              NOT_FOUND,
              RATE_LIMITED,
              CONFLICT,
            ]
          description: |
            Present on failure. Stable, branchable error codes:
            - `INVALID_PAYLOAD` — Zod validation failed at the gateway (fix the payload).
            - `SERVICE_ERROR` — downstream gRPC/service error (transient).
            - `FORBIDDEN` — authenticated but not allowed (not a participant/member, blocked, insufficient role).
            - `NOT_FOUND` — the target message/conversation/community does not exist.
            - `RATE_LIMITED` — a server rate limit tripped (back off).
            - `CONFLICT` — the operation conflicts with current state (e.g. already applied / edit window expired).
        detail:
          type: string
          description: |
            Present on failure **when the downstream service sent a specific
            reason**. The originating `AppError.messageKey` verbatim — a short
            UPPER_SNAKE_CASE catalog token, never free text (e.g.
            `CALL_ALREADY_IN_CALL`, `CALL_USER_BUSY`, `CHAT_FILE_TOO_LARGE`).

            `error` is a deliberately coarse taxonomy: several unrelated
            failures share one code — `FORBIDDEN` cannot separate
            `FRIENDSHIP_REQUIRED` from `CALL_BLOCKED` or `PRIVACY_BLOCKED`.
            Branch on `detail` when the distinction
            matters to the UI — e.g. `call:initiate` returns `CONFLICT` both
            when the CALLER is already on a call (`CALL_ALREADY_IN_CALL`,
            including on one of their OTHER devices — call state is per-user,
            not per-device) and when the CALLEE is busy (`CALL_USER_BUSY`).
            Treat an unknown or absent `detail` as "no extra information" and
            fall back to `error` + `message`.
        retryable:
          type: boolean
          description: |
            Present on failure. `true` when re-emitting the SAME payload may
            succeed later (`SERVICE_ERROR`, `RATE_LIMITED`); `false` for
            permanent failures (`INVALID_PAYLOAD`, `FORBIDDEN`, `NOT_FOUND`,
            `CONFLICT`) — do not blind-retry.

            For **`SERVICE_ERROR`** (retryable): use exponential backoff — start at 500 ms,
            double each attempt (with ±50% jitter), cap at 30 s, maximum **3 attempts**.
            Resend with the same `clientMessageId` (idempotency is guaranteed server-side).
            For **`RATE_LIMITED`** (retryable): back off for the full rate-limit window
            (use 30 s as a safe default if no `retryAfter` is present), then retry once.
        retryAfter:
          type: integer
          description: |
            Seconds until the rate-limit window resets. `ackError()`
            (`sockets/ack.ts`) emits it only when the caller passes one, so it is
            present on some `RATE_LIMITED` acks and absent on the rest — back off
            a fixed **30 s** window whenever it is missing.
      required: [success, message]
    MessageSendResult:
      type: object
      description: |
        `data` of the `message:send` and `message:forward` acks. The full message
        is ALSO broadcast as `message:new` to the conversation room. Numeric
        fields backed by gRPC int64 (`sentAt`, `sequenceNumber`) arrive on the
        **ack** as **strings** — coerce with `Number()` (see §3 numeric note).
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        sequenceNumber:
          {
            type: integer,
            description: "per-room monotonic seq (string on the ack).",
          }
        sentAt: { type: integer, description: "epoch ms (string on the ack)." }
        alreadySent:
          {
            type: boolean,
            description: "true = same clientMessageId was already saved (idempotent retry — safe).",
          }
      required: [messageId, conversationId]
    CommunityMessageSendResult:
      type: object
      description: |
        `data` of the `community:message:send` ack. The full message is broadcast
        as `community:message:new` to the `community:<communityId>` room. `sentAt`
        arrives as a string on the ack — coerce with `Number()`.
      properties:
        messageId: { type: string }
        roomId: { type: string }
        sentAt: { type: integer, description: "epoch ms (string on the ack)." }
        alreadySent: { type: boolean }
      required: [messageId, roomId]
    ConversationRef:
      type: object
      properties:
        conversationId: { type: string }
      required: [conversationId]
    CommunityRef:
      type: object
      properties:
        communityId: { type: string }
      required: [communityId]
    CallRef:
      type: object
      properties:
        callId: { type: string }
      required: [callId]
    ConversationType:
      type: string
      enum: [private, group]
      default: private
      description: Case-insensitive; selects private vs group code path.
    ContentType:
      type: string
      enum:
        [
          TEXT,
          IMAGE,
          VIDEO,
          AUDIO,
          VOICE,
          DOCUMENT,
          GIF,
          STICKER,
          LOCATION,
          CONTACT,
          SYSTEM,
          VOICE_CALL,
          VIDEO_CALL,
          COMMUNITY_INVITE,
          GROUP_INVITE,
        ]
      description: |
        Message kind — **UPPER-CASE on every surface** (socket + REST,
        private/group/community). This is the single field name for message
        classification; there is no `messageType` alias.

        The server normalizes **any** incoming value to UPPER-CASE (legacy
        lower-case stored values like `text` are normalized on read) and falls
        back to `TEXT` when empty. The enum above is the **recommended, rendered**
        set; an unrecognized UPPER-CASE value is forwarded verbatim and a client
        should render it as a generic/text bubble rather than crash.

        - `TEXT` — plain text (emoji included).
        - `IMAGE` / `VIDEO` / `GIF` — require `files[]` (or `media.files[]` on community).
        - `AUDIO` — audio file; `VOICE` — recorded voice note (waveform metadata).
        - `DOCUMENT` — generic file attachment.
        - `STICKER` — requires `sticker`; `LOCATION` — requires `location`;
          `CONTACT` — requires `contact`.
        - `SYSTEM` — group/community lifecycle event (carries `systemEvent`/`systemData`).
        - `COMMUNITY_INVITE` / `GROUP_INVITE` — a community or group invitation
          shared into a private chat, rendered as a join card. **Read-only**:
          the send validators reject them, they are only ever written by the
          invite-share paths. Read the whole card from `content.invitation`
          (`{ type, deepLink, alreadyJoined, status, canOpen, … }`, where `type`
          is `COMMUNITY_INVITATION` | `GROUP_INVITATION` and `status` is
          `ACTIVE` | `EXPIRED` | `REVOKED` | `DELETED`) — never by combining
          `contentType: SYSTEM` with `systemEvent`.

          `alreadyJoined` / `status` / `canOpen` are **re-resolved on every
          read** (the recipient may have joined since, the link may have been
          revoked, the community/group may be gone), so never cache the card.
          `content.text` is the human fallback line; `systemData` carries only
          event-level metadata (`invitationType`, the target id, the invite
          code/token, and the inviter/actor).

          `systemAction` carries the SAME object as `content.invitation` and is
          retained only for clients written before the card moved into
          `content`. New clients must read `content.invitation`.

          Rows written before this kind existed are stored as `SYSTEM` with the
          card fields spread across `systemData`; the REST history read projects
          them onto the shape above, so a client needs one code path only.
        - `VOICE_CALL` / `VIDEO_CALL` — a call lifecycle entry in a private or
          group timeline. **Read-only**: the send validators reject them, they are
          only ever written by the call service. The kind comes from the call's
          own type, so it does NOT change as the call progresses — read the
          current state from `content.call`
          (`{ callId, callType, callStatus, callerId, calleeId, durationSec }`,
          where `callStatus` is `RINGING` | `ANSWERED` | `ENDED` | `DECLINED` |
          `MISSED` | `CANCELLED` | `FAILED`; `outcome` is a legacy alias with the
          same value).

          **ONE CALL IS ONE ROW.** The row is created the moment the call starts
          ringing and arrives as `message:new`; every later state rewrites that
          SAME row (same `id`, `sequenceNumber` and `serverTs`) and arrives as
          `message:edited`. Never append a second card per state — upsert on
          `content.call.callId`. Each transition also bumps the room `revision`,
          so `/changes` and `sinceRevision` catch-up replay the final state to a
          client that was offline for the whole call.

          Live rows carry `systemEvent: CALL_STARTED`, settled rows
          `CALL_ENDED`, both with `systemData`. Rows are sender-less
          (`senderId: ""`) — take the ↗/↙ direction from `content.call.callerId`,
          not from the sender. Only the transition into `MISSED` raises an unread
          badge. Never classify a call by parsing `content.text`.

    # -------- chat send payloads --------
    FileAttachment:
      type: object
      description: |
        One attachment. Either `objectKey` (a key from the media-upload flow —
        see `docs/MEDIA_UPLOAD.md`) **or** `url` (an external URL, e.g. a Tenor
        GIF) is expected. The server never receives file bytes over the socket.
      properties:
        mediaId:
          {
            type: string,
            maxLength: 100,
            description: "Stable, immutable media identity from the upload-url response — independent of objectKey/url. Absent/null for legacy attachments uploaded before this field existed.",
          }
        objectKey: { type: string, maxLength: 500 }
        url: { type: string, format: uri, maxLength: 3000 }
        name: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 0 }
        mime: { type: string, maxLength: 150 }
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 0 }
        blurhash:
          {
            type: string,
            maxLength: 120,
            description: "§3.5: blur preview for image/video (instant aspect-ratio render).",
          }
        waveform:
          type: array
          maxItems: 2048
          items: { type: number }
          description: "§3.5: voice-note amplitude samples (render bars pre-download)."
    Location:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
        placeName: { type: string }
        placeAddress: { type: string }
    Contact:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        avatar: { type: string }
        userId: { type: string }
    MessageSendPayload:
      type: object
      description: |
        Message send payload (client → server). The server derives sender
        identity from the authenticated socket — clients never stamp their own
        `senderId`. `clientTs` (epoch ms) is the optional display-only compose time.
        STICKER sends carry their reference in `sticker` (same shape as
        `community:message:send`), NOT in `files[]` — it is persisted as
        `content.sticker` and is what history replays.
      properties:
        conversationId: { type: string, minLength: 1, maxLength: 200 }
        clientMessageId:
          {
            type: string,
            maxLength: 200,
            description: "Client-generated idempotency key (a UUID is recommended).",
          }
        contentType: { $ref: "#/components/schemas/ContentType" }
        contentText: { type: string, maxLength: 4000 }
        mediaKey:
          type: string
          maxLength: 3000
          deprecated: true
          description: |
            **Deprecated** — single object-key shorthand. Prefer `files[]` (a
            single file is an array of one). Still accepted: when set and no
            `files[]` entry carries an `objectKey`, the gateway folds it into
            `files[]`. New clients should not send this.
        files:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/FileAttachment" }
        urls:
          type: array
          maxItems: 20
          items: { type: string, format: uri, maxLength: 3000 }
        location: { $ref: "#/components/schemas/Location" }
        contact: { $ref: "#/components/schemas/Contact" }
        sticker:
          type: object
          description: |
            Sticker / GIF attachment — a REFERENCE only; the socket never carries
            bytes. Send the resolved `url` (external GIF) or
            `packId`+`stickerId`+`objectKey` (uploaded sticker). Persisted as
            `content.sticker`, so it survives reload/pagination unchanged.
          properties:
            objectKey: { type: string, maxLength: 500 }
            url: { type: string, maxLength: 3000 }
            packId: { type: string, maxLength: 100 }
            stickerId: { type: string, maxLength: 100 }
          required: [packId, stickerId]
        repliedToId: { type: string, maxLength: 200 }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
        receiverId: { type: string, maxLength: 200 }
        senderName: { type: string, maxLength: 120 }
        senderAvatar: { type: string, maxLength: 3000 }
        clientTs:
          {
            type: integer,
            description: "§5.1: client compose time (epoch ms), display-only.",
          }
      # clientMessageId is OPTIONAL in the validator (chat.ns.ts:59 — omit to let
      # the server auto-generate one); it is the idempotency key, not mandatory.
      required: [conversationId, contentType]
    ReadUpTo:
      type: object
      properties:
        conversationId: { type: string }
        upToMessageId: { type: string }
      required: [conversationId, upToMessageId]
    MessageReactPayload:
      type: object
      properties:
        messageId: { type: string, minLength: 1, maxLength: 200 }
        conversationId: { type: string, minLength: 1, maxLength: 200 }
        emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            A single emoji grapheme. Bounded length tolerates multi-codepoint
            ZWJ / skin-tone sequences but rejects pasted text. Sending the same
            emoji again toggles (removes) the reaction.
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId, emoji]
    MessageReactionsGetPayload:
      type: object
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId]
    MessageEditPayload:
      type: object
      properties:
        messageId: { type: string, minLength: 1, maxLength: 200 }
        conversationId: { type: string, minLength: 1, maxLength: 200 }
        contentText: { type: string, maxLength: 4000 }
        contentJson: { type: string, maxLength: 16384 }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [messageId, conversationId]
    MessageForwardPayload:
      type: object
      properties:
        messageId: { type: string }
        targetConversationId: { type: string }
        clientMessageId: { type: string }
        conversationType: { $ref: "#/components/schemas/ConversationType" }
        receiverId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
      required: [messageId, targetConversationId, clientMessageId]
    MessagesFetchPayload:
      type: object
      description: |
        Cursor-paged message history (backward only — newest → oldest), private/group.
        Omit `cursor` for the newest page; `hasMore: false` in the result means the
        beginning of history was reached. Sort key is `createdAt`, newest-first.
      properties:
        conversationId: { type: string }
        cursor:
          type: string
          description: |
            Opaque scroll cursor — an **ISO-8601 string** (the last returned message's
            `createdAt`, e.g. `"2025-06-09T10:30:00.000Z"`). Boundary is **EXCLUSIVE**:
            the cursor item is not re-returned. NOTE: this differs from the REST
            `before_ts` cursor (epoch-ms integer, inclusive) — do not feed a REST
            cursor here verbatim.
        limit:
          type: integer
          maximum: 100
          default: 30
          description: "Page size. Defaults to 30 when omitted; capped at 100."
        conversationType: { $ref: "#/components/schemas/ConversationType" }
      required: [conversationId]
    ChatCatchupPayload:
      type: object
      properties:
        rooms:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              roomId: { type: string }
              sinceSeq: { type: integer, minimum: 0, default: 0 }
              conversationType:
                { $ref: "#/components/schemas/ConversationType" }
              limit: { type: integer, minimum: 1, maximum: 200, default: 100 }
            required: [roomId]
      required: [rooms]
    PresenceHeartbeatPayload:
      type: object
      description: |
        Payload for `presence:heartbeat`. The server renews the device-presence TTL on each
        heartbeat; the TTL is **10 minutes**. Stop sending heartbeats and the user will appear
        offline to peers after ~10 minutes. Recommended client interval: every 30–60 s while
        the app is in the foreground.
      properties:
        appState: { type: string, default: FOREGROUND }
    PeerIds:
      type: object
      description: |
        Up to **500** peer ids per call. Exceeding 500 is **rejected** — the ack
        is `INVALID_PAYLOAD` (the server does not silently truncate). Re-subscribe
        in batches if you watch more than 500 peers.
      properties:
        peerIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 200 }
      required: [peerIds]
    CallInitiatePayload:
      type: object
      description: |
        **1-1 calls only (V1).** Signaling targets a single `calleeId`; group /
        community calls are out of scope — see SOCKET_EVENTS.md §7.5.

        **Canceling a ringing call:** the caller emits `call:end { callId }` before
        the callee answers and the callee receives `call:cancelled`. If nobody answers,
        chat-service enforces the configured ring timeout (60 s by default), records the
        call as `MISSED`, and emits `call:missed` to both participants. Clients should not
        emit `call:end` for that server-owned timeout.
      properties:
        calleeId: { type: string, minLength: 1, maxLength: 200 }
        callType: { type: string, enum: [AUDIO, VIDEO], default: AUDIO }
        privateRoomId: { type: string, maxLength: 200 }
      required: [calleeId]
    IceCandidate:
      type: object
      description: |
        A WebRTC ICE candidate (RTCIceCandidateInit). The backend relays it
        opaquely — it is never parsed or persisted. An empty `candidate` string
        signals end-of-candidates.
      properties:
        candidate: { type: string, maxLength: 1000 }
        sdpMid: { type: string, maxLength: 100 }
        sdpMLineIndex: { type: integer, minimum: 0 }
        usernameFragment: { type: string, maxLength: 256 }
    CallIceSendPayload:
      type: object
      description: "Trickle a single WebRTC ICE candidate to the peer. Fire-and-forget: no ack, no retry. On weak networks candidates can drop and call setup may fail — re-send the latest candidate on a short timer."
      properties:
        callId: { type: string, minLength: 1, maxLength: 200 }
        candidate:
          description: WebRTC ICE candidate (opaque to the backend).
          oneOf:
            - { $ref: "#/components/schemas/IceCandidate" }
            - { type: string, maxLength: 1000 }
      required: [callId, candidate]

    # -------- chat receive payloads --------
    QuoteData:
      type: object
      description: "§9: canonical reply snapshot (survives parent eviction)."
      nullable: true
      properties:
        messageId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        preview: { type: string }
        isDeleted: { type: boolean }
    ReactionGroup:
      type: object
      description: "§2.4: grouped reaction (selfReacted derived client-side from users[])."
      properties:
        emoji: { type: string }
        count: { type: integer }
        users:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              displayName: { type: string }
              avatar: { type: string }
    MessageContent:
      type: object
      additionalProperties: true
      description: |
        The SINGLE shared structured message body, referenced by BOTH
        `MessageNewPayload.content` (chat `message:new` / `message:edited`) and
        `CommunityMessageNewPayload.content` (`community:message:new`) so mobile
        uses ONE content mapper across chat + community. All fields are optional;
        the enclosing payload's `contentType` says which is authoritative (e.g.
        LOCATION → `location`, STICKER → `sticker`, IMAGE/VIDEO/GIF → `files`).
        `additionalProperties: true` keeps it forward-compatible — unknown keys
        are forwarded verbatim.

        Field provenance in V1 (verified against the chat-service serializer +
        grpc emit paths): `text` / `files` / `location` / `contact` are emitted by
        BOTH surfaces; `urls` is chat-only (passed through from the sender);
        `sticker` is community-only. NOTE: `quoteData` and `parentMessageId` are
        NOT part of content — they live at the payload level.
      properties:
        text:
          type: string
          description: "Message text. May be empty for non-text kinds (location, contact, sticker, …)."
        urls:
          type: array
          description: "Chat-only: URLs carried alongside the body (passed through verbatim). Absent on community."
          items: { type: string, format: uri }
        files:
          type: array
          description: "Gallery / files attachment — images, videos, documents, audio, voice notes, GIFs."
          items: { $ref: "#/components/schemas/FileAttachment" }
        location: { $ref: "#/components/schemas/Location" }
        contact: { $ref: "#/components/schemas/Contact" }
        sticker:
          type: object
          description: |
            Sticker / GIF attachment — a REFERENCE only (the socket never carries
            bytes). Community-emitted in V1; see SOCKET_EVENTS §8.9.
          properties:
            objectKey: { type: string }
            url: { type: string, format: uri }
            packId: { type: string }
            stickerId: { type: string }
    MessageNewPayload:
      type: object
      description: |
        Server → client broadcast for every new message (§1/§9 canonical
        ChatMessage). Field names match the REST `ChatMessage` so the client uses
        ONE mapper; the legacy V1 aliases (messageId, conversationId,
        contentText, contentJson, sentAt) are kept for back-compat. The SAME shape
        is emitted on `message:edited`.
      properties:
        # ── canonical (REST ChatMessage names) ──
        id: { type: string, description: server id (== messageId). }
        clientMessageId:
          {
            type: string,
            description: "§2.1: echoed on the sender's own message for dedupe.",
          }
        roomId: { type: string }
        conversationType: { type: string, enum: [PRIVATE, GROUP] }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        senderRole:
          {
            type: string,
            description: "§2.2: ADMIN|MEMBER|… for groups; '' for private.",
          }
        receiverId: { type: string, description: private only; '' for groups. }
        contentType: { $ref: "#/components/schemas/ContentType" }
        content:
          allOf: [{ $ref: "#/components/schemas/MessageContent" }]
          description: "Structured body — the shared MessageContent shape (text, urls[] chat-only, files[], location, contact, sticker). forward-compat via additionalProperties."
        parentMessageId: { type: string }
        quoteData: { $ref: "#/components/schemas/QuoteData" }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
        isForwarded:
          { type: boolean, description: present on forwarded messages. }
        isDeleted: { type: boolean }
        deletedType: { type: string, description: 'forEveryone | forMe | "".' }
        editedAt: { type: integer, description: "epoch ms, 0 = never edited." }
        clientTs:
          {
            type: integer,
            description: "§5.1: client compose time (epoch ms), display-only.",
          }
        serverTs:
          { type: integer, description: server-authoritative time (epoch ms). }
        sequenceNumber:
          {
            type: integer,
            description: per-room monotonic sequence (sole ordering key).,
          }
        # ── V1-compat aliases ──
        messageId: { type: string }
        conversationId: { type: string }
        contentText: { type: string }
        contentJson: { type: string }
        sentAt: { type: integer, description: epoch ms (== serverTs). }
        systemEvent:
          type: string
          description: >-
            Set when contentType=SYSTEM; on call rows
            (contentType=VOICE_CALL/VIDEO_CALL): CALL_STARTED while the call is
            live (RINGING/ANSWERED), CALL_ENDED once it settles; and on
            invitation rows (contentType=COMMUNITY_INVITE/GROUP_INVITE), where
            it repeats the kind. Do NOT classify a message by this field — use
            `contentType`.
          enum:
            [
              GROUP_CREATED,
              MEMBER_ADDED,
              MEMBER_JOINED,
              MEMBER_LEFT,
              MEMBER_REMOVED,
              ROLE_CHANGED,
              ROOM_RENAMED,
              AVATAR_CHANGED,
              DESCRIPTION_CHANGED,
              CALL_STARTED,
              CALL_ENDED,
              COMMUNITY_INVITE,
              GROUP_INVITE,
            ]
        systemData:
          type: object
          description: >-
            actorId/actorName (+ targetUserId/targetName, newRole, newName where
            relevant). A MEMBER_ADDED row produced by a BATCH add (one
            add-member operation, many members) carries targetUserIds +
            targetNames (parallel arrays, added members only) INSTEAD of the
            single targetUserId/targetName, and renders as one grouped line
            ("Krish added Jane, Peter and 3 others"). For CALL_STARTED/CALL_ENDED:
            callId, callType, status, durationSec, callerId, calleeId, endedBy.
          additionalProperties: true
      required:
        [
          id,
          roomId,
          conversationType,
          senderId,
          contentType,
          content,
          serverTs,
          sequenceNumber,
        ]
    MessageEditedPayload:
      description: |
        §9: emits the FULL canonical ChatMessage shape (identical to
        MessageNewPayload), not a thin {contentText,contentJson}. A client
        re-renders the edited bubble with the same mapper.
      allOf:
        - { $ref: "#/components/schemas/MessageNewPayload" }
    ListBumpLastMessage:
      type: object
      description: |
        Last-message preview for a chat/community list row. `contentType` is the
        UPPER-CASE kind; `text` is a ready-to-render preview string the client
        may show verbatim. Server convention by type (clients may localize):
        - `TEXT` → first ~200 chars of the body (truncated; `text` ≤512).
        - `IMAGE` → "📷 Photo"   · `VIDEO` → "🎥 Video"   · `GIF` → "🎞 GIF"
        - `DOCUMENT` → "📎 {filename}"   · `AUDIO` → "🎵 Audio"
        - `VOICE` → "🎤 Voice message"   · `STICKER` → "🌟 Sticker"
        - `LOCATION` → "📍 {placeName}"   · `CONTACT` → "👤 {contactName}"
        - `SYSTEM` → the rendered system-event sentence.
        For non-text types `text` is the placeholder above (never the raw body).
      properties:
        contentType: { $ref: "#/components/schemas/ContentType" }
        text: { type: string, maxLength: 512 }
    ConvUpdatedPayload:
      type: object
      description: Chat list bump-to-top hint (idempotent). Delivered to user:<id>.
      properties:
        type: { type: string, enum: [PRIVATE, GROUP] }
        roomId: { type: string }
        lastMessageId: { type: string }
        lastMessage: { $ref: "#/components/schemas/ListBumpLastMessage" }
        lastMessageAt: { type: integer, description: epoch ms. }
        senderId: { type: string }
        senderName:
          {
            type: string,
            description: "Display name of the sender — render as 'You:'/'Alice:' prefix (parity with community:updated).",
          }
        unread:
          {
            type: boolean,
            description: "v1 boolean hint: false on the sender's copy.",
          }
        isOffline:
          {
            type: boolean,
            description: "PRIVATE only — true when the OTHER participant (the recipient's chat peer) is currently offline, sourced from the same real-time PresenceService/Redis presence state as GET /chat/private/conversations and GET /chat/private/rooms/:peerId. Omitted for GROUP (no single peer). Re-emitted on its own whenever that peer's presence flips, independent of new messages.",
          }
    UserSettingsEnvelope:
      type: object
      description: >
        The complete settings envelope, identical to the `data` of
        `GET /api/v1/users/settings/me`. Emitted on `settings:updated` to the
        changing user's own devices.
      properties:
        privacy: { type: object }
        chat: { type: object }
        app: { type: object }
        notifications:
          type: object
          properties:
            chat: { type: boolean }
            call: { type: boolean }
            friendRequest: { type: boolean }
            system: { type: boolean }
            community: { type: boolean }
            liveStream: { type: boolean }
            showPreview:
              {
                type: boolean,
                description: "false masks the message body in the push banner. The Notification Center row keeps the real body.",
              }
            quietHours:
              type: object
              properties:
                enabled: { type: boolean }
                start:
                  {
                    type: string,
                    nullable: true,
                    description: '"HH:mm" 24-hour. Required whenever enabled is true.',
                  }
                end: { type: string, nullable: true }
                days:
                  {
                    type: array,
                    items: { type: integer, minimum: 0, maximum: 6 },
                    description: "0=Sunday .. 6=Saturday. Empty means every day.",
                  }
                timezone:
                  {
                    type: string,
                    nullable: true,
                    description: "IANA zone id the window is evaluated in; null = server-local.",
                  }
        liveStream: { type: object }
        updatedAt: { type: string, format: date-time }
    ConvMuteChangedPayload:
      type: object
      description: >
        The caller's own conversation-mute state for one room. Delivered to their
        own devices only. Shared by conv:muted and conv:unmuted.
      properties:
        roomId: { type: string }
        conversationId:
          {
            type: string,
            description: "Alias of roomId, for clients keyed on conversationId.",
          }
        type: { type: string, enum: [PRIVATE, GROUP] }
        isMuted: { type: boolean }
        mutedUntil:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: "ISO-8601 expiry; null = indefinite (or unmuted). Evaluated lazily at push time, so no event fires when it lapses.",
          }
        updatedAt: { type: integer, description: epoch ms. }
    CommunityUpdatedPayload:
      type: object
      description: Community list bump-to-top hint. Delivered on /chat to user:<id>.
      properties:
        communityId: { type: string }
        roomId: { type: string }
        lastMessageId: { type: string }
        lastMessage: { $ref: "#/components/schemas/ListBumpLastMessage" }
        lastMessageAt: { type: integer, description: epoch ms. }
        senderId: { type: string }
        senderName:
          {
            type: string,
            description: "Display name of the sender — render as 'Alice: Hello' in the community list row.",
          }
        unread: { type: boolean }
    CommunityCreatedPayload:
      type: object
      description: >
        Full CommunityData for the newly created community. Shape is identical to
        POST /communities 201 response body.data. Delivered on /chat to
        user:<creatorId> so the frontend can prepend the item to the
        joined-communities list without an extra API call or page reload.
      properties:
        id: { type: string }
        name: { type: string }
        handle: { type: string }
        description: { type: string, nullable: true }
        type: { type: string, enum: [PUBLIC, PRIVATE] }
        category:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        creatorId: { type: string }
        adminId: { type: string }
        memberCount: { type: integer }
        memberLimit: { type: integer }
        avatarUrl: { type: string, nullable: true }
        avatarUrlExpiresIn: { type: integer, nullable: true }
        role:
          {
            type: string,
            enum: [ADMIN],
            description: "Always ADMIN for the creator.",
          }
        isJoined: { type: boolean, description: "Always true." }
        joinRequestId: { type: string, nullable: true }
        joinRequestStatus: { type: string, nullable: true }
        isMuted:
          {
            type: boolean,
            description:
              "Derived, never stored: true when a timed mute is still running
              (muteUntil in the future) OR all three of chatEnabled /
              streamEnabled / announcementEnabled are false. Clients must render
              the mute badge from this and never from muteUntil being null.",
          }
        muteUntil:
          {
            type: string,
            nullable: true,
            description:
              "End of a TIMED mute; null means no timed mute — NOT an indefinite
              mute. An indefinite mute is all three category toggles false.",
          }
        moderationStatus: { type: string }
        isLive: { type: boolean }
        chatEnabled: { type: boolean }
        streamEnabled: { type: boolean }
        announcementEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CatchupEvent:
      type: object
      description: |
        A single gap-fill row. Catch-up INCLUDES tombstones: `forEveryone` deletes
        return with isDeleted=true (+deletedType) and edits carry editedAt, so an
        offline client reconciles. NOTE on `forMe`: forMe deletes are client-local
        (never broadcast, never flagged here) — a message you hid forMe MAY reappear
        on catch-up. Keep your own hiddenMessageIds set and re-apply it on render.
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        senderId: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        contentText: { type: string }
        contentJson: { type: string }
        sentAt: { type: integer, description: epoch ms. }
        sequenceNumber: { type: integer }
        isDeleted: { type: boolean }
        deletedType:
          {
            type: string,
            description: 'group tombstones only; "" for private.',
          }
        editedAt: { type: integer, description: "epoch ms, 0 if never edited." }
        systemEvent:
          {
            type: string,
            description: 'set for SYSTEM messages; "" otherwise.',
          }
        systemData:
          {
            type: string,
            description: 'JSON-encoded object for SYSTEM messages; "" otherwise.',
          }
    ChatCatchupResultPayload:
      type: object
      description: One emit per room (direct to socket), plus an aggregate ack.
      properties:
        roomId: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/CatchupEvent" }
        hasMore:
          { type: boolean, description: re-request with sinceSeq=lastSeq. }
        lastSeq:
          { type: integer, description: highest sequenceNumber in this page. }
      required: [roomId, events, hasMore, lastSeq]
    MessageReadReceiptPayload:
      type: object
      description: |
        Read receipt broadcast to the conversation room. PRIVATE only: groups and
        communities are sent + read aggregate only — there is NO per-member delivery
        receipt and NO per-member "seen by X of Y" in V1 (deferred to V2; see the
        info `Breaking changes` block / SOCKET_EVENTS §8.9). message:delivered is
        likewise private-only.
      properties:
        conversationId: { type: string }
        readerId: { type: string }
        upToMessageId: { type: string }
    ReadSyncPayload:
      type: object
      description: |
        §5.5: multi-device read high-water mark. Delivered to the reader's OWN
        devices (channel user:<readerId>) so every screen clears unread together.
        SCOPE: emitted on /chat for PRIVATE + GROUP rooms only. There is no
        community read_sync in V1 — community unread reconciles via bulk mark-read
        + the community:updated list hint (deferred to V2).
      properties:
        conversationId: { type: string }
        readerId: { type: string }
        read_to_seq:
          {
            type: integer,
            description: highest read sequenceNumber for this room.,
          }
        unreadCount: { type: integer }
        conversationType: { type: string, enum: [PRIVATE, GROUP] }
    PinUpdatedPayload:
      type: object
      description: "§2.5: pin/unpin banner broadcast to conv:<roomId>."
      properties:
        roomId: { type: string }
        conversationId: { type: string }
        messageId: { type: string }
        action: { type: string, enum: [pinned, unpinned] }
        pinnedBy: { type: string, description: present on action=pinned. }
        unpinnedBy: { type: string, description: present on action=unpinned. }
        pinnedAt: { type: integer, description: epoch ms (action=pinned). }
        pinnedCount: { type: integer }
    MessageDeliveredReceiptPayload:
      type: object
      properties:
        conversationId: { type: string }
        recipientId: { type: string }
        upToMessageId: { type: string }
        messageIds:
          type: array
          items: { type: string }
    MessageReactionPayload:
      type: object
      description: |
        §2.4: emits the grouped ChatReactionGroup[] shape (emoji/count/users)
        so the live reaction bar renders without a refetch. `selfReacted` is
        intentionally omitted — derive it client-side from users[].userId.
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
    MessageDeletePayload:
      type: object
      description: |
        §2.3: self-describing tombstone. conversationId lets a client route the
        delete even if the room isn't loaded; sequenceNumber locates the message.
        Client rule: on `type:"forEveryone"` hide for everyone; on `forMe` hide
        only when deletedBy === your own userId. forMe hides are client-local and
        may not survive a catch-up — re-apply your hiddenMessageIds on render.
      properties:
        messageId: { type: string }
        conversationId: { type: string }
        type: { type: string, enum: [forEveryone, forMe] }
        deletedType:
          {
            type: string,
            description: "group/community: SELF_DELETE | ADMIN_DELETE.",
          }
        deletedBy: { type: string }
        sequenceNumber: { type: integer }
      required: [messageId, conversationId, type, deletedBy]
    TypingBroadcastPayload:
      type: object
      description: |
        Fire-and-forget typing / recording presence signal. UNIFIED SHAPE: this is
        byte-for-byte the same body on /chat (private + group) and /community —
        both namespaces build it with the shared `buildTypingBroadcast()` helper
        (sockets/user-details.ts), so one client-side parser handles all three
        chat types.

        The SENDER is always excluded from the broadcast (/chat uses
        `socket.to(room)`; /community resolves an explicit recipient set that
        omits the sender).

        The server keeps NO typing state, so a crashed sender cannot be cleaned up
        server-side. EXPIRY CONTRACT: the RECEIVER auto-clears a "typing…"
        indicator after ~6 s with no fresh typing:start; the SENDER re-emits
        typing:start every ~3–5 s while typing and one typing:stop when it ends.
        The server additionally fires an automatic stop after a 6 s TTL and on
        disconnect.
      properties:
        eventId:
          type: string
          format: uuid
          description: |
            Per-broadcast dedupe key. Previously /community-only; now emitted on
            /chat as well.
        roomId:
          type: string
          description: |
            CANONICAL room identifier — read this. On /community it equals
            `communityId` (the GeneralRoom id === communityId).
        conversationId:
          type: string
          description: |
            BACK-COMPAT duplicate of `roomId`, retained because shipped Web /
            Android / iOS /chat clients key typing state off it. Never removed;
            new clients should read `roomId`.
        communityId:
          type: string
          description: |
            BACK-COMPAT duplicate of `roomId`, emitted on /community only (absent
            on /chat). Existing community clients key typing state off it.
        userId:
          type: string
          description: Server-authoritative sender id (from the verified JWT).
        userDetails: { $ref: "#/components/schemas/SocketUserDetails" }
        timestamp: { type: integer, description: epoch ms. }
        senderName:
          type: string
          description: |
            Display name for "Alice is typing…" without a profile fetch. Resolved
            server-side from `userDetails.displayName`; falls back to the
            client-supplied `senderName` on the request, then `""`. Always
            present (possibly empty) — never absent.
      required:
        [
          eventId,
          roomId,
          conversationId,
          userId,
          userDetails,
          timestamp,
          senderName,
        ]
    SocketUserDetails:
      type: object
      description: |
        Sender identity resolved ONCE per socket connection (gRPC snapshot +
        presigned avatar). Shared by /chat and /community presence broadcasts.
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
      required: [userId, username, displayName, avatarUrl]
    TypingRequestPayload:
      type: object
      description: |
        Fire-and-forget typing signal (client → server). The validator
        (`TypingSchema`, chat.ns.ts) accepts an OPTIONAL `senderName` (≤100) in
        addition to the room identifier.

        CROSS-NAMESPACE PARITY: `roomId` (the /community spelling) is accepted as
        an alias for `conversationId` on every /chat inbound event. Send either;
        `conversationId` wins if both are present. See `withCommunityAliases` in
        chat.ns.ts.
      properties:
        conversationId: { type: string, minLength: 1 }
        roomId:
          type: string
          minLength: 1
          description: Alias for `conversationId` (cross-namespace parity).
        senderName: { type: string, maxLength: 100 }
      anyOf:
        - required: [conversationId]
        - required: [roomId]
    PresenceStatusPayload:
      type: object
      properties:
        userId: { type: string }
        isOnline: { type: boolean }
        # §2.7: epoch-ms INTEGERS (match REST ChatPresence.lastSeen), not strings.
        lastActiveAt: { type: integer, description: epoch ms. }
        lastSeen:
          {
            type: integer,
            nullable: true,
            description:
              "Server-generated epoch ms of the moment the user's LAST session
              ended. Render only while isOnline is false.",
          }
        version:
          type: integer
          description: >
            Monotonic per-user counter, advanced ONLY on a real ONLINE<->OFFLINE
            flip. Discard an event whose version is lower than the one already
            applied for that user, so a delayed "online" cannot resurrect a dot
            the user has since turned off. ABSENT means "apply unconditionally":
            the gateway omits it when revoking presence visibility, which must
            never be suppressed by a stale-but-higher version.
    CallIncomingPayload:
      type: object
      properties:
        callId: { type: string }
        callerId: { type: string }
        callType: { type: string, enum: [AUDIO, VIDEO] }
    CallEndedPayload:
      type: object
      properties:
        callId: { type: string }
        endedBy: { type: string }
        durationSec: { type: integer }
    CallIceRecvPayload:
      type: object
      properties:
        callId: { type: string }
        candidate:
          oneOf:
            - { $ref: "#/components/schemas/IceCandidate" }
            - { type: string, maxLength: 1000 }
        from: { type: string }

    # -------- community payloads --------
    # NOTE: community messages use the SAME `ContentType` enum as /chat (UPPER-CASE).
    # The former lower-case `CommunityMessageType` was removed — there is one
    # content-type vocabulary across both namespaces (one client mapper).
    CommunityJoinPayload:
      type: object
      properties:
        communityId: { type: string }
        roomId:
          type: string
          description: "Optional in the validator (community.ns.ts:17) — defaults to the community's general room when omitted."
      required: [communityId]
    CommunityMessageSendPayload:
      type: object
      description: |
        Payload for `community:message:send`. The gateway accepts two convenience aliases:
        - `contentText` is accepted as an alias for `message` (both refer to the body text).
        - Top-level `files[]` is accepted as an alias for `media.files[]` — you may send
          `files: [{…}]` at the top level instead of nesting inside `media`.
        New clients are encouraged to use the canonical `message` and `media.files[]` fields.
      properties:
        communityId: { type: string, minLength: 1, maxLength: 200 }
        roomId: { type: string, minLength: 1, maxLength: 200 }
        clientMessageId: { type: string, maxLength: 200 }
        message:
          type: string
          default: ""
          maxLength: 4000
          description: "Message text. May be empty for non-text types (location, contact, sticker, gif, etc.). Alias: `contentText`."
        contentText:
          type: string
          maxLength: 4000
          description: "Alias for `message`. Accepted for cross-namespace parity with the /chat namespace."
        contentType: { $ref: "#/components/schemas/ContentType" }
        files:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/FileAttachment" }
          description: "Top-level alias for `media.files[]`. Use either this or `media.files[]`, not both."
        media:
          type: object
          description: "Gallery / files attachment. One files[] array holds images, videos, documents, audio, voice notes, and GIFs."
          properties:
            files:
              type: array
              maxItems: 30
              items: { $ref: "#/components/schemas/FileAttachment" }
        location: { $ref: "#/components/schemas/Location" }
        contact: { $ref: "#/components/schemas/Contact" }
        sticker:
          type: object
          description: |
            Sticker / GIF attachment — a REFERENCE only; the socket never carries
            bytes. Discovery is client-side in V1: the client integrates the
            provider directly (Tenor/Giphy for GIFs, its own sticker catalog) and
            sends the resolved `url` (GIF) or `packId`+`stickerId`+`objectKey`
            (sticker). There is NO server-proxied sticker-pack / GIF-search API in
            V1 (deferred to V2 — see SOCKET_EVENTS §8.9).
          properties:
            objectKey: { type: string, maxLength: 500 }
            url: { type: string, format: uri, maxLength: 3000 }
            packId: { type: string, maxLength: 100 }
            stickerId: { type: string, maxLength: 100 }
        parentMessageId:
          type: string
          maxLength: 200
          description: "Optional. messageId of the message being replied to. Omit for top-level messages."
      # roomId is OPTIONAL in the validator (community.ns.ts:35) — the gateway
      # falls back to roomId = communityId (the general room) when omitted.
      required: [communityId, contentType]
    CommunityMessagesFetchPayload:
      type: object
      description: |
        Cursor-paged community message history (backward only — newest → oldest).
        Sort key is `createdAt`, newest-first. For incremental sync of edits,
        reactions, and deletions use `community:catchup` with `sinceTs`, not this event.
      properties:
        roomId: { type: string }
        cursor:
          type: string
          format: date-time
          description: |
            ISO 8601 UTC timestamp (e.g. `"2025-01-15T10:00:00.000Z"`).
            Must not be in the future (a 5 s clock-skew grace window is
            applied server-side). Omit for the most recent page.
            Pass the `nextCursor` from the previous response to page
            backwards. Boundary is **EXCLUSIVE** — the cursor item is not
            re-returned. NOTE: this is an ISO-8601 string, unlike the REST
            `before_ts` cursor (epoch-ms integer, inclusive).
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
          description: "Number of messages to return (default 30)."
      required: [roomId]
    CommunityMessageContent:
      description: |
        Deprecated alias of `MessageContent` — the single shared chat+community
        content shape. Kept so existing `$ref`s keep resolving; new refs should
        point at `MessageContent` directly.
      allOf:
        - { $ref: "#/components/schemas/MessageContent" }
    CommunityMessageNewPayload:
      type: object
      description: |
        Server → client broadcast for every new community message. Sender
        identity (senderName/senderAvatar) is resolved server-side; `contentType`
        is the single UPPER-CASE field for community message kind.
      properties:
        id: { type: string, description: server id (== messageId). }
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        content:
          allOf: [{ $ref: "#/components/schemas/MessageContent" }]
          description: "Structured body — the shared MessageContent shape (text, files[], location?, contact?, sticker?). forward-compat via additionalProperties."
        parentMessageId:
          {
            type: string,
            description: "messageId being replied to; '' for top-level.",
          }
        quoteData: { $ref: "#/components/schemas/QuoteData" }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
        message:
          {
            type: string,
            description: "V1 alias for content.text. `content.text` is authoritative.",
          }
        clientMessageId: { type: string }
        isEdited:
          {
            type: boolean,
            description: "Always false for community:message:new. Present so clients use one uniform field to detect edit state without comparing editedAt.",
          }
        editedAt:
          {
            type: integer,
            description: "Epoch ms of last edit. 0 for a new (never-edited) message.",
          }
        serverTs: { type: integer, description: epoch ms. }
        sentAt: { type: integer, description: epoch ms (== serverTs). }
        systemMessageType:
          type: string
          nullable: true
          enum:
            # Community lifecycle
            - COMMUNITY_CREATED
            - COMMUNITY_NAME_UPDATED
            - COMMUNITY_DESCRIPTION_UPDATED
            - COMMUNITY_AVATAR_UPDATED
            - COMMUNITY_BANNER_UPDATED
            - COMMUNITY_HANDLE_UPDATED
            - COMMUNITY_UPDATED
            # Live streaming
            - LIVE_STREAM_STARTED
            - LIVE_STREAM_ENDED
            # Membership / moderation (COMMUNITY-visible)
            - ROLE_CHANGED
            - MEMBER_JOINED
            - MEMBER_LEFT
            - MEMBER_REMOVED
            - MEMBER_BANNED
            - MEMBER_UNBANNED
            - MEMBER_MUTED
            - MEMBER_UNMUTED
            # Message actions
            - PINNED_MESSAGE
            - UNPINNED_MESSAGE
            - COMMUNITY_INVITE_CREATED
            # Personal (visible only to the affected user)
            - COMMUNITY_JOINED
            - JOIN_REQUEST_APPROVED
            - JOIN_REQUEST_REJECTED
            - ROLE_CHANGED_SELF
            # Legacy alias — old persisted rows only
            - MEMBER_ROLE_CHANGED
          description: >-
            Present when contentType is SYSTEM. SYSTEM messages are SENDER-LESS
            (senderId/senderName/senderAvatar are empty strings) — the actor is
            in systemMetadata.actorUserId/actorName only. The `message` / `content.text`
            field carries the canonical English fallback; render it verbatim or
            localize from systemMessageType + systemMetadata.

            Canonical fallback texts:
              COMMUNITY_CREATED             → "Community created"
              COMMUNITY_NAME_UPDATED        → 'Community renamed to "{{metadata.newName}}"'
              COMMUNITY_AVATAR_UPDATED      → "Community photo updated"
              COMMUNITY_DESCRIPTION_UPDATED → "Community description updated"
              COMMUNITY_BANNER_UPDATED      → "Community banner updated"
              COMMUNITY_HANDLE_UPDATED      → "Community handle updated"
              COMMUNITY_UPDATED             → "Community settings updated"
              LIVE_STREAM_STARTED           → "{{actorName}} started a livestream"
                                              or "You started a livestream" (viewer=host)
              LIVE_STREAM_ENDED             → "{{actorName}} ended the livestream ({{metadata.duration}})"
                                              or "… ended the livestream" when duration absent
                                              or "You ended the livestream …" (viewer=host)
              ROLE_CHANGED (bystander)      → "{{targetName}} is now a moderator/admin/member"
              ROLE_CHANGED (viewer=target)  → "You are now a moderator/admin/member"
              MEMBER_REMOVED                → "{{targetName}} was removed"
              MEMBER_UNBANNED               → "{{targetName}} was unbanned"
              MEMBER_MUTED (target only)    → "You are muted until {{date}}" or
                                              "You are muted indefinitely" (PERSONAL)
              MEMBER_UNMUTED (target only)  → "You were unmuted" (PERSONAL)
              PINNED_MESSAGE (actor)        → "You pinned a message"
              PINNED_MESSAGE (bystander)    → "{{actorName}} pinned a message"
              COMMUNITY_JOINED              → "You joined the community" (PERSONAL)
              JOIN_REQUEST_APPROVED         → "Your request to join was approved" (PERSONAL)
              JOIN_REQUEST_REJECTED         → "Your request to join was declined" (PERSONAL)

            Hidden in chat timeline (never returned in history, to anyone —
            including the affected user): MEMBER_LEFT, MEMBER_JOINED,
            MEMBER_REMOVED, MEMBER_BANNED. A banned user is told via
            `community:membership:restricted` (isBanned: true) + `isBanned` on
            the community detail/list, which drives the sticky banned banner —
            no chat bubble repeats it. MEMBER_UNBANNED is visible to all members.
            PERSONAL types (isPersonal=true): COMMUNITY_JOINED, JOIN_REQUEST_APPROVED,
            JOIN_REQUEST_REJECTED, ROLE_CHANGED_SELF, MEMBER_MUTED,
            MEMBER_UNMUTED — delivered ONLY to the affected user's `user:<id>`
            channel and never broadcast to / readable by other members. They
            persist like any other PERSONAL line and remain available to the
            affected user via history, pagination, incremental sync, and catch-up
            after a reload/reconnect.
            MEMBER_ROLE_CHANGED is the legacy alias for ROLE_CHANGED (old persisted rows only).
        isPersonal:
          type: boolean
          description: >-
            True for user-scoped (PERSONAL) SYSTEM messages — visible ONLY to the
            target user, never broadcast to the community room and never returned
            to other members in history. PERSONAL types: COMMUNITY_JOINED,
            JOIN_REQUEST_APPROVED, JOIN_REQUEST_REJECTED, ROLE_CHANGED_SELF,
            MEMBER_MUTED, MEMBER_UNMUTED — each delivered to the
            affected user's `user:<id>` channel only. All other system types are
            COMMUNITY-visible (isPersonal=false / absent). Null/absent for normal
            messages.
        systemMetadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Structured payload for SYSTEM message rendering. Null/absent for
            normal messages. ACTOR-BEARING types share `actorUserId` (the userId
            who triggered the event) and `actorName` (their resolved display
            name) — render "You" when `actorUserId === currentUserId`, otherwise
            use `actorName`.

            ACTOR-LESS lifecycle types — COMMUNITY_CREATED, COMMUNITY_NAME_UPDATED,
            COMMUNITY_DESCRIPTION_UPDATED, COMMUNITY_AVATAR_UPDATED,
            COMMUNITY_BANNER_UPDATED, COMMUNITY_UPDATED — describe the EVENT, not
            the actor. They carry NO `actorUserId`/`actorName` (and never
            `creatorId`/`creatorName`); the actor must NOT be rendered. Show the
            canonical text for every viewer (e.g. "Community created" — NEVER
            "{name} created the community").

            LIVE_STREAM_STARTED / LIVE_STREAM_ENDED are HOST-NAMED (Telegram group
            video-chat parity): they DO carry `actorUserId`/`actorName` (the host)
            and render "{actorName} started/ended a livestream" — "You …" when the
            viewer is the host.

            Per-type extra fields:

            COMMUNITY_CREATED:       { communityName }
            COMMUNITY_NAME_UPDATED:  { newName } — the rename target (NOT newCommunityName)
            LIVE_STREAM_STARTED:     { livestreamId } + actorUserId/actorName (host)
            LIVE_STREAM_ENDED:       { livestreamId, duration?, durationSeconds? }
                                     + actorUserId/actorName (host). `duration` is a
                                     human-readable runtime, e.g. "1h 24m"
            ROLE_CHANGED /
             MEMBER_ROLE_CHANGED:    { targetUserId, targetName, oldRole, newRole }
                                     — derive "promoted" vs "demoted" from role ranks
                                       (ADMIN>MODERATOR>MEMBER)
            MEMBER_REMOVED /
             MEMBER_BANNED /
             MEMBER_UNBANNED /
             MEMBER_MUTED /
             MEMBER_UNMUTED:         { targetUserId, targetName }
            PINNED_MESSAGE /
             UNPINNED_MESSAGE:       { messageId, messagePreview }
            COMMUNITY_JOINED /
             JOIN_REQUEST_APPROVED /
             JOIN_REQUEST_REJECTED:  no extra fields (PERSONAL; actor == target user)
    CommunityMemberDTO:
      type: object
      additionalProperties: true
      description: |
        Member snapshot for `community:member:joined`. Produced by
        community-service (`notifyMemberJoined`) on every path that turns a
        member ACTIVE (add_members, join-request approve / bulk-approve,
        invite-link redeem); published to Redis `community:<communityId>` and
        forwarded verbatim by the gateway to room `community:<communityId>`.
      properties:
        communityId:
          {
            type: string,
            description: "Which community the member joined — needed by clients that are subscribed to multiple community rooms simultaneously.",
          }
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [ADMIN, MODERATOR, MEMBER] }
        joinedAt: { type: integer, description: "epoch ms." }
      required: [communityId, userId]
    CommunityJoinRequestUpdateDTO:
      type: object
      description: |
        Server → client (`/notify`, room `user:<userId>`). Real-time UI-state
        flip for the requester when an ADMIN/MODERATOR approves or rejects their
        community join request. Published by notifications-service to
        `notify:<userId>` and forwarded verbatim by the gateway. An in-app
        `notification:new` (type `community.join_request_approved` /
        `community.join_request_rejected`) is delivered alongside it.
      properties:
        communityId: { type: string }
        requestId: { type: string }
        status: { type: string, enum: [APPROVED, REJECTED] }
        communityName: { type: string }
        decidedAt:
          {
            type: string,
            format: date-time,
            description: "ISO-8601 decision timestamp.",
          }
        navigation:
          allOf:
            - $ref: "#/components/schemas/NotificationNavigation"
          description: "Deep-link navigation included in the realtime status-flip event."
      required: [communityId, requestId, status]
    CommunityJoinRequestListUpdateDTO:
      type: object
      description: |
        Server → client (`/community`, room `community:<communityId>` AND each
        admin/moderator's own `user:<id>` channel). MODERATOR-facing "Accept
        Requests" list refresh — published by community-service on every
        join-request lifecycle change (`notifyJoinRequestDecided`) so an open
        admin panel adds, drops, or flips the affected row without a manual
        reload. Distinct from `CommunityJoinRequestUpdateDTO` above, which is
        the REQUESTER's own personal status-flip notification.
      properties:
        communityId: { type: string }
        requestId: { type: string }
        status:
          {
            type: string,
            enum: [PENDING, APPROVED, REJECTED, CANCELLED],
            description: "PENDING = a new (or recycled) request just landed; APPROVED/REJECTED = a moderator decided it; CANCELLED = the requester withdrew.",
          }
        userId: { type: string, description: "The requester." }
        actorId:
          {
            type: string,
            description: "The requester themself for PENDING/CANCELLED, the deciding admin/moderator for APPROVED/REJECTED.",
          }
        updatedAt: { type: integer, description: "epoch ms." }
      required: [communityId, requestId, status, userId, updatedAt]
    CommunityJoinedDTO:
      type: object
      description: |
        Server → client (`/notify`, room `user:<userId>`). Real-time confirmation
        to the JOINER that they are now an ACTIVE member of a community — fired on
        every path that turns the caller active (public self-join, invite-link
        redeem with autoApprove, join-request approval). Primary use is to
        reconcile the user's OTHER connected devices (flip "Join" → "Open" and
        insert the community into the list without a refresh). Published by
        notifications-service to `notify:<userId>` on the `community.member_joined`
        domain event and forwarded verbatim by the gateway. An in-app
        `notification:new` (type `community.member_joined`) is delivered alongside.
      properties:
        communityId: { type: string }
        communityName: { type: string }
        communityHandle: { type: string }
        communityAvatarUrl: { type: string, nullable: true }
        reactivated:
          {
            type: boolean,
            description: "True when a previously-LEFT membership was reactivated rather than freshly created.",
          }
      required: [communityId, communityName, communityHandle, reactivated]
    CommunityCatchupPayload:
      type: object
      properties:
        rooms:
          type: array
          # Validator cap: CommunityCatchupSchema .max(10) (community.ns.ts:108).
          # Batch reconnect requests if you are in more than 10 communities.
          maxItems: 10
          items:
            type: object
            properties:
              roomId: { type: string }
              sinceId:
                type: string
                description: "Exclusive lower bound — last message id the client already has. Omit for first load. Mutually exclusive with sinceTs; sinceTs takes precedence."
              sinceTs:
                type: integer
                description: "Epoch-ms alternative cursor. When > 0 the server switches to an updatedAt-based query that surfaces edits, reaction changes, and tombstones in addition to new messages. Use after returning from background. Mutually exclusive with sinceId."
              # Validator cap: CommunityCatchupRoomSchema .max(100) (community.ns.ts:96).
              limit: { type: integer, maximum: 100 }
            required: [roomId]
      required: [rooms]
    CommunityCatchupEventDto:
      type: object
      properties:
        messageId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatar: { type: string }
        message: { type: string }
        contentType: { $ref: "#/components/schemas/ContentType" }
        sentAt: { type: integer, description: "epoch ms." }
        isDeleted: { type: boolean }
        deletedType:
          type: string
          description: 'Value is "forEveryone", "forMe", or "" (empty string when not deleted).'
        editedAt: { type: integer, description: "epoch ms; 0 if not edited." }
        syncEventType:
          type: string
          enum: [new, edited, deleted, reacted]
          description: |
            What happened to this message since the cursor.
            - `new` — insertion-ordered new message (sinceId mode) or genuinely new (sinceTs mode)
            - `edited` — message text was changed
            - `deleted` — message was deleted for everyone (tombstone)
            - `reacted` — only reactions changed (sinceTs mode only)
        reactions:
          type: array
          description: "Current grouped reaction state at the time of catch-up."
          items: { $ref: "#/components/schemas/ReactionGroup" }
    CommunityCatchupResultPayload:
      type: object
      description: |
        Server → client per room in response to `community:catchup`.
        One event emitted per requested room. Store `lastId` as the next `sinceId`,
        or `nextTs` as the next `sinceTs` when using the updatedAt-cursor mode.
      properties:
        roomId: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/CommunityCatchupEventDto" }
        hasMore: { type: boolean }
        lastId:
          type: string
          description: "id of the last returned message; pass as sinceId on the next reconnect (sinceId mode)."
        nextTs:
          type: integer
          description: "Epoch-ms of the last event's updatedAt. Pass as sinceTs on the next call to continue paging in sinceTs mode. 0 in sinceId mode."
      required: [roomId, events, hasMore, lastId]

    CommunityMessageReactPayload:
      type: object
      properties:
        messageId: { type: string, minLength: 1, maxLength: 200 }
        communityId: { type: string, minLength: 1, maxLength: 200 }
        emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: "A single emoji grapheme (same rule as chat). Sending it again toggles it off."
      required: [messageId, communityId, emoji]
    CommunityMessageReactionPayload:
      type: object
      description: Broadcast to all members of the community room after any react/unreact. Contains the full updated reaction state — clients replace, not merge.
      properties:
        messageId: { type: string }
        communityId: { type: string }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/ReactionGroup" }
      required: [messageId, communityId, reactions]

    # ---- community edit/delete/pin/unpin payloads ----
    CommunityMessageEditPayload:
      type: object
      description: Client → server. Edit the text of an own community message (within the edit window).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        content:
          type: object
          properties:
            text: { type: string, minLength: 1, maxLength: 4000 }
          required: [text]
      # roomId is OPTIONAL in the validator (community.ns.ts:114).
      required: [messageId, communityId, content]
    CommunityMessageEditedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after a successful edit.
        Clients update the matching message in-place. Edit is text-only in V1; merge
        `message` + `editedAt` into the existing message in place (non-text edits are
        rejected server-side).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        message: { type: string, description: "Updated text content." }
        contentType: { $ref: "#/components/schemas/ContentType" }
        isEdited:
          {
            type: boolean,
            description: "Always true for this event — signals FE to show the 'edited' indicator without comparing old vs new content.",
          }
        editedAt:
          { type: integer, description: "Epoch ms when the edit was applied." }
      required:
        [messageId, communityId, roomId, senderId, message, isEdited, editedAt]
    CommunityMessageDeletePayload:
      type: object
      description: |
        Client → server. Delete a community message.
        `forEveryone` — only sender / moderator / admin. Broadcasts a tombstone.
        `forMe` — any participant; message hidden for the caller only (no broadcast).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        type:
          type: string
          enum: [forEveryone, forMe]
      # roomId is OPTIONAL in the validator (community.ns.ts:121).
      required: [messageId, communityId, type]
    CommunityMessageDeletedPayload:
      type: object
      description: |
        Server → client, normally broadcast to `community:<communityId>` after a
        `forEveryone` delete. Clients replace the message body with a tombstone
        placeholder. NOT emitted for `forMe` deletes.

        Same shape is also published to the affected user's own `user:<id>`
        channel (never `community:<id>`) to retract a stale PERSONAL system
        line client-side — a superseded join line, or the current MEMBER_MUTED
        line once its mute session ends. `deletedBy` is `""` in that case
        (system-initiated, no human actor).
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        deleteType: { type: string, enum: [forEveryone, forMe] }
        deletedBy:
          {
            type: string,
            description: "userId of the actor who deleted the message; empty string for a system-initiated PERSONAL line retraction (no human actor).",
          }
      required: [messageId, communityId, roomId, deleteType, deletedBy]
    CommunityMessagePinPayload:
      type: object
      description: "Client → server. Pin a message (moderator / admin only)."
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
      # roomId is OPTIONAL in the validator (community.ns.ts:128).
      required: [messageId, communityId]
    CommunityMessagePinRecord:
      type: object
      description: A CommunityMessagePin record (canonical pin entity).
      properties:
        id: { type: string }
        communityId: { type: string }
        roomId: { type: string }
        messageId: { type: string }
        pinnedBy: { type: string, description: "userId who pinned." }
        pinnedAt: { type: integer, description: "Epoch ms." }
        unpinnedAt:
          {
            type: [integer, "null"],
            description: "Epoch ms; null = active pin.",
          }
        unpinnedByUserId: { type: [string, "null"] }
        originalMessageDeletedAt:
          {
            type: [integer, "null"],
            description: "Set when pinned message was deleted for all.",
          }
        pinSystemMessageId:
          {
            type: [string, "null"],
            description: "ID of the PINNED_MESSAGE GeneralRoomMessage.",
          }
        messageCreatedAt:
          {
            type: integer,
            description: "Epoch ms — original message createdAt.",
          }
        senderId: { type: string }
        senderDisplayName: { type: string }
        senderAvatar: { type: string }
        contentPinned:
          type: object
          description: "Snapshot of the pinned message content at pin time."
          properties:
            text: { type: string }
            urls: { type: array, items: { type: string } }
            files: { type: array, items: { type: object } }
        createdAt: { type: integer, description: "Epoch ms." }
        updatedAt: { type: integer, description: "Epoch ms." }
        originalMessage:
          type: object
          description: "Present only on deleted-original events."
          properties:
            isAvailable: { type: boolean }
      required:
        [
          id,
          communityId,
          roomId,
          messageId,
          pinnedBy,
          pinnedAt,
          messageCreatedAt,
          senderId,
          contentPinned,
        ]
    CommunityMessagePinnedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after a pin, or when
        the pinned original is deleted (originalMessage.isAvailable = false).
        Clients replace the entire pin banner with the `pin` entity.
        `pinnedCount` may be null on deleted-original events (count is unchanged).
      properties:
        communityId: { type: string }
        roomId: { type: string }
        pin: { $ref: "#/components/schemas/CommunityMessagePinRecord" }
        pinnedCount: { type: [integer, "null"] }
      required: [communityId, roomId, pin]
    CommunityMessageUnpinPayload:
      type: object
      description: "Client → server. Unpin a message (moderator / admin only)."
      properties:
        messageId: { type: string }
        communityId: { type: string }
        roomId: { type: string }
      # roomId is OPTIONAL in the validator (community.ns.ts:134).
      required: [messageId, communityId]
    CommunityMessageUnpinnedPayload:
      type: object
      description: |
        Server → client broadcast to `community:<communityId>` after an unpin.
        Clients hide the pin banner. The soft-deleted `pin` record is included for reference.
      properties:
        communityId: { type: string }
        roomId: { type: string }
        messageId:
          { type: string, description: "The message that was unpinned." }
        pin: { $ref: "#/components/schemas/CommunityMessagePinRecord" }
        pinnedCount: { type: integer }
      required: [communityId, roomId, messageId, pinnedCount]

    # -------- notify payloads --------
    NotificationsFetchPayload:
      type: object
      properties:
        cursor: { type: string }
        limit: { type: integer, maximum: 100 }
    NotificationsMarkReadPayload:
      type: object
      properties:
        notificationIds:
          type: array
          maxItems: 500
          description: "Ids to mark read. An empty array marks ALL unread as read. Capped at 500 per call (matches the gateway Zod bound)."
          items: { type: string }
      required: [notificationIds]
    NotificationCountPayload:
      type: object
      description: "Aggregate unread only; no per-type breakdown in V1 — fetch the feed for category counts."
      properties:
        count: { type: integer }
      required: [count]
    NotificationReadPayload:
      type: object
      description: "Authoritative post-op total unread count across ALL tabs, following a mark-read / mark-all-read action from any device (REST or socket)."
      properties:
        unreadCount: { type: integer }
      required: [unreadCount]
    NotificationNavigation:
      type: object
      description: "Deep-link routing object on community join-request notifications. Tells the client which screen to open."
      properties:
        screen:
          type: string
          enum: [COMMUNITY_REQUESTS, COMMUNITY_DETAILS, COMMUNITY_CHAT]
          description: "COMMUNITY_REQUESTS=admin join-requests list; COMMUNITY_DETAILS=community info page; COMMUNITY_CHAT=community chat."
        communityId:
          type: string
        communityName:
          type: string
        communityAvatarUrl:
          type: string
          nullable: true
          description: "Resolved presigned URL; null if no avatar."
        communityHandle:
          type: string
          nullable: true
          description: "The community @handle unique slug."
        requestId:
          type: string
          description: "Present only for join-request notification types."
      required: [screen, communityId, communityName]
    NotificationItem:
      type: object
      description: |
        An in-app notification (the `notification:new` push and each row of the
        `notifications:fetch` ack). A stable envelope plus a `data` map of
        type-specific fields. The auth/OTP system events (email relays) are NOT
        delivered here. Treat unknown `type` values defensively — the set grows.
      properties:
        notificationId: { type: string }
        id:
          type: string
          description: |
            Deprecated alias of `notificationId` present in some legacy payloads.
            Prefer `notificationId`. Clients should coalesce: `notificationId ?? id`.
            This alias will be removed in V2.
        type:
          type: string
          description: |
            Discriminator. Known in-app values:
            `MESSAGE` · `friend.requested` · `friend.accepted` ·
            `community.join_requested` · `community.join_request_approved` ·
            `community.join_request_rejected` · `community.member_added` ·
            `community.member_joined` · `community.admin_transferred` ·
            `community.member_role_changed` ·
            `community.member_kicked` · `community.member_banned` ·
            `community.invite_sent` · `community.invite_accepted` ·
            `community.report_created` · `community.report_actioned` ·
            `community.deleted`.
        title: { type: string }
        body: { type: string }
        referenceId:
          {
            type: string,
            description: "primary context id (conversationId / friendshipId / communityId …).",
          }
        isRead: { type: boolean }
        createdAt: { type: integer, description: "epoch ms." }
        data:
          type: object
          additionalProperties: { type: string }
          description: |
            Type-specific fields (FCM-style — all string values). For `MESSAGE`:
            `{ conversationId, conversationType, messageId, clientMessageId,
            senderId, senderName, senderAvatar, contentType, preview, sentAt }`.
            For `friend.*`: `{ friendshipId, requesterId | addresseeId }`.
            For `community.*`: `{ communityId, … }`.
        navigation:
          allOf:
            - $ref: "#/components/schemas/NotificationNavigation"
          description: "Present on community.join_requested, community.join_request_approved, and community.join_request_rejected. Absent on all other types."
        actorSnapshot:
          type: object
          nullable: true
          description: "Actor details for UI. community.join_requested: {userId, displayName, avatarUrl}. approved/rejected: {userId, displayName}. Absent on other types."
          properties:
            userId:
              type: string
            displayName:
              type: string
            avatarUrl:
              type: string
              nullable: true
      required: [type]
    NotificationsDeletePayload:
      type: object
      description: "Client → server. Soft-deletes a single notification the caller owns."
      properties:
        notificationId: { type: string }
      required: [notificationId]
    NotificationDeletedPayload:
      type: object
      description: |
        Server → client. The id of a notification soft-deleted on another device;
        drop this row from the list (a `notification:count_update` follows).
      properties:
        notificationId: { type: string }
      required: [notificationId]
    MediaScanResultPayload:
      type: object
      description: |
        Server → client. Terminal media-scan verdict for an upload, delivered to
        the uploader only (their `notify:<uploaderId>` channel). Any `status` here
        means the upload is blocked.
      properties:
        objectKey:
          {
            type: string,
            description: "the upload's storage key (`{prefix}/{ownerId}/{fileId}.ext`).",
          }
        status:
          type: string
          enum: [INFECTED, QUARANTINED, ERROR]
          description: "terminal scan verdict — all values are upload-blocking."
        reason:
          {
            type: string,
            description: "engine-specific detail (signature name on INFECTED, message on ERROR); may be an empty string.",
          }
        at:
          {
            type: integer,
            description: "epoch ms when the verdict was published.",
          }
      required: [objectKey, status, reason, at]

    # -------- /chat friend management + session payloads --------
    FriendRequestPayload:
      type: object
      description: "Client → server. The addressee is a user UUID; sender is derived from the socket."
      properties:
        addresseeId: { type: string, format: uuid }
      required: [addresseeId]
    FriendRequestIdRef:
      type: object
      description: "Reference to a pending friend request by id (accept / reject / cancel)."
      properties:
        requestId: { type: string, format: uuid }
      required: [requestId]
    FriendTargetRef:
      type: object
      description: "Reference to a user to unfriend."
      properties:
        targetUserId: { type: string, format: uuid }
      required: [targetUserId]
    AuthRefreshPayload:
      type: object
      description: "Client → server. The refresh token issued at login; the gateway exchanges it for a fresh access token."
      properties:
        refreshToken: { type: string, minLength: 1 }
      required: [refreshToken]
    FriendshipPeerBrief:
      type: object
      description: "Minimal peer profile — only attached on friend:request:sent/received, where the caller already has both profiles loaded."
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
      required: [userId, username, firstName, lastName]
    FriendshipEventPayload:
      type: object
      description: |
        Server → client. Shared shape for every `friend:*` realtime event —
        published by user-service (`buildFriendshipView` +
        `friendshipEventData`) after every friendship-mutating DB write, to
        the affected user(s)' `user:<id>` room (every logged-in device).
        `status`/`direction`/`canAccept`/`canReject`/`canCancel` are the same
        fields returned by the REST friendship endpoints (send/accept/reject/
        cancel/unfriend/status), always derived from the VIEWING user's
        perspective — i.e. the payload delivered to each side of a pair
        differs only in these derived fields, `peerId`/`peer`, and which
        event name fires.
      properties:
        friendshipId: { type: string, format: uuid }
        peerId:
          {
            type: string,
            format: uuid,
            description: "The other party's userId.",
          }
        peer: { $ref: "#/components/schemas/FriendshipPeerBrief" }
        status:
          {
            type: string,
            enum:
              [
                NONE,
                PENDING,
                ACCEPTED,
                REJECTED,
                CANCELLED,
                UNFRIENDED,
                BLOCKED,
              ],
          }
        direction: { type: [string, "null"], enum: [OUTGOING, INCOMING, null] }
        canAccept: { type: boolean }
        canReject: { type: boolean }
        canCancel: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [
          friendshipId,
          peerId,
          status,
          direction,
          canAccept,
          canReject,
          canCancel,
        ]
    FriendBlockedPayload:
      type: object
      description: "Server → client. Pushed to the BLOCKER's own devices only — silent to the blocked party."
      properties:
        peerId: { type: string, format: uuid }
        status: { type: string, enum: [BLOCKED] }
        direction: { type: "null" }
        canAccept: { type: boolean, enum: [false] }
        canReject: { type: boolean, enum: [false] }
        canCancel: { type: boolean, enum: [false] }
      required: [peerId, status, direction, canAccept, canReject, canCancel]
    FriendUnblockedPayload:
      type: object
      description: "Server → client. Pushed to the UNBLOCKER's own devices only."
      properties:
        peerId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum: [NONE, PENDING, ACCEPTED, REJECTED, CANCELLED, UNFRIENDED],
          }
        direction: { type: [string, "null"], enum: [OUTGOING, INCOMING, null] }
        canAccept: { type: boolean }
        canReject: { type: boolean }
        canCancel: { type: boolean }
      required: [peerId, status, direction, canAccept, canReject, canCancel]
    SessionExpiredPayload:
      type: object
      description: |
        Server → client. Emitted ~5 min before the handshake access token
        expires. Call `auth:refresh` (or re-authenticate over REST and reconnect)
        within `gracePeriod` seconds or the server force-disconnects.
      properties:
        reason: { type: string, enum: [TOKEN_EXPIRED] }
        expiresAt:
          { type: integer, description: "epoch ms when the token expires." }
        reconnect:
          {
            type: boolean,
            description: "always true — the client should refresh or reconnect.",
          }
        gracePeriod:
          {
            type: integer,
            description: "seconds before force-disconnect (60).",
          }
      required: [reason, expiresAt, reconnect, gracePeriod]

    # -------- /community moderation payloads --------
    CommunityMemberRef:
      type: object
      description: "Client → server. Target a member by id within a community."
      properties:
        communityId: { type: string, minLength: 1 }
        targetUserId: { type: string, minLength: 1 }
      required: [communityId, targetUserId]
    CommunityModerateMemberPayload:
      type: object
      description: "Client → server. Kick or ban a member, with an optional reason (≤500)."
      properties:
        communityId: { type: string, minLength: 1 }
        targetUserId: { type: string, minLength: 1 }
        reason: { type: string, maxLength: 500 }
      required: [communityId, targetUserId]
    CommunityAdminTransferPayload:
      type: object
      description: "Client → server. Transfer ownership to another member (admin only)."
      properties:
        communityId: { type: string, minLength: 1 }
        newAdminId: { type: string, minLength: 1 }
      required: [communityId, newAdminId]
    CommunityRoleChangePayload:
      type: object
      description: "Client → server. Set a member's role (admin only)."
      properties:
        communityId: { type: string, minLength: 1 }
        targetUserId: { type: string, minLength: 1 }
        newRole: { type: string, enum: [MODERATOR, MEMBER] }
      required: [communityId, targetUserId, newRole]
    CommunityReportPayload:
      type: object
      description: "Client → server. File a report. Omit targetMessageId to report the community itself."
      properties:
        communityId: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        targetMessageId: { type: string }
      required: [communityId, reason]
    CommunityDeletePayload:
      type: object
      description: "Client → server. Delete a community (admin only)."
      properties:
        communityId: { type: string, minLength: 1 }
        reason: { type: string, maxLength: 500 }
      required: [communityId]
    CommunityDeletedPayload:
      type: object
      description: "Server → client. Broadcast to community:<id> when the community is deleted."
      properties:
        communityId: { type: string }
        deletedBy:
          { type: string, description: "userId of the admin who deleted it." }
      required: [communityId, deletedBy]
    CommunityClosedPayload:
      type: object
      description: |
        Server → client. Broadcast to community:<id> AND to every (now ex-)member's
        user:<id> room when the owner closes the community (status → CLOSED). All
        members are auto-removed; the community is read-only until reopened.
      properties:
        communityId: { type: string }
        status: { type: string, enum: [CLOSED] }
        closedAt:
          {
            type: integer,
            description: "Epoch ms when the community was closed.",
          }
        reason:
          {
            type: string,
            description: "Optional owner-supplied reason. Absent when none given.",
          }
      required: [communityId, status, closedAt]
    CommunityReopenedPayload:
      type: object
      description: |
        Server → client. Broadcast to community:<id> when the owner reopens a
        previously CLOSED community (status → ACTIVE). Former members are NOT
        auto-restored — they re-join via the normal flow.
      properties:
        communityId: { type: string }
        status: { type: string, enum: [ACTIVE] }
        reopenedAt:
          {
            type: integer,
            description: "Epoch ms when the community was reopened.",
          }
      required: [communityId, status, reopenedAt]
    CommunityAddedPayload:
      type: object
      description: >-
        Server → client. Delivered to the new member's user:<id> channel on
        membership creation. Full list-row snapshot — apply verbatim to insert the
        community into the sidebar / "mine" list. `avatarUrl` is a resolved
        presigned URL (render as-is, never persist). Idempotent on communityId.

        **`lastActivity`** is structurally identical to `CommunityListItem.lastActivity`
        from `GET /communities/mine`. For a newly-added member it is always the
        personal "You joined the community" system message. The client MUST use it
        directly and MUST NOT call Mine API to back-fill a missing last activity.

        **Idempotency / ordering.** Upsert by `communityId`; the newer `addedAt`
        wins (primary ordering/idempotency key). `eventId` (optional, additive)
        lets a client also suppress an EXACT duplicate delivery (a reconnect
        replay or a multi-gateway double-publish reuses the same `eventId`).
      properties:
        eventId:
          type: string
          description: >-
            Optional stable per-emit identifier (UUID). Additive — clients MAY
            dedupe an exact duplicate by eventId; the primary idempotency/ordering
            key remains addedAt (newer wins) + upsert-by-communityId.
        occurredAt:
          type: integer
          description: "Optional epoch ms — when the event was emitted (mirrors addedAt)."
        communityId: { type: string }
        name: { type: string }
        handle: { type: string }
        description: { type: string, nullable: true }
        avatarUrl:
          type: string
          nullable: true
          description: "Resolved presigned URL — render as-is, never persist."
        type:
          type: string
          enum: [PUBLIC, PRIVATE]
        categoryId: { type: string, nullable: true }
        categoryName: { type: string, nullable: true }
        memberCount: { type: integer }
        role:
          type: string
          enum: [ADMIN, MODERATOR, MEMBER]
          description: "The recipient's role in the community."
        status:
          type: string
          enum: [ACTIVE, CLOSED]
        via:
          type: string
          enum:
            [
              created,
              add_members,
              join_request_approved,
              join_request_auto_accept,
              invite_auto_approve,
              invite_link_redeem,
              self_join,
            ]
          description: >-
            How the recipient became a member. "created" means the recipient
            IS the creator — they created this community. All other values mean
            they joined an existing community. Branch on this to show
            creation-specific UI (e.g. "Community created" banner).
        joinedAt: { type: integer, description: "Epoch ms." }
        addedAt: { type: integer, description: "Epoch ms — idempotency key." }
        lastActivity:
          type: object
          description: >-
            The recipient's personal last-activity preview — always the private
            "You joined the community" system message at join time.
            Structurally identical to CommunityListItem.lastActivity from
            GET /communities/mine. Upsert it into the community-list row as-is;
            never rebuild it on the client.
          properties:
            type:
              type: string
              enum:
                [
                  message,
                  reaction,
                  edited,
                  deleted,
                  system,
                  created,
                  join,
                  removal,
                  pinned,
                  unpinned,
                ]
              description: >-
                "system" means username is null and preview is a standalone
                sentence — never prefix it with a sender name.
            userId:
              type: string
              nullable: true
              description: "null for system/lifecycle types — always null in this event."
            username:
              type: string
              nullable: true
              description: "null for system/lifecycle types — always null in this event."
            preview:
              type: string
              description: "Display text. For join: 'You joined the community'."
            dateTime:
              type: integer
              description: "Epoch ms — matches the system message createdAt."
          required: [type, userId, username, preview, dateTime]
      required:
        [
          communityId,
          name,
          handle,
          description,
          avatarUrl,
          type,
          categoryId,
          categoryName,
          memberCount,
          role,
          status,
          via,
          joinedAt,
          addedAt,
          lastActivity,
        ]
    CommunityStatsUpdatedPayload:
      type: object
      description: "Server → client. Broadcast to community:<id> when active memberCount changes."
      properties:
        communityId: { type: string }
        memberCount:
          { type: integer, description: "Current active member count." }
        updatedAt: { type: integer, description: "Epoch ms of the change." }
      required: [communityId, memberCount, updatedAt]
    CommunityMemberRemovedPayload:
      type: object
      description: "Server → client. Emitted on kick, ban, or voluntary leave."
      properties:
        communityId: { type: string }
        userId: { type: string, description: "The removed member's userId." }
        reason:
          type: string
          enum: [kicked, banned, left]
        actorId:
          type: string
          nullable: true
          description: "Who performed the action. Same as userId for voluntary leave."
        updatedAt: { type: integer, description: "Epoch ms." }
      required: [communityId, userId, reason, updatedAt]
    CommunityMemberUnbannedPayload:
      type: object
      description: "Server → client. Emitted when an admin lifts a member's ban."
      properties:
        communityId: { type: string }
        userId: { type: string, description: "The unbanned member's userId." }
        actorId: { type: string, description: "The admin who lifted the ban." }
        updatedAt: { type: integer, description: "Epoch ms." }
      required: [communityId, userId, actorId, updatedAt]
    CommunityMemberMutedPayload:
      type: object
      description: "Server → client. A member was muted by moderation (can read, cannot post). Sent to community:<id> and the muted member's user:<id>."
      properties:
        communityId: { type: string }
        memberId: { type: string, description: "The muted member's userId." }
        isMuted:
          type: boolean
          enum: [true]
          description: "Always true for this event (self-describing payload)."
        mutedUntil:
          type: integer
          nullable: true
          description: "Epoch ms when the mute expires; null = indefinite."
        actorId:
          type: string
          description: 'The admin/moderator who muted ("" for a system action).'
        updatedAt: { type: integer, description: "Epoch ms." }
      required: [communityId, memberId, isMuted, mutedUntil, actorId, updatedAt]
    CommunityMemberUnmutedPayload:
      type: object
      description: "Server → client. A member's moderation mute was lifted (manual or auto-expiry). Sent to community:<id> and the member's user:<id>."
      properties:
        communityId: { type: string }
        memberId: { type: string, description: "The unmuted member's userId." }
        isMuted:
          type: boolean
          enum: [false]
          description: "Always false for this event."
        mutedUntil:
          type: integer
          nullable: true
          description: "Always null for an unmute."
        actorId:
          type: string
          description: 'Who lifted the mute ("" for an automatic/system unmute).'
        updatedAt: { type: integer, description: "Epoch ms." }
      required: [communityId, memberId, isMuted, mutedUntil, actorId, updatedAt]
    CommunityStreamStartedPayload:
      type: object
      description: "Server → client. A livestream went LIVE in a community. Relayed to community:<id> AND community-typing:<id> (every member)."
      properties:
        communityId: { type: string }
        livestreamId: { type: string }
        streamId: { type: string, description: "Legacy alias of livestreamId." }
        host:
          type: object
          properties:
            userId: { type: string }
            displayName: { type: string }
            avatarUrl:
              type: string
              nullable: true
              description: "Object key or resolved URL; resolve on read. May be null."
          required: [userId, displayName, avatarUrl]
        title: { type: string, nullable: true }
        sourceType:
          type: string
          enum: [PHONE_CAMERA, OBS_RTMP, URL, YOUTUBE]
          description: "Stream source type, matching the REST stream read model."
        sourceUrl:
          type: string
          nullable: true
          description: "Original external source URL for URL/YOUTUBE streams, otherwise null."
        hlsUrl:
          {
            type: string,
            nullable: true,
            description: "Primary playback URL (HLS).",
          }
        flvUrl:
          type: string
          nullable: true
        dashUrl:
          type: string
          nullable: true
        youtubeVideoId:
          type: string
          nullable: true
          description: 'Extracted YouTube video id when sourceType is "YOUTUBE", otherwise null.'
        status: { type: string, enum: [LIVE] }
        startedAt: { type: integer, description: "Epoch ms." }
        livedAt:
          type: integer
          description: "REST-compatible alias of startedAt, in epoch ms."
        liveStreamCount:
          type: integer
          description: "LIVE-only count after this stream went live (0–5, capped)."
        hasActiveLivestream: { type: boolean, enum: [true] }
      required:
        [
          communityId,
          livestreamId,
          streamId,
          host,
          sourceType,
          sourceUrl,
          hlsUrl,
          flvUrl,
          dashUrl,
          youtubeVideoId,
          status,
          startedAt,
          livedAt,
          liveStreamCount,
          hasActiveLivestream,
        ]
    CommunityStreamEndedPayload:
      type: object
      description: "Server → client. A livestream ENDED in a community. Fires on EVERY end with the updated count — drive banner visibility off hasActiveLivestream/liveStreamCount."
      properties:
        communityId: { type: string }
        livestreamId: { type: string }
        streamId: { type: string, description: "Legacy alias of livestreamId." }
        host:
          type: object
          properties:
            userId: { type: string }
            displayName: { type: string }
            avatarUrl: { type: string, nullable: true }
          required: [userId, displayName, avatarUrl]
        status: { type: string, enum: [ENDED] }
        endedAt: { type: integer, description: "Epoch ms." }
        duration:
          {
            type: string,
            description: 'Human-readable runtime, e.g. "1h 24m".',
          }
        durationSeconds: { type: integer }
        liveStreamCount:
          type: integer
          description: "Remaining LIVE count (0 when the final stream ended)."
        hasActiveLivestream:
          type: boolean
          description: "Stays true while other streams run; false only when the last ends."
      required:
        [
          communityId,
          livestreamId,
          streamId,
          host,
          status,
          endedAt,
          duration,
          durationSeconds,
          liveStreamCount,
          hasActiveLivestream,
        ]
    CommunityMetaDto:
      type: object
      description: "Canonical post-update community metadata snapshot. Apply verbatim to the detail/header; patch the list row from it. `avatar` is a resolved presigned URL."
      properties:
        communityId: { type: string }
        name: { type: string }
        handle: { type: string }
        description: { type: string, nullable: true }
        avatar:
          type: string
          nullable: true
          description: "Resolved presigned URL — render as-is, never persist."
        type:
          type: string
          enum: [PUBLIC, PRIVATE]
        categoryId: { type: string, nullable: true }
        categoryName: { type: string, nullable: true }
        memberCount: { type: integer }
        updatedAt: { type: integer, description: "Epoch ms." }
      required:
        [
          communityId,
          name,
          handle,
          description,
          avatar,
          type,
          categoryId,
          categoryName,
          memberCount,
          updatedAt,
        ]
    CommunityMetaUpdatedPayload:
      type: object
      description: >-
        Server → client. Community metadata changed. Delivered to community:<id>
        (detail/header/chat) AND each active member's user:<id> (list row).
        Distinct from community:updated (list bump) — a metadata patch, no reorder.
      properties:
        communityId: { type: string }
        changes:
          type: object
          description: "Only the keys that genuinely changed are present and true."
          properties:
            name: { type: boolean }
            avatar: { type: boolean }
            description: { type: boolean }
            category: { type: boolean }
            visibility: { type: boolean }
            handle: { type: boolean }
        community: { $ref: "#/components/schemas/CommunityMetaDto" }
        updatedAt: { type: integer, description: "Epoch ms — idempotency key." }
      required: [communityId, changes, community, updatedAt]
    CommunityMemberUpdatedPayload:
      type: object
      description: >-
        Server → client. A single member's roster row changed (role change, admin
        transfer, or profile sync). Broadcast to community:<id>.
      properties:
        communityId: { type: string }
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        role:
          type: string
          enum: [ADMIN, MODERATOR, MEMBER]
        updatedAt: { type: integer, description: "Epoch ms." }
      required: [communityId, userId, updatedAt]

    # -------- /community parity schemas --------
    CommunityMarkReadPayload:
      type: object
      description: "Client → server. Mark community messages as read up to a given message id."
      properties:
        communityId:
          type: string
          minLength: 1
          maxLength: 200
        roomId:
          type: string
          maxLength: 200
          description: "Optional — defaults to the community general room when omitted."
        upToMessageId:
          type: string
          minLength: 1
          maxLength: 200
          description: "Server will mark all messages up to and including this id as read for the caller."
      required: [communityId, upToMessageId]
    CommunityMarkReadBroadcast:
      type: object
      description: "Server → client. Broadcast to community:<communityId> room after a member marks messages read."
      properties:
        communityId: { type: string }
        readerId:
          { type: string, description: "userId of the member who read." }
        upToMessageId: { type: string }
        readAt:
          { type: integer, description: "Epoch ms when the read was recorded." }
      required: [communityId, readerId, upToMessageId, readAt]
    CommunityReadSyncPayload:
      type: object
      description: |
        Server → client. Multi-device read high-water mark for community chat.
        Delivered to the reader's OWN other devices via `user:<readerId>` room
        so every screen clears unread counts together.
      properties:
        communityId: { type: string }
        upToMessageId: { type: string }
        readAt:
          { type: integer, description: "Epoch ms when the read was recorded." }
      required: [communityId, upToMessageId, readAt]
    CommunityReactionsGetPayload:
      type: object
      description: "Client → server. Request the full reaction user list for a community message."
      properties:
        messageId:
          type: string
          minLength: 1
          maxLength: 200
        communityId:
          type: string
          minLength: 1
          maxLength: 200
      required: [messageId, communityId]
    CommunityForwardPayload:
      type: object
      description: "Client → server. Forward an existing community message to another community room."
      properties:
        messageId:
          type: string
          minLength: 1
          maxLength: 200
          description: "Id of the message to forward."
        communityId:
          type: string
          minLength: 1
          maxLength: 200
          description: "Source community id."
        targetCommunityId:
          type: string
          minLength: 1
          maxLength: 200
          description: "Destination community id."
        targetRoomId:
          type: string
          maxLength: 200
          description: "Optional destination room id — defaults to the target community's general room."
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 200
          description: "Client-generated idempotency key (UUID recommended)."
      required: [messageId, communityId, targetCommunityId, clientMessageId]

    # -------- /stream --------
    StreamRef:
      type: object
      description: "Client → server. Identifies the target livestream. Shared by stream:join, stream:leave, and stream:heartbeat."
      properties:
        streamId: { type: string, minLength: 1 }
      required: [streamId]
    StreamCommentPostPayload:
      type: object
      description: "Client → server. Post a new livestream comment."
      properties:
        streamId: { type: string, minLength: 1 }
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: "Comment text (500-char cap enforced at the gateway; stream-service enforces the authoritative limit)."
        clientCommentId:
          type: string
          maxLength: 200
          description: "Optional client-generated idempotency key. Echoed back on the ack."
      required: [streamId, message]
    StreamLoadMorePayload:
      type: object
      description: |
        Client → server. Cursor-paginated comment history / reconnect
        catch-up. `before` and `after` are exclusive comment-id cursors —
        supply at most one; omit both for the newest page.
      properties:
        streamId: { type: string, minLength: 1 }
        before:
          type: string
          description: "Fetch comments older than this comment id (history scroll)."
        after:
          type: string
          description: "Fetch comments newer than this comment id (reconnect catch-up gap-fill)."
        limit:
          type: integer
          minimum: 1
          maximum: 50
          description: "Page size. Server default (20) applies when omitted."
      required: [streamId]
    StreamReactPayload:
      type: object
      description: "Client → server. Send an ephemeral emoji reaction — never persisted, never round-trips to stream-service."
      properties:
        streamId: { type: string, minLength: 1 }
        emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: "One emoji grapheme, including ZWJ/skin-tone sequences."
      required: [streamId, emoji]
    StreamCommentDeletePayload:
      type: object
      description: "Client → server. Delete a livestream comment (own comment, or moderator/owner)."
      properties:
        streamId: { type: string, minLength: 1 }
        commentId: { type: string, minLength: 1 }
      required: [streamId, commentId]
    StreamCommentObject:
      type: object
      description: |
        One livestream comment as returned by stream-service (`stream:join`
        backfill and `stream:load_more`). `senderAvatar` is presigned by the
        gateway to a ready-to-use download URL (falls back to the raw
        object key if presigning fails).
      properties:
        id: { type: string }
        sentBy: { type: string, description: "Author's userId." }
        senderName: { type: string }
        senderAvatar:
          type: string
          description: "Presigned download URL, or the raw object key on presign failure. Empty string if the author has no avatar."
        message: { type: string }
        createdAt: { type: integer, description: "Epoch ms." }
      required: [id, sentBy, senderName, senderAvatar, message, createdAt]
    StreamSnapshot:
      type: object
      description: "Snapshot of stream state at join time — lets the client render the livestream screen on reconnect without a separate REST detail call."
      properties:
        status:
          type: string
          enum: [PENDING, LIVE, RECONNECTING, ENDED]
        chatEnabled:
          type: boolean
          description: "Same value as the ack's top-level canComment."
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        thumbnail:
          type: string
          nullable: true
          description: "Raw thumbnail object key, or null if none — resolve on read."
        creatorId: { type: string }
        hlsUrl: { type: string, nullable: true }
        flvUrl: { type: string, nullable: true }
      required:
        [
          status,
          chatEnabled,
          title,
          description,
          thumbnail,
          creatorId,
          hlsUrl,
          flvUrl,
        ]
    StreamJoinAckData:
      type: object
      description: "`data` of the stream:join ack."
      properties:
        viewerCount: { type: integer, minimum: 0 }
        recentComments:
          type: array
          description: "Most recent comments, oldest-first (up to 20)."
          items: { $ref: "#/components/schemas/StreamCommentObject" }
        nextCursor:
          { type: string, description: "Empty string when hasMore is false." }
        hasMore: { type: boolean }
        canComment: { type: boolean }
        streamSnapshot: { $ref: "#/components/schemas/StreamSnapshot" }
      required:
        [
          viewerCount,
          recentComments,
          nextCursor,
          hasMore,
          canComment,
          streamSnapshot,
        ]
    StreamCommentPostAckData:
      type: object
      description: "`data` of the stream:comment ack. The full comment is broadcast separately as stream:comment:new."
      properties:
        commentId: { type: string }
        streamId: { type: string }
        sentAt: { type: integer, description: "Epoch ms." }
        clientCommentId:
          type: string
          description: "Echoes the request's clientCommentId, or empty string if none was supplied."
      required: [commentId, streamId, sentAt, clientCommentId]
    StreamLoadMoreAckData:
      type: object
      description: "`data` of the stream:load_more ack."
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/StreamCommentObject" }
        nextCursor: { type: string }
        hasMore: { type: boolean }
      required: [comments, nextCursor, hasMore]
    StreamCommentDeleteAckData:
      type: object
      description: "`data` of the stream:comment:delete ack."
      properties:
        commentId: { type: string }
        streamId: { type: string }
      required: [commentId, streamId]
    StreamCommentNewPayload:
      type: object
      description: |
        Server → client. New livestream comment broadcast, published
        exclusively by stream-service to Redis `stream:<streamId>`. Mirrors
        the canonical chat/community message envelope so the same message
        component can render it. `parentCommentId` / `quoteData` /
        `content.files` are reserved for future reply/media support and are
        always empty/null today.
      properties:
        id: { type: string }
        commentId: { type: string, description: "Same value as id." }
        streamId: { type: string }
        senderId: { type: string }
        senderName:
          type: string
          description: 'Replaced with "You" in the copy delivered to the poster''s own socket(s).'
        senderAvatar:
          type: string
          description: "Presigned download URL, or the raw object key on presign failure."
        parentCommentId:
          { type: string, description: 'Always "" today (reserved).' }
        quoteData:
          {
            type: object,
            nullable: true,
            description: "Always null today (reserved).",
          }
        content:
          type: object
          properties:
            text: { type: string }
            files: { type: array, items: {} }
          required: [text, files]
        message: { type: string, description: "Same value as content.text." }
        contentType: { type: string, enum: [TEXT] }
        isEdited: { type: boolean, enum: [false] }
        editedAt: { type: integer, enum: [0] }
        clientCommentId:
          {
            type: string,
            description: 'Echoes the poster''s clientCommentId, or "" if none.',
          }
        serverTs:
          { type: integer, description: "Epoch ms. Same value as sentAt." }
        sentAt: { type: integer, description: "Epoch ms." }
      required:
        [
          id,
          commentId,
          streamId,
          senderId,
          senderName,
          senderAvatar,
          parentCommentId,
          quoteData,
          content,
          message,
          contentType,
          isEdited,
          editedAt,
          clientCommentId,
          serverTs,
          sentAt,
        ]
    StreamViewerCountPayload:
      type: object
      description: "Server → client. Live viewer count changed. Debounced to <= 1 emit/sec per stream."
      properties:
        streamId: { type: string }
        viewerCount: { type: integer, minimum: 0 }
      required: [streamId, viewerCount]
    StreamStatusPayload:
      type: object
      description: |
        Server → client. Livestream lifecycle status changed — room-wide
        broadcast of the STABLE shape only. Internal broadcaster context
        (creatorId/hlsUrl/flvUrl/startedAt), present on the underlying
        Redis message for LIVE transitions, is stripped by the gateway
        before this relay and sent instead as a targeted
        stream:broadcast:live to the broadcaster's own socket.
      properties:
        streamId: { type: string }
        status:
          type: string
          enum: [PENDING, LIVE, RECONNECTING, ENDED]
        communityId:
          type: string
          description: "Lets a viewer screen update the community's isLive badge without a separate /community subscription."
      required: [streamId, status, communityId]
    StreamBroadcastLivePayload:
      type: object
      description: "Server → client. Targeted to the broadcaster's OWN socket(s) only — confirms LIVE with ingest/playback context. Not delivered to viewers."
      properties:
        streamId: { type: string }
        startedAt: { type: integer, description: "Epoch ms." }
        hlsUrl:
          type: string
          description: "Primary playback URL (HLS). Empty string if none (e.g. YOUTUBE source)."
        flvUrl:
          type: string
          description: "Empty string if none."
      required: [streamId, startedAt, hlsUrl, flvUrl]
    StreamBannedPayload:
      type: object
      description: "Server → client. Targeted to the just-banned viewer's OWN socket(s) only, immediately followed by a forced room eviction. Never room-broadcast."
      properties:
        streamId: { type: string }
      required: [streamId]
    StreamMemberMutedPayload:
      type: object
      description: "Server → client. Targeted to the muted user's OWN socket(s) only. Never evicts — the viewer stays in the room with the composer disabled."
      properties:
        streamId: { type: string }
        userId: { type: string, description: "The muted member's userId." }
        mutedUntil:
          type: integer
          description: "Epoch ms the mute expires, or 0 for an indefinite mute."
        reason:
          type: string
          nullable: true
          description: "Moderator-supplied reason, or null if none was given."
      required: [streamId, userId, mutedUntil, reason]
    StreamMemberUnmutedPayload:
      type: object
      description: "Server → client. Targeted to the affected user's OWN socket(s) only."
      properties:
        streamId: { type: string }
        userId: { type: string, description: "The unmuted member's userId." }
      required: [streamId, userId]
    StreamReactNewPayload:
      type: object
      description: "Server → client. Ephemeral emoji reaction broadcast to the whole room. Never persisted."
      properties:
        streamId: { type: string }
        userId: { type: string, description: "Who sent the reaction." }
        emoji: { type: string }
      required: [streamId, userId, emoji]
    StreamErrorPayload:
      type: object
      description: "Server → client. Out-of-band error push. Currently emitted only when stream:join's access check itself fails (service outage)."
      properties:
        streamId: { type: string }
        code:
          type: string
          enum: [SERVICE_UNAVAILABLE]
      required: [streamId, code]
