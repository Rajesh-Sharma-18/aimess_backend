    CommunityStreamStarted:
      name: "community:stream:started"
      title: "community:stream:started"
      summary: "A livestream went LIVE in a community. Emitted by stream-service to community:<id> AND relayed to the lightweight community-typing:<id> room (auto-joined by every member) so the live banner / list badge appears WITHOUT opening the chat. Additive over the legacy { communityId, streamId, title, hlsUrl } shape. liveStreamCount is the LIVE-only count after this stream went live (capped at 5); hasActiveLivestream is always true here."
      payload: { $ref: "#/components/schemas/CommunityStreamStartedPayload" }
      examples:
        - name: A member started a livestream
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            livestreamId: "684abc123def4567890123ff"
            streamId: "684abc123def4567890123ff"
            host:
              userId: "user_xyz"
              displayName: "Jane Doe"
              avatarUrl: "communities/avatars/jane.jpg"
            title: "Friday Q&A"
            sourceType: YOUTUBE
            sourceUrl: "https://youtu.be/_JF_s-ZRTyY"
            hlsUrl: "https://cdn.aimess.com/hls/684abc.m3u8"
            flvUrl: "https://cdn.aimess.com/hls/684abc.flv"
            dashUrl: "https://cdn.aimess.com/hls/684abc.mpd"
            youtubeVideoId: "_JF_s-ZRTyY"
            status: LIVE
            startedAt: 1750000400000
            livedAt: 1750000400000
            liveStreamCount: 1
            hasActiveLivestream: true
    CommunityStreamEnded:
      name: "community:stream:ended"
      title: "community:stream:ended"
      summary: "A livestream ENDED in a community. Same fan-out as community:stream:started. Unlike the legacy behavior (fired only when the LAST stream ended), this fires on EVERY end carrying the updated count — drive banner visibility off hasActiveLivestream/liveStreamCount, NOT the event's presence. hasActiveLivestream stays true while other streams remain live and flips false only when the final stream ends (liveStreamCount === 0)."
      payload: { $ref: "#/components/schemas/CommunityStreamEndedPayload" }
      examples:
        - name: The last livestream ended
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            livestreamId: "684abc123def4567890123ff"
            streamId: "684abc123def4567890123ff"
