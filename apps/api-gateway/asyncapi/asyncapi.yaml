    # -------- /notify --------
    NotificationsFetch:
      name: "notifications:fetch"
      title: "notifications:fetch"
      payload: { $ref: "#/components/schemas/NotificationsFetchPayload" }
      examples:
        - name: Fetch latest notifications
          payload:
            limit: 20
        - name: Fetch next page
          payload:
            cursor: "683abc100def000000000099"
            limit: 20
    NotificationsMarkRead:
      name: "notifications:mark_read"
      title: "notifications:mark_read"
      payload: { $ref: "#/components/schemas/NotificationsMarkReadPayload" }
      examples:
        - name: Mark two notifications as read
          payload:
            notificationIds:
              - "683abc100def000000000099"
              - "683abc100def000000000098"
        - name: Mark all as read
          payload:
            notificationIds: []
    NotificationsDelete:
      name: "notifications:delete"
      title: "notifications:delete"
      summary: "Owner-scoped soft-delete of a single notification."
      payload: { $ref: "#/components/schemas/NotificationsDeletePayload" }
      examples:
        - name: Delete one notification
          payload:
            notificationId: "683abc100def000000000099"
    NotificationCount:
      name: "notification:count"
      title: "notification:count"
      payload: { $ref: "#/components/schemas/NotificationCountPayload" }
      examples:
        - name: Five unread notifications
          payload:
            count: 5
        - name: All notifications read
          payload:
            count: 0
    NotificationCountUpdate:
      name: "notification:count_update"
      title: "notification:count_update"
      summary: "Real-time unread badge count refresh (all devices)"
      description: |
        Emitted to `user:<userId>` (all connected devices) whenever the
        aggregate unread notification count changes:
        - After a successful `notifications:mark_read` the gateway pushes the
          updated count so all devices sync immediately.
        - When the notifications-service creates a new notification it publishes
          `{ event: "notification:count_update", data: { count } }` to the
          `notify:<userId>` Redis channel, which the gateway forwards verbatim.

        Client rule: on receipt replace the badge/tab-count with `count`.
        Aggregate total only — no per-type breakdown in V1.
      payload: { $ref: "#/components/schemas/NotificationCountPayload" }
      examples:
        - name: Count updated to 3 after mark-read
          payload:
            count: 3
        - name: New notification bumps count to 7
          payload:
            count: 7
    NotificationForwarded:
      name: "notification:new"
      title: "notification:new (forwarded in-app notification)"
      summary: |
        An in-app notification forwarded from `notify:<userId>` to `user:<userId>`.
        Typed as `NotificationItem`: a stable envelope (`type`, `title`, `body`,
        `referenceId`, `isRead`, `createdAt`) plus a `data` map of type-specific
        fields. `type` is the discriminator. The namespace forwards ANY event
        published to the channel verbatim, so treat unknown `type` values
        defensively.
      payload: { $ref: "#/components/schemas/NotificationItem" }
      examples:
        - name: New message
          payload:
            notificationId: "683abc100def000000000099"
            type: MESSAGE
            title: "Alice"
            body: "Hey! How are you?"
            referenceId: "6843e1a2b5c3d4e5f6a7b8c9"
            isRead: false
            createdAt: 1749465231234
            data:
              conversationId: "6843e1a2b5c3d4e5f6a7b8c9"
              conversationType: PRIVATE
              messageId: "msg_9876543210abcdef"
              senderId: "user_abc123"
              senderName: "Alice"
              contentType: TEXT
              preview: "Hey! How are you?"
              sentAt: "1749465231234"
        - name: Friend request
          payload:
            notificationId: "683abc100def0000000000a0"
            type: friend.requested
            title: "New friend request"
            body: "Bob sent you a friend request"
            referenceId: "frnd_123"
            isRead: false
            createdAt: 1749465300000
            data:
              friendshipId: "frnd_123"
              requesterId: "user_def456"
        - name: Community member added
          payload:
            notificationId: "683abc100def0000000000a1"
            type: community.member_added
            title: "Added to a community"
            body: "You were added to Design Guild"
            referenceId: "6843e1a2b5c3d4e5f6a7b8c9"
            isRead: false
            createdAt: 1749465400000
            data:
              communityId: "6843e1a2b5c3d4e5f6a7b8c9"
        - name: Community join request (to moderators)
          summary: Admin/mod receives a new join request notification
          payload:
            notificationId: "684abc100def000000000031"
            type: "community.join_requested"
            title: "New join request"
            body: "Alice Smith requested to join Tech Enthusiasts."
            referenceId: "684abc100def000000000001"
            isRead: false
            createdAt: 1749465231234
            navigation:
              screen: COMMUNITY_REQUESTS
              communityId: "684abc100def000000000001"
              communityName: "Tech Enthusiasts"
              communityAvatarUrl: "https://minio.example.com/community/avatar/uid/abc.jpg"
              communityHandle: "tech-enthusiasts"
              requestId: "684abc100def000000000022"
            actorSnapshot:
              userId: "684abc100def000000000099"
              displayName: "Alice Smith"
              avatarUrl: "https://minio.example.com/avatars/uid/abc.jpg"
        - name: Community join request approved (to requester)
          summary: Requester receives approval notification
          payload:
            notificationId: "684abc100def000000000032"
            type: "community.join_request_approved"
            title: "Join request approved"
            body: "Your request to join Tech Enthusiasts was approved by Bob Jones."
            referenceId: "684abc100def000000000001"
            isRead: false
            createdAt: 1749465299999
            navigation:
              screen: COMMUNITY_DETAILS
              communityId: "684abc100def000000000001"
              communityName: "Tech Enthusiasts"
              communityAvatarUrl: "https://minio.example.com/community/avatar/uid/abc.jpg"
              communityHandle: "tech-enthusiasts"
              requestId: "684abc100def000000000022"
            actorSnapshot:
              userId: "684abc100def000000000010"
              displayName: "Bob Jones"
        - name: Community self-joined (to member)
          summary: Member receives confirmation after joining a public community
          payload:
            notificationId: "684abc200def000000000041"
            type: "community.member_joined"
            title: "Joined a community"
            body: "You have joined Photography Club."
            referenceId: "6843e1a2b5c3d4e5f6a7b8c9"
            isRead: false
            createdAt: 1749465500000
            navigation:
              screen: COMMUNITY_DETAILS
              communityId: "6843e1a2b5c3d4e5f6a7b8c9"
              communityName: "Photography Club"
              communityAvatarUrl: null
              communityHandle: "photography-club"
    NotificationRead:
      name: "notification:read"
      title: "notification:read"
      summary: "A subset of notifications was marked read (all devices)"
      description: |
        Emitted to `user:<userId>` (all connected devices) after a successful
        mark-read of one or more specific notifications, from EITHER:
        - `POST /chat/notifications/read` (REST) — relayed via the
          `notify:<userId>` Redis channel, or
        - `notifications:mark_read` (socket, non-empty `notificationIds`) —
          emitted directly by the gateway.
        A `notification:count_update` follows with the same total for clients
        that only listen to the legacy count event.
      payload: { $ref: "#/components/schemas/NotificationReadPayload" }
      examples:
        - name: Two notifications marked read
          payload:
            unreadCount: 4
    NotificationAllRead:
      name: "notification:all-read"
      title: "notification:all-read"
      summary: "Every notification (or one tab) was marked read (all devices)"
      description: |
        Emitted to `user:<userId>` (all connected devices) after a successful
        `POST /chat/notifications/read-all` (REST, relayed via Redis) or a
        `notifications:mark_read` call with an empty `notificationIds` array
        (socket, emitted directly by the gateway). `unreadCount` is always the
        total across ALL tabs — a per-tab Read All still reports the
        remaining unread in other tabs, not zero. A `notification:count_update`
        follows with the same total for clients that only listen to the legacy
        count event.
      payload: { $ref: "#/components/schemas/NotificationReadPayload" }
      examples:
        - name: All notifications read
          payload:
            unreadCount: 0
        - name: Only the FRIENDS tab marked read, other tabs still unread
          payload:
            unreadCount: 3
    NotificationDeleted:
      name: "notification:deleted"
      title: "notification:deleted"
      summary: |
        A notification row was soft-deleted (via `notifications:delete`) and is
        relayed verbatim to the user's OTHER connected devices so they drop the
        row. A `notification:count_update` follows with the refreshed unread total.
      payload: { $ref: "#/components/schemas/NotificationDeletedPayload" }
      examples:
        - name: Row deleted on another device
          payload:
            notificationId: "683abc100def000000000099"
    MediaScanResult:
      name: "media:scan_result"
      title: "media:scan_result"
      summary: |
        Terminal media-scan verdict pushed to the uploader's `notify:<uploaderId>`
        channel when an upload fails scanning (QUARANTINED / INFECTED / ERROR) or
        is rejected on synchronous confirm-upload. Socket-only — no inbox row and
        no offline FCM. Treat any `status` as "upload blocked".
      payload: { $ref: "#/components/schemas/MediaScanResultPayload" }
      examples:
        - name: Infected upload quarantined
          payload:
            objectKey: "group-chat-uploads/7c9e6679-7425-40de-944b-e07fc1f90ae7/6843e1a2b5c3d4e5f6a7b8c9.png"
            status: QUARANTINED
            reason: "Win.Test.EICAR_HDB-1"
            at: 1749465231234
        - name: Scan errored (no detail)
          payload:
            objectKey: "community-chat-uploads/7c9e6679-7425-40de-944b-e07fc1f90ae7/6843e1a2b5c3d4e5f6a7b8c9.pdf"
            status: ERROR
            reason: ""
            at: 1749465240000

