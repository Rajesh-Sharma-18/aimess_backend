    CommunityAdded:
      name: "community:added"
      title: "community:added"
      summary: >-
        Delivered to the new member's user:<id> channel when they become a member
        (admin add / join-request approval / invite-link redeem / self-join).
        Carries a full list-row snapshot so the client inserts the community into
        the sidebar / "mine" list instantly — no refetch, no refresh. Idempotent
        on communityId.
      payload: { $ref: "#/components/schemas/CommunityAddedPayload" }
      examples:
        - name: Added by an admin
          summary: >-
            Admin adds User B. The community:added event carries a full list-row
            snapshot including lastActivity ("You joined the community"). The
            client upserts this into the community sidebar without calling Mine API.
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            name: "Nature Lovers"
            handle: "nature"
            description: "All things nature."
            avatarUrl: "https://cdn.example.com/community/avatar/abc.jpg?X-Amz-..."
            type: PUBLIC
            categoryId: "6843c0c0c0c0c0c0c0c0c0c0"
            categoryName: "Hobbies"
            memberCount: 2
            role: MEMBER
            status: ACTIVE
            via: add_members
            joinedAt: 1750000000000
            addedAt: 1750000000000
            lastActivity:
              type: system
              userId: null
              username: null
              preview: "You joined the community"
              dateTime: 1750000000000
        - name: Self-join (public community)
          summary: >-
            User joins a PUBLIC community themselves. lastActivity is identical
            in shape and semantics to the admin-add case.
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            name: "Tech Talk"
            handle: "techtalk"
            description: null
            avatarUrl: null
            type: PUBLIC
            categoryId: "6843c0c0c0c0c0c0c0c0c0c1"
            categoryName: "Technology"
            memberCount: 52
            role: MEMBER
            status: ACTIVE
            via: self_join
            joinedAt: 1750000200000
            addedAt: 1750000200000
            lastActivity:
              type: system
              userId: null
              username: null
              preview: "You joined the community"
              dateTime: 1750000200000
        - name: Creator just created the community
          summary: >-
            The creator receives community:added with via="created" immediately
            after POST /communities succeeds. Unified insert path — same event
            as all other join flows. Branch on via==="created" for any
            creation-specific UI. lastActivity.type is "created".
          payload:
            communityId: "6843e1a2b5c3d4e5f6a7b8c9"
            name: "Nature Lovers"
            handle: "nature"
            description: "All things nature."
            avatarUrl: null
            type: PUBLIC
            categoryId: "6843c0c0c0c0c0c0c0c0c0c0"
            categoryName: "Hobbies"
            memberCount: 1
            role: ADMIN
            status: ACTIVE
            via: created
            joinedAt: 1750000000000
            addedAt: 1750000000000
            lastActivity:
              type: created
              userId: null
              username: null
              preview: "Community created"
              dateTime: 1750000000000
