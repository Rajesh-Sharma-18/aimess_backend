        Client emits when the user starts recording a voice message in a
        community chat room. No ack. Canonical alias
        `community:recording:start` also accepted. Payload/validator
        (`CommunityTypingSchema`, community.ns.ts) reused as-is from typing —
        no new schema.
      payload:
        type: object
        required: [communityId]
