name: aimess

services:
  # ============================================================================
  # PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: aimess-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # MongoDB
  # ============================================================================
  mongodb:
    image: mongo:7
    container_name: aimess-mongodb
    restart: unless-stopped

    # Single-node replica set (rs0) — REQUIRED by Prisma's MongoDB connector,
    # which wraps writes to @unique-indexed models in transactions (a replica
    # set is mandatory). Local dev runs WITHOUT auth so no internal-auth keyfile
    # is needed (auth + replSet would require a mounted keyfile, painful on
    # Windows). Production uses a managed MongoDB (Atlas) with RS + auth.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    ports:
      - "${MONGODB_PORT}:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: [
          "CMD-SHELL",
          # Initiate with explicit localhost:27017 so the RS config is stable
          # across container restarts (ephemeral Docker hostnames break rs.status
          # on every restart — localhost is always valid inside the container).
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); }"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - aimess-network

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7
    container_name: aimess-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # RabbitMQ
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aimess-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # MinIO
  # ============================================================================
  minio:
    image: minio/minio
    container_name: aimess-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio_data:/data

    networks:
      - aimess-network

  # ============================================================================
  # pgAdmin
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: aimess-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - aimess-network

  # ============================================================================
  # Redis Commander
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander
    container_name: aimess-redis-commander
    restart: unless-stopped

    environment:
      REDIS_HOSTS: local:redis:6379

    ports:
      - "${REDIS_COMMANDER_PORT}:8081"

    depends_on:
      - redis

    networks:
      - aimess-network

  # ============================================================================
  # Redis Cluster — 3 primary nodes for chat-service (Socket.IO adapter + cache)
  #
  # Each node announces itself via host.docker.internal so that:
  #   • App processes on the host follow MOVED redirects to localhost:700x
  #   • Nodes inside the Docker network reach peers through the host bridge
  #
  # Set REDIS_CLUSTER_NODES=127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003 in
  # apps/chat-service/.env to enable cluster mode in the chat service.
  # Leave REDIS_CLUSTER_NODES unset to keep using the single redis node above.
  # ============================================================================
  redis-node-1:
    image: redis:7
    container_name: aimess-redis-node-1
    restart: unless-stopped
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname host.docker.internal
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
      --appendonly yes
      --bind 0.0.0.0
    ports:
      - "7001:6379"
      - "17001:17001"
    volumes:
      - redis_cluster_1:/data
    networks:
      - aimess-network

  redis-node-2:
    image: redis:7
    container_name: aimess-redis-node-2
    restart: unless-stopped
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname host.docker.internal
      --cluster-announce-port 7002
      --cluster-announce-bus-port 17002
      --appendonly yes
      --bind 0.0.0.0
    ports:
      - "7002:6379"
      - "17002:17002"
    volumes:
      - redis_cluster_2:/data
    networks:
      - aimess-network

  redis-node-3:
    image: redis:7
    container_name: aimess-redis-node-3
    restart: unless-stopped
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname host.docker.internal
      --cluster-announce-port 7003
      --cluster-announce-bus-port 17003
      --appendonly yes
      --bind 0.0.0.0
    ports:
      - "7003:6379"
      - "17003:17003"
    volumes:
      - redis_cluster_3:/data
    networks:
      - aimess-network

  redis-cluster-init:
    image: redis:7
    container_name: aimess-redis-cluster-init
    # Runs once, exits 0 when done. Restarts only if it crashes before finishing.
    restart: on-failure
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    volumes:
      - ./docker/redis/cluster-init.sh:/cluster-init.sh:ro
    command: ["sh", "/cluster-init.sh"]
    networks:
      - aimess-network

  # ============================================================================
  # nginx — reverse proxy with WebSocket sticky sessions
  #
  # Routes:
  #   /z-socket/  →  chat-service  (ip_hash sticky — required for Socket.IO)
  #   /api/       →  api-gateway
  #
  # In local dev the upstream targets are host.docker.internal:3004 / :8000.
  # Add extra `server` lines in docker/nginx/nginx.conf for additional pods.
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: aimess-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aimess-network

  # ============================================================================
  # SRS (OSSRS) — livestream media server (RTMP/WebRTC ingest, HLS/FLV playback)
  #
  # Owned by stream-service. http_hooks call back to stream-service on
  # publish/unpublish/play/stop. CANDIDATE must be a host-reachable IP so
  # browser WebRTC (WHIP) can connect — defaults to host.docker.internal.
  # ============================================================================
  srs:
    image: ossrs/srs:5
    container_name: aimess-srs
    restart: unless-stopped
    command: ["./objs/srs", "-c", "conf/aimess.conf"]
    ports:
      - "1935:1935"
      - "8080:8080"
      - "1985:1985"
      - "8000:8000/udp"
    environment:
      CANDIDATE: "${SRS_CANDIDATE_IP:-host.docker.internal}"
    volumes:
      - "../srs/conf/aimess.conf:/usr/local/srs/conf/aimess.conf:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aimess-network

  # ============================================================================
  # stream-service (Node, HTTP 3007 / gRPC 4007) is NOT containerized here.
  # Like every other Node app (api-gateway, auth, user, community, chat, …) it
  # runs via `pnpm dev` (Turborepo) against this infra. docker-compose stays
  # infra-only (databases, cache, queue, object store, SRS media server).
  # It owns the `stream_db` MongoDB database, receives SRS http_hooks at
  # /internal/srs/hooks, and talks to user-service/community-service over gRPC.
  # ============================================================================

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  pgadmin_data:
  redis_cluster_1:
  redis_cluster_2:
  redis_cluster_3:

# ============================================================================
# Network
# ============================================================================
networks:
  aimess-network:
    driver: bridge
