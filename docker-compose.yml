name: aimess

services:
  # ============================================================================
  # PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: aimess-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # MongoDB
  # ============================================================================
  mongodb:
    image: mongo:7
    container_name: aimess-mongodb
    restart: unless-stopped

    # Single-node replica set (rs0) — REQUIRED by Prisma's MongoDB connector,
    # which wraps writes to @unique-indexed models in transactions (a replica
    # set is mandatory). Local dev runs WITHOUT auth so no internal-auth keyfile
    # is needed (auth + replSet would require a mounted keyfile, painful on
    # Windows). Production uses a managed MongoDB (Atlas) with RS + auth.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${MONGODB_PORT}:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: [
          "CMD-SHELL",
          # Initiate with explicit localhost:27017 so the RS config is stable
          # across container restarts (ephemeral Docker hostnames break rs.status
          # on every restart — localhost is always valid inside the container).
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); }"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - aimess-network

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7
    container_name: aimess-redis
    restart: unless-stopped

    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # RabbitMQ
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aimess-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${RABBITMQ_PORT}:5672"
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # MinIO
  # ============================================================================
  minio:
    image: minio/minio
    container_name: aimess-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}

    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${MINIO_API_PORT}:9000"
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - aimess-network

  # ============================================================================
  # MinIO provisioning — buckets, and one SCOPED account per service (AIM-25).
  #
  # Six services used to hold the MinIO ROOT credentials, which can read and
  # delete every object in every bucket and drop the buckets themselves. Each
  # service now gets an account limited to the buckets it actually names, so a
  # leak from one is bounded by what that service could already do.
  #
  # Runs on every `up` and is idempotent: it re-applies the secrets from the
  # environment, so rotating a value here and restarting is the whole rotation
  # procedure.
  # ============================================================================
  minio-init:
    image: minio/mc
    container_name: aimess-minio-init
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SECRET_MEDIA: ${MINIO_SECRET_MEDIA}
      MINIO_SECRET_USER: ${MINIO_SECRET_USER}
      MINIO_SECRET_CHAT: ${MINIO_SECRET_CHAT}
      MINIO_SECRET_COMMUNITY: ${MINIO_SECRET_COMMUNITY}
      MINIO_SECRET_STREAM: ${MINIO_SECRET_STREAM}
      MINIO_SECRET_BACKOFFICE: ${MINIO_SECRET_BACKOFFICE}
    entrypoint: ["sh", "/init-buckets.sh"]
    volumes:
      - ./deploy/minio/init-buckets.sh:/init-buckets.sh:ro
    networks:
      - aimess-network

  # ============================================================================
  # ClamAV — antivirus daemon for media-service post-upload scanning.
  #
  # The first boot downloads virus definitions (~350 MB); subsequent restarts
  # reuse the definition volume. Set CLAMAV_ENABLED=true in
  # apps/media-service/.env to activate the scanner. Leave it false (default)
  # for local dev if you don't need AV scanning.
  #
  # Port 3310 is the standard clamd TCP port.
  # ============================================================================
  clamav:
    image: clamav/clamav:stable
    container_name: aimess-clamav
    restart: unless-stopped

    ports:
      - "${CLAMAV_PORT:-3310}:3310"

    volumes:
      - clamav_data:/var/lib/clamav

    healthcheck:
      test: ["CMD-SHELL", "clamdcheck || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

    networks:
      - aimess-network

  # ============================================================================
  # pgAdmin
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: aimess-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${PGADMIN_PORT}:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - aimess-network

  # ============================================================================
  # Redis Commander
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander
    container_name: aimess-redis-commander
    restart: unless-stopped

    environment:
      REDIS_HOSTS: local:redis:6379

    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${REDIS_COMMANDER_PORT}:8081"

    depends_on:
      - redis

    networks:
      - aimess-network

  # ============================================================================
  # Redis Cluster — 3 primary nodes for chat-service (Socket.IO adapter + cache)
  #
  # Each node announces itself via host.docker.internal so that:
  #   • App processes on the host follow MOVED redirects to localhost:700x
  #   • Nodes inside the Docker network reach peers through the host bridge
  #
  # Set REDIS_CLUSTER_NODES=127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003 in
  # apps/chat-service/.env to enable cluster mode in the chat service.
  # Leave REDIS_CLUSTER_NODES unset to keep using the single redis node above.
  # ============================================================================
  redis-node-1:
    image: redis:7
    container_name: aimess-redis-node-1
    restart: unless-stopped
    command: >
      redis-server --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname host.docker.internal --cluster-announce-port 7001 --cluster-announce-bus-port 17001 --appendonly yes --bind 0.0.0.0
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:7001:6379"
      - "${INFRA_BIND_ADDR:-127.0.0.1}:17001:17001"
    volumes:
      - redis_cluster_1:/data
    networks:
      - aimess-network

  redis-node-2:
    image: redis:7
    container_name: aimess-redis-node-2
    restart: unless-stopped
    command: >
      redis-server --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname host.docker.internal --cluster-announce-port 7002 --cluster-announce-bus-port 17002 --appendonly yes --bind 0.0.0.0
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:7002:6379"
      - "${INFRA_BIND_ADDR:-127.0.0.1}:17002:17002"
    volumes:
      - redis_cluster_2:/data
    networks:
      - aimess-network

  redis-node-3:
    image: redis:7
    container_name: aimess-redis-node-3
    restart: unless-stopped
    command: >
      redis-server --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname host.docker.internal --cluster-announce-port 7003 --cluster-announce-bus-port 17003 --appendonly yes --bind 0.0.0.0
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:7003:6379"
      - "${INFRA_BIND_ADDR:-127.0.0.1}:17003:17003"
    volumes:
      - redis_cluster_3:/data
    networks:
      - aimess-network

  redis-cluster-init:
    image: redis:7
    container_name: aimess-redis-cluster-init
    # Runs once, exits 0 when done. Restarts only if it crashes before finishing.
    restart: on-failure
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    volumes:
      - ./docker/redis/cluster-init.sh:/cluster-init.sh:ro
    command: ["sh", "/cluster-init.sh"]
    networks:
      - aimess-network

  # ============================================================================
  # nginx — reverse proxy with WebSocket sticky sessions
  #
  # Routes:
  #   /z-socket/  →  chat-service  (ip_hash sticky — required for Socket.IO)
  #   /api/       →  api-gateway
  #
  # In local dev the upstream targets are host.docker.internal:3004 / :8000.
  # Add extra `server` lines in docker/nginx/nginx.conf for additional pods.
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: aimess-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aimess-network

  # ============================================================================
  # config-render — substitutes secrets into the committed config templates.
  #
  # SRS and LiveKit both read a config FILE, and both need a shared secret
  # inside it: SRS carries the hook secret in its http_hooks URLs (it cannot set
  # request headers), and LiveKit needs the webhook api_key. Those files are
  # tracked in git, so the secrets used to be committed literals — the SRS hook
  # secret is the only authenticator on a publicly-routable endpoint, and the
  # LiveKit pair signs every call token.
  #
  # The templates now carry __SRS_HOOK_SECRET__ / __LIVEKIT_API_KEY__ and this
  # one-shot service renders them into a named volume before either server
  # starts. Nothing writes back to the repo, and no secret is ever committed.
  # ============================================================================
  config-render:
    image: alpine:3.20
    container_name: aimess-config-render
    restart: "no"

    environment:
      SRS_HOOK_SECRET: "${SRS_HOOK_SECRET}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"

    volumes:
      - ./docker/srs/aimess.conf:/templates/srs/aimess.conf:ro
      - ./docker/livekit/config.yaml:/templates/livekit/config.yaml:ro
      - rendered-config:/rendered

    # Refuses to render a template whose secret is unset, rather than emitting a
    # config with an empty secret that would accept every unauthenticated hook.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        # `$$` keeps the expansion in the CONTAINER's shell. A single `$` would
        # be substituted by Compose while parsing this file, baking the secret
        # into the container's command line and into `docker compose config`.
        if [ -z "$${SRS_HOOK_SECRET:-}" ]; then
          echo "config-render: SRS_HOOK_SECRET is unset — refusing to render an SRS config with no hook authentication." >&2
          exit 1
        fi
        if [ -z "$${LIVEKIT_API_KEY:-}" ]; then
          echo "config-render: LIVEKIT_API_KEY is unset — refusing to render a LiveKit config with no webhook key." >&2
          exit 1
        fi
        sed "s|__SRS_HOOK_SECRET__|$$SRS_HOOK_SECRET|g" /templates/srs/aimess.conf > /rendered/aimess.conf
        sed "s|__LIVEKIT_API_KEY__|$$LIVEKIT_API_KEY|g" /templates/livekit/config.yaml > /rendered/config.yaml
        echo "config-render: rendered SRS and LiveKit configs"

    networks:
      - aimess-network

  # ============================================================================
  # SRS (OSSRS) — local media server for HLS/FLV/WebRTC (WHIP/WHEP) streaming.
  #
  # Ports (host):
  #   1935  — RTMP ingest  (OBS: rtmp://10.0.127.227/live/<key>)
  #   1985  — HTTP API + WHIP WebRTC ingest
  #   8080  — HTTP playback (FLV + HLS + DASH)
  #   8000/udp — WebRTC UDP (WHIP/WHEP ICE)
  #
  # Config: docker/srs/aimess.conf (HLS + FLV + WebRTC + http_hooks enabled).
  # http_hooks fire to host.docker.internal:3007 — stream-service must be running
  # on the host for PENDING→LIVE auto-transitions to work.
  #
  # CANDIDATE env var tells SRS which IP to advertise in WebRTC ICE candidates.
  # Set it to your LAN IP so browsers on the same network can do WHIP/WHEP.
  # Default falls back to host.docker.internal (works for same-machine dev).
  # ============================================================================
  srs:
    image: ossrs/srs:5
    container_name: aimess-srs
    restart: unless-stopped

    environment:
      # ICE candidate IP advertised to WebRTC clients.
      # Must be reachable from the browser — use your LAN IP (not host.docker.internal,
      # which only resolves on the Windows host, not on other LAN devices).
      CANDIDATE: ${SRS_CANDIDATE:-10.0.127.227}

    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "8000:8000/udp"

    volumes:
      # Rendered by `config-render` — the committed template carries a
      # __SRS_HOOK_SECRET__ placeholder, never the real hook secret. That
      # secret is the ONLY authenticator on the publicly-routable
      # /internal/srs/hooks endpoint, so it must not live in git.
      - rendered-config:/usr/local/srs/rendered:ro

    depends_on:
      config-render:
        condition: service_completed_successfully

    command: ["./objs/srs", "-c", "rendered/aimess.conf"]

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - aimess-network

  # ============================================================================
  # LiveKit — self-hosted media SFU (+ embedded TURN) for 1-to-1 audio/video
  # calls. Replaces the old Socket.IO WebRTC signaling + external STUN/TURN.
  # See Docs/calls/CALLS-LIVEKIT.md.
  #
  # Ports:
  #   7880/tcp  — signaling (WebSocket)
  #   7881/tcp  — RTC/TCP fallback
  #   50000-50100/udp — media (UDP), keep the range small for local dev
  #
  # Keys via LIVEKIT_KEYS env (format: "<apikey>: <secret>"). Redis reuses
  # the shared aimess-redis service so we're multi-node-ready by default.
  # ============================================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: aimess-livekit
    restart: unless-stopped

    command: ["--config", "/etc/livekit/config.yaml"]

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "50000-50100:50000-50100/udp"

    volumes:
      # Rendered by `config-render` — the committed template carries a
      # __LIVEKIT_API_KEY__ placeholder, never a real key.
      - rendered-config:/etc/livekit:ro

    depends_on:
      redis:
        condition: service_started
      config-render:
        condition: service_completed_successfully

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - aimess-network

  # ============================================================================
  # stream-service (Node, HTTP 3007 / gRPC 4007) is NOT containerized here.
  # Like every other Node app (api-gateway, auth, user, community, chat, …) it
  # runs via `pnpm dev` (Turborepo) against this infra. docker-compose stays
  # infra-only (databases, cache, queue, object store).
  # It owns the `stream_db` MongoDB database, receives SRS http_hooks from
  # aimess-srs (local Docker) or ai5stream.tech (hosted), and talks to
  # user-service/community-service over gRPC.
  # ============================================================================

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  pgadmin_data:
  clamav_data:
  redis_cluster_1:
  redis_cluster_2:
  redis_cluster_3:
  # Config files rendered from the committed templates with the real secrets
  # substituted in at start-up (see the `config-render` service). Deliberately
  # a volume rather than a bind mount, so a rendered secret never lands in the
  # working tree where it could be committed.
  rendered-config:

# ============================================================================
# Network
# ============================================================================
networks:
  aimess-network:
    driver: bridge
