name: aimess

services:
  # ============================================================================
  # PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: aimess-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # MongoDB
  # ============================================================================
  mongodb:
    image: mongo:7
    container_name: aimess-mongodb
    restart: unless-stopped

    ports:
      - "${MONGODB_PORT}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - aimess-network

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7
    container_name: aimess-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # RabbitMQ
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aimess-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aimess-network

  # ============================================================================
  # MinIO
  # ============================================================================
  minio:
    image: minio/minio
    container_name: aimess-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio_data:/data

    networks:
      - aimess-network

  # ============================================================================
  # pgAdmin
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: aimess-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - aimess-network

  # ============================================================================
  # Redis Commander
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander
    container_name: aimess-redis-commander
    restart: unless-stopped

    environment:
      REDIS_HOSTS: local:redis:6379

    ports:
      - "${REDIS_COMMANDER_PORT}:8081"

    depends_on:
      - redis

    networks:
      - aimess-network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  pgadmin_data:

# ============================================================================
# Network
# ============================================================================
networks:
  aimess-network:
    driver: bridge
