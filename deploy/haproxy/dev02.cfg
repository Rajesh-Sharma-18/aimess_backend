# =============================================================================
# HAProxy — Dev 02 (76.13.216.171). Replaces nginx as the edge for:
#
#   api.ai5dev.tech        -> api-gateway        127.0.0.1:3000  (+ /socket.io/)
#   admin.ai5dev.tech      -> admin-panel        127.0.0.1:3011
#   backoffice.ai5dev.tech -> backoffice-service 127.0.0.1:3010
#
# Install to /etc/haproxy/haproxy.cfg via deploy/scripts/09-haproxy-cutover.sh.
# Certificates are bundled into /etc/haproxy/certs/ by bundle-certs.sh.
# =============================================================================

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 20000

    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-keep-alive
    timeout connect         5s
    timeout client          60s
    timeout server          60s
    # Socket.IO lives here after the upgrade. Too low and every chat client
    # reconnects on a loop.
    timeout tunnel          1h
    timeout http-request    15s
    timeout http-keep-alive 10s
    timeout queue           30s

frontend fe_http
    bind :80
    bind :::80 v4v6

    acl acme path_beg /.well-known/acme-challenge/
    use_backend be_acme if acme

    http-request redirect scheme https code 301 unless acme

frontend fe_https
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind :::443 v4v6 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1

    # Load-bearing: api-gateway rate-limits per IP and backoffice has an admin
    # IP allow-list. Without the real client IP both see only Cloudflare.
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)] if { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Forwarded-Proto https

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy strict-origin-when-cross-origin

    acl h_api        hdr(host) -i api.ai5dev.tech
    acl h_admin      hdr(host) -i admin.ai5dev.tech
    acl h_backoffice hdr(host) -i backoffice.ai5dev.tech

    use_backend be_admin      if h_admin
    use_backend be_backoffice if h_backoffice
    use_backend be_api        if h_api

    default_backend be_api

backend be_acme
    server acme 127.0.0.1:8888

backend be_api
    # Uploads pass through here to media-service before MinIO.
    timeout server 300s
    option httpchk GET /health
    server api 127.0.0.1:3000 check inter 10s

backend be_admin
    http-response set-header X-Frame-Options SAMEORIGIN
    server admin 127.0.0.1:3011 check inter 10s

backend be_backoffice
    option httpchk GET /health
    server backoffice 127.0.0.1:3010 check inter 10s
