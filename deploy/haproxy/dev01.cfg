# =============================================================================
# HAProxy â€” Dev 01 (76.13.216.164). Replaces nginx as the edge for:
#
#   ai5dev.tech            -> website        127.0.0.1:3000
#   www.ai5dev.tech        -> 301 to apex
#   minio.ai5dev.tech      -> MinIO          127.0.0.1:9000
#   auth.ai5dev.tech       -> MinIO console  127.0.0.1:9001
#   rabbitmq.ai5dev.tech   -> RabbitMQ UI    127.0.0.1:15672
#   notification.ai5dev.tech -> LiveKit      127.0.0.1:7880   (WebSocket)
#
# website.ai5dev.tech is deliberately ABSENT â€” the site moved to the apex and
# the old name was retired, not redirected.
#
# Install to /etc/haproxy/haproxy.cfg via deploy/scripts/09-haproxy-cutover.sh.
# Certificates are bundled into /etc/haproxy/certs/ by bundle-certs.sh â€” HAProxy
# needs fullchain+privkey in ONE file, which is not how certbot stores them.
# =============================================================================

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 20000

    # Mozilla intermediate. Matches what options-ssl-nginx.conf gave us before.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-keep-alive
    timeout connect         5s
    timeout client          60s
    timeout server          60s
    # WebSockets (LiveKit signalling) ride on this once upgraded, NOT on
    # timeout client/server. Too low and calls drop after a minute of silence.
    timeout tunnel          1h
    timeout http-request    15s
    timeout http-keep-alive 10s
    timeout queue           30s

# -----------------------------------------------------------------------------
# :80 â€” ACME only, everything else goes to HTTPS.
# -----------------------------------------------------------------------------
frontend fe_http
    bind :80
    bind :::80 v6only

    # Must be answered in plain HTTP and must not be redirected, or renewal
    # fails. Served by certbot --standalone on 8888 (see the cutover script).
    acl acme path_beg /.well-known/acme-challenge/
    use_backend be_acme if acme

    http-request redirect scheme https code 301 unless acme

# -----------------------------------------------------------------------------
# :443 â€” TLS terminates here. Cloudflare stays in front, so the origin IP is
# still hidden; this only means the origin leg is encrypted too (Full/strict).
# -----------------------------------------------------------------------------
frontend fe_https
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind :::443 v6only ssl crt /etc/haproxy/certs/ alpn h2,http/1.1

    # Cloudflare terminates the user's TLS, so the TCP peer here is Cloudflare.
    # Without this every request looks like it came from one IP, which silently
    # breaks per-IP rate limiting and any IP allow-list downstream.
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)] if { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Forwarded-Proto https
    http-request set-var(txn.path) path

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy strict-origin-when-cross-origin

    acl h_apex    hdr(host) -i ai5dev.tech
    acl h_www     hdr(host) -i www.ai5dev.tech
    acl h_minio   hdr(host) -i minio.ai5dev.tech
    acl h_console hdr(host) -i auth.ai5dev.tech
    acl h_rabbit  hdr(host) -i rabbitmq.ai5dev.tech
    acl h_livekit hdr(host) -i notification.ai5dev.tech

    http-request redirect prefix https://ai5dev.tech code 301 if h_www

    use_backend be_minio   if h_minio
    use_backend be_console if h_console
    use_backend be_rabbit  if h_rabbit
    use_backend be_livekit if h_livekit
    use_backend be_website if h_apex

    # An unknown Host reaching us means a stale DNS record or a direct-IP probe.
    default_backend be_website

# -----------------------------------------------------------------------------
backend be_acme
    server acme 127.0.0.1:8888

backend be_website
    option httpchk GET /
    http-response set-header X-Frame-Options SAMEORIGIN
    # Next.js content-hashes everything under /_next/static, so it is immutable.
    http-response set-header Cache-Control "public, max-age=31536000, immutable" if { var(txn.path) -m beg /_next/static/ }
    # A cached service worker keeps delivering old push behaviour after a deploy.
    http-response set-header Cache-Control "no-cache, no-store, must-revalidate" if { var(txn.path) -m str /firebase-messaging-sw.js }
    http-response set-header Service-Worker-Allowed "/" if { var(txn.path) -m str /firebase-messaging-sw.js }
    server website 127.0.0.1:3000 check inter 10s

backend be_minio
    # Large object uploads: the default 60s server timeout would cut them off.
    timeout server 600s
    option httpchk GET /minio/health/live
    server minio 127.0.0.1:9000 check inter 10s

backend be_console
    timeout server 300s
    server console 127.0.0.1:9001 check inter 30s

backend be_rabbit
    server rabbit 127.0.0.1:15672 check inter 30s

backend be_livekit
    # Signalling is a WebSocket; media is UDP 50000-50100 straight to the host
    # and never passes through here.
    server livekit 127.0.0.1:7880 check inter 10s
