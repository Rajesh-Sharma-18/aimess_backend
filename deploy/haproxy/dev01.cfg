# =============================================================================
# HAProxy â€” Dev 01 (76.13.216.164). Replaces nginx as the edge for:
#
#   ai5dev.tech            -> website        127.0.0.1:3000
#   www.ai5dev.tech        -> 301 to apex
#   minio.ai5dev.tech      -> MinIO          127.0.0.1:9000
#   auth.ai5dev.tech       -> MinIO console  127.0.0.1:9001
#   rabbitmq.ai5dev.tech   -> RabbitMQ UI    127.0.0.1:15672
#
# website.ai5dev.tech is deliberately ABSENT â€” the site moved to the apex and
# the old name was retired, not redirected.
#
# Install to /etc/haproxy/haproxy.cfg via deploy/scripts/09-haproxy-cutover.sh.
# Certificates are bundled into /etc/haproxy/certs/ by bundle-certs.sh â€” HAProxy
# needs fullchain+privkey in ONE file, which is not how certbot stores them.
# =============================================================================

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 20000

    # Mozilla intermediate. Matches what options-ssl-nginx.conf gave us before.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-keep-alive
    timeout connect         5s
    timeout client          60s
    timeout server          60s
    # Any upgraded WebSocket rides on this, NOT on timeout client/server.
    # Nothing here serves one today (calls moved to LiveKit Cloud, which
    # browsers reach directly), but a low value silently kills the next one.
    timeout tunnel          1h
    timeout http-request    15s
    timeout http-keep-alive 10s
    timeout queue           30s

# -----------------------------------------------------------------------------
# :80 â€” ACME only, everything else goes to HTTPS.
# ONE frontend for both ports. Splitting them meant :80 could only redirect,
# which deadlocks the moment Cloudflare is set to Flexible: the visitor arrives
# over HTTPS, Cloudflare connects to the origin over HTTP, we 301 to HTTPS,
# Cloudflare hands that back to the browser, and the browser starts over.
#
# ACME must still be answered in plain HTTP and never redirected, or renewal
# fails. It is served by certbot --standalone on 8888.
frontend fe_web
    bind :80
    bind :::80 v6only
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind :::443 v6only ssl crt /etc/haproxy/certs/ alpn h2,http/1.1

    acl acme        path_beg /.well-known/acme-challenge/
    acl tls_here    ssl_fc
    # Cloudflare reports the scheme the VISITOR used. Trusting it is what makes
    # Flexible and Full (strict) both work.
    acl visitor_tls req.hdr(X-Forwarded-Proto) -i https

    use_backend be_acme if acme
    http-request redirect scheme https code 301 if !acme !tls_here !visitor_tls

    # ---------------------------------------------------------------------
    # Cloudflare trust boundary.
    #
    # CF-Connecting-IP is rewritten into X-Forwarded-For BELOW, and everything
    # downstream treats that as the real client: per-IP rate limiting, the admin
    # allow-list, the address recorded on sessions and audit rows. The rewrite
    # used to happen for ANY caller that set the header — and the origin address
    # is discoverable (it is in this file, and the firewall opens 443 to the
    # whole internet), so a request sent straight to the origin could name any
    # client IP it liked. That defeats every IP-keyed limiter (rotate the header
    # per request for unlimited fresh buckets) and spoofs any allow-listed
    # address.
    #
    # The list is the same one deploy/scripts/refresh-cloudflare-ips.sh already
    # maintains for the nginx path, which got this right; write it out for
    # HAProxy too and reload after each refresh. Deploy note: if the file is
    # missing HAProxy fails to start, which is the correct direction to fail.
    acl from_cf src -f /etc/haproxy/cloudflare-ips.lst

    # Strip the header from anyone who is not Cloudflare, so a forged value
    # cannot survive even if a later rule reads it.
    http-request del-header CF-Connecting-IP if !from_cf
    # A direct-to-origin caller must not be able to inject a forwarding chain
    # either: only Cloudflare's value is authoritative here.
    http-request del-header X-Forwarded-For if !from_cf

    # Cloudflare terminates the user's TLS, so the TCP peer here is Cloudflare.
    # Without this every request looks like it came from one IP, which silently
    # breaks per-IP rate limiting and any IP allow-list downstream.
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)] if from_cf { req.hdr(CF-Connecting-IP) -m found }
    # Set it only when TLS ended here; otherwise Cloudflare's value is the truth.
    http-request set-header X-Forwarded-Proto https if tls_here
    http-request set-var(txn.path) path

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy strict-origin-when-cross-origin

    acl h_apex    hdr(host) -i ai5dev.tech
    acl h_www     hdr(host) -i www.ai5dev.tech
    acl h_minio   hdr(host) -i minio.ai5dev.tech
    acl h_console hdr(host) -i auth.ai5dev.tech
    acl h_rabbit  hdr(host) -i rabbitmq.ai5dev.tech

    http-request redirect prefix https://ai5dev.tech code 301 if h_www

    # ---------------------------------------------------------------------
    # Operator consoles.
    #
    # The MinIO console grants read/write over every user's uploaded chat media,
    # avatars and community images; the RabbitMQ console can read message
    # payloads, purge queues and delete exchanges. Both were routed with no
    # source restriction at all, so each was reachable from any address on the
    # internet with only its service password in front.
    #
    # POPULATE `ops_ip` with the operator/VPN egress addresses before enabling
    # these vhosts. It is deliberately EMPTY here: an empty `src -f` list
    # matches nothing, so the deny below rejects everyone until someone fills
    # it in. Do not commit real CIDRs to this repository.
    #
    # Better still, remove the two vhosts entirely and reach the consoles over
    # an SSH tunnel — a console on the public internet is a standing risk that
    # an allow-list only narrows.
    acl ops_ip src -f /etc/haproxy/ops-ips.lst
    http-request deny if h_console !ops_ip
    http-request deny if h_rabbit  !ops_ip

    use_backend be_minio   if h_minio
    use_backend be_console if h_console
    use_backend be_rabbit  if h_rabbit
    use_backend be_website if h_apex

    # An unknown Host reaching us means a stale DNS record or a direct-IP probe.
    default_backend be_website

# -----------------------------------------------------------------------------
backend be_acme
    server acme 127.0.0.1:8888

backend be_website
    # `option httpchk GET /` sends HTTP/1.0 with no Host header. Send a real
    # HTTP/1.1 request instead so the check looks like actual traffic.
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host ai5dev.tech
    http-check expect status 200
    http-response set-header X-Frame-Options SAMEORIGIN
    # Next.js content-hashes everything under /_next/static, so it is immutable.
    http-response set-header Cache-Control "public, max-age=31536000, immutable" if { var(txn.path) -m beg /_next/static/ }
    # A cached service worker keeps delivering old push behaviour after a deploy.
    http-response set-header Cache-Control "no-cache, no-store, must-revalidate" if { var(txn.path) -m str /firebase-messaging-sw.js }
    http-response set-header Service-Worker-Allowed "/" if { var(txn.path) -m str /firebase-messaging-sw.js }
    server website 127.0.0.1:3000 check inter 10s

backend be_minio
    # Large object uploads: the default 60s server timeout would cut them off.
    timeout server 600s
    # MinIO speaks S3, which requires a Host header. HAProxy's shorthand check
    # sends HTTP/1.0 with none, so MinIO answers 400 and the server is marked
    # DOWN even though it is perfectly healthy — the whole backend then 503s.
    option httpchk
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host minio.ai5dev.tech
    http-check expect status 200
    server minio 127.0.0.1:9000 check inter 10s

backend be_console
    timeout server 300s
    server console 127.0.0.1:9001 check inter 30s

backend be_rabbit
    server rabbit 127.0.0.1:15672 check inter 30s
