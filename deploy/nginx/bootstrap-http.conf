# TEMPORARY bootstrap vhost — used ONLY to obtain the first certificates.
#
# Chicken-and-egg problem: the real site configs reference
# /etc/letsencrypt/live/<domain>/fullchain.pem, so nginx refuses to start until
# those files exist — but certbot needs a running nginx to answer the HTTP-01
# challenge. This config serves the challenge over plain HTTP for every name,
# and nothing else.
#
# Install as /etc/nginx/sites-enabled/00-bootstrap.conf, obtain the certs
# (deploy/scripts/05-issue-certs.sh), then REMOVE it and enable the real sites.
# Leaving it in place would shadow the real vhosts' port-80 blocks.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
