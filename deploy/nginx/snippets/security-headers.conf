# Baseline response headers. Included by every site in deploy/nginx/sites/.
# Install to /etc/nginx/snippets/aimess-security-headers.conf

# 1 year, and only meaningful once every subdomain is confirmed serving HTTPS.
# `includeSubDomains` is deliberately omitted: it would apply to every
# *.ai5dev.tech name from a single response, including any that is not yet on
# TLS, making those unreachable until a cert exists.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff"           always;
add_header X-Frame-Options        "SAMEORIGIN"        always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# Do not advertise the nginx patch version.
server_tokens off;
