# Shared proxy headers. Included by every site in deploy/nginx/sites/.
# Install to /etc/nginx/snippets/aimess-proxy-common.conf

proxy_http_version 1.1;

# $host preserves the name the client actually asked for. This matters beyond
# routing: MinIO validates presigned-URL signatures against the Host header, so
# rewriting it here would invalidate every signed upload and download link.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Services run behind Cloudflare, which sets CF-Connecting-IP. The apps read
# X-Forwarded-For with TRUST_PROXY_HOPS=1 (nginx being the one trusted hop).
proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

# NO proxy_*_timeout here on purpose. This snippet is included INSIDE location
# blocks, and several of them (Socket.IO, LiveKit signaling, MinIO uploads) need
# their own much longer timeouts. nginx rejects a directive that appears twice
# in the same context, so setting them here made every one of those configs
# fail to load with "directive is duplicate".
#
# nginx's own defaults are already 60s for send/read and 60s for connect, which
# is what this snippet used to specify anyway. Locations that need more set it
# themselves.

# PrimeReact/Next.js emit large cookie and header sets; the defaults truncate
# them and produce intermittent "upstream sent too big header" 502s.
proxy_buffer_size   64k;
proxy_buffers       8 32k;
proxy_busy_buffers_size 64k;
