# auth.ai5dev.tech — Dev 01 — MinIO web console (port 9001).
#
# ⚠ NEW SUBDOMAIN — this one is not in the original provisioning list. Create
# the DNS record before enabling this site, or repurpose one of the unused
# names (auth. / community. / notification. / backend.), which are not needed
# publicly because those services sit behind api.ai5dev.tech.
#
# The console has full read/write access to every user's uploaded media, so it
# is IP-restricted below. Skip this site entirely if you do not need browser
# access — `mc` over SSH is a safer administration path.

server {
    # http2 on; needs nginx >= 1.25.1; Ubuntu 24.04 ships 1.24, where HTTP/2
    # is enabled as a listen parameter instead. This form works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.ai5dev.tech;

    ssl_certificate     /etc/letsencrypt/live/auth.ai5dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.ai5dev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/aimess-security-headers.conf;
    include /etc/nginx/snippets/aimess-cloudflare-realip.conf;

    client_max_body_size 0;

    access_log /var/log/nginx/auth.ai5dev.tech.access.log;
    error_log  /var/log/nginx/auth.ai5dev.tech.error.log;

    # ── ACCESS CONTROL — EDIT BEFORE ENABLING THIS SITE ───────────────────────
    # allow 203.0.113.10;
    # deny  all;
    allow all;

    location / {
        proxy_pass http://127.0.0.1:9001;
        include /etc/nginx/snippets/aimess-proxy-common.conf;

        # The console uses WebSockets for live object/metrics updates.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.ai5dev.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
