# website.ai5dev.tech — Dev 01 — consumer website (Next.js standalone, port 3000).

server {
    # http2 on; needs nginx >= 1.25.1; Ubuntu 24.04 ships 1.24, where HTTP/2
    # is enabled as a listen parameter instead. This form works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name website.ai5dev.tech;

    ssl_certificate     /etc/letsencrypt/live/website.ai5dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/website.ai5dev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/aimess-security-headers.conf;
    include /etc/nginx/snippets/aimess-cloudflare-realip.conf;

    client_max_body_size 10m;

    access_log /var/log/nginx/website.ai5dev.tech.access.log;
    error_log  /var/log/nginx/website.ai5dev.tech.error.log;

    # The Firebase messaging service worker must be served from the site root
    # with no caching — browsers scope a service worker to its own path, and a
    # stale cached copy keeps delivering old push behaviour long after a deploy.
    location = /firebase-messaging-sw.js {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/aimess-proxy-common.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Next.js content-hashes everything under /_next/static, so it is safe to
    # cache immutably.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/aimess-proxy-common.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/aimess-proxy-common.conf;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name website.ai5dev.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
