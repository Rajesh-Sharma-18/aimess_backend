# rabbitmq.ai5dev.tech — Dev 01 — RabbitMQ management UI (port 15672).
#
# This is an OPERATOR TOOL, not application traffic. The AMQP protocol port
# (5672) is NOT proxied here — services reach it directly over the private
# firewall rules. Only the browser management console is exposed.
#
# The console can purge queues, delete exchanges and read message payloads, so
# it is IP-restricted below rather than left open behind a password alone.

server {
    # http2 on; needs nginx >= 1.25.1; Ubuntu 24.04 ships 1.24, where HTTP/2
    # is enabled as a listen parameter instead. This form works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rabbitmq.ai5dev.tech;

    ssl_certificate     /etc/letsencrypt/live/rabbitmq.ai5dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rabbitmq.ai5dev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/aimess-security-headers.conf;
    include /etc/nginx/snippets/aimess-cloudflare-realip.conf;

    access_log /var/log/nginx/rabbitmq.ai5dev.tech.access.log;
    error_log  /var/log/nginx/rabbitmq.ai5dev.tech.error.log;

    # ── ACCESS CONTROL — EDIT BEFORE ENABLING THIS SITE ───────────────────────
    # Replace with your office/VPN egress addresses, then remove the
    # `allow all;` line. Leaving `allow all;` in place exposes the broker
    # console to the internet with only the RabbitMQ password in front of it.
    #
    # allow 203.0.113.10;
    # deny  all;
    allow all;

    location / {
        proxy_pass http://127.0.0.1:15672;
        include /etc/nginx/snippets/aimess-proxy-common.conf;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rabbitmq.ai5dev.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
