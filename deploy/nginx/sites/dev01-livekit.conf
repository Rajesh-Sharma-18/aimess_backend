# notification.ai5dev.tech — Dev 01 — LiveKit signaling (WebSocket, port 7880).
#
# NAMING: this subdomain was originally provisioned for notification-service,
# which does NOT need a public name — it sits behind api.ai5dev.tech like every
# other internal service. It is reused here for LiveKit so no new domain is
# required. The name says "notification"; the service is LiveKit.
#
# ⚠ CLOUDFLARE: this record MUST be GREY-CLOUD (DNS-only) and point at
# 76.13.216.164.
#   LiveKit carries media over UDP 50000-50100 and TCP 7881 directly between the
#   browser and this host. Cloudflare's proxy handles neither, so an orange-cloud
#   record lets signaling succeed while every call connects with no audio or
#   video — the hardest possible failure to diagnose, because the app reports a
#   healthy room join.
#
# Only the signaling WebSocket (7880) is proxied here. The media ports are
# reached directly and are opened in deploy/scripts/01-firewall-dev01.sh.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notification.ai5dev.tech;

    ssl_certificate     /etc/letsencrypt/live/notification.ai5dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notification.ai5dev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/aimess-security-headers.conf;

    access_log /var/log/nginx/notification.ai5dev.tech.access.log;
    error_log  /var/log/nginx/notification.ai5dev.tech.error.log;

    location / {
        proxy_pass http://127.0.0.1:7880;
        include /etc/nginx/snippets/aimess-proxy-common.conf;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Signaling sockets stay open for the life of the call.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering    off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name notification.ai5dev.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
