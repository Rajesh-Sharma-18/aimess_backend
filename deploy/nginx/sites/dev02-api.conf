# api.ai5dev.tech — Dev 02 — the ONLY public entry point for consumer traffic.
#
#   REST/HTTP      /            →  api-gateway   127.0.0.1:3000
#   Socket.IO/WS   /z-socket/   →  chat-service  127.0.0.1:3004
#
# Routing the WebSocket through this same hostname is deliberate: it avoids
# spending a scarce subdomain on it, and keeps the browser's Origin identical
# for REST and WS so no extra CORS entry is needed.

upstream aimess_api_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream aimess_chat_ws {
    # ip_hash pins each client to the same backend so Socket.IO connection-state
    # recovery survives brief drops. It is a no-op with one server today, but it
    # must already be here before a second chat-service pod is added — adding
    # the pod without it silently breaks reconnects.
    ip_hash;
    server 127.0.0.1:3004;
}

server {
    # http2 on; needs nginx >= 1.25.1; Ubuntu 24.04 ships 1.24, where HTTP/2
    # is enabled as a listen parameter instead. This form works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ai5dev.tech;

    ssl_certificate     /etc/letsencrypt/live/api.ai5dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ai5dev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/aimess-security-headers.conf;
    include /etc/nginx/snippets/aimess-cloudflare-realip.conf;

    # Uploads go directly to MinIO via presigned URLs, so the API itself only
    # ever receives JSON. A small cap here limits request-body abuse.
    client_max_body_size 2m;

    access_log /var/log/nginx/api.ai5dev.tech.access.log;
    error_log  /var/log/nginx/api.ai5dev.tech.error.log;

    # ── Socket.IO ────────────────────────────────────────────────────────────
    # Must come before `location /` — nginx prefix matching takes the longest
    # match, but keeping it first makes the precedence obvious to readers.
    location /z-socket/ {
        proxy_pass http://aimess_chat_ws;
        include /etc/nginx/snippets/aimess-proxy-common.conf;

        # WebSocket upgrade. `Connection: upgrade` must be set explicitly —
        # proxy-common.conf does not set it, because sending it on plain HTTP
        # upstreams breaks keepalive.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-lived sockets. The 60s default in proxy-common.conf would tear
        # down every idle connection once a minute and produce a reconnect storm.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Streaming frames must not sit in a buffer waiting to fill.
        proxy_buffering off;
    }

    # ── REST API ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://aimess_api_gateway;
        include /etc/nginx/snippets/aimess-proxy-common.conf;
        # Empty Connection header enables upstream keepalive (see the `keepalive`
        # directive on the upstream block above).
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ai5dev.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
