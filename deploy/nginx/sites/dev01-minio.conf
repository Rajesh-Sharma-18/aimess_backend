# minio.ai5dev.tech — Dev 01 — MinIO S3 API (port 9000).
#
# Every user upload and download transits this vhost via presigned URLs.
#
# ⚠ CLOUDFLARE: this record should be GREY-CLOUD (DNS-only).
#   • The free plan caps request bodies at 100 MB. CHAT_VIDEO_MAX_BYTES is
#     exactly 104857600 (100 MB), so proxied video uploads fail with a 413 that
#     never reaches MinIO and is therefore invisible in application logs.
#   • Proxying large media through Cloudflare also adds latency for no benefit
#     — the objects are already served over TLS from here.
#   If the record MUST stay proxied, lower CHAT_VIDEO_MAX_BYTES and the other
#   *_MAX_BYTES values in .env.dev02 below Cloudflare's cap.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minio.ai5dev.tech;

    ssl_certificate     /etc/letsencrypt/live/minio.ai5dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.ai5dev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/aimess-security-headers.conf;

    # 0 = unlimited. The real size limits are enforced by the services when they
    # mint the presigned URL; capping again here would reject valid uploads that
    # the application already authorised.
    client_max_body_size 0;

    access_log /var/log/nginx/minio.ai5dev.tech.access.log;
    error_log  /var/log/nginx/minio.ai5dev.tech.error.log;

    location / {
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/snippets/aimess-proxy-common.conf;
        proxy_set_header Connection "";

        # Stream bodies straight through. With buffering on, nginx spools the
        # entire upload to disk before contacting MinIO — that doubles disk I/O
        # and stalls large uploads.
        proxy_request_buffering off;
        proxy_buffering         off;

        # Large objects can take a while on a slow mobile uplink.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # MinIO returns its own CORS headers based on bucket policy. Adding any
        # here would produce duplicate Access-Control-* headers, which browsers
        # reject outright.
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name minio.ai5dev.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
