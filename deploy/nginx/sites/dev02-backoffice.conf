# backoffice.ai5dev.tech — Dev 02 — Admin API (backoffice-service, port 3010).
#
# This is the admin control plane: account CRUD, RBAC, bans, moderation. Treat
# it as more sensitive than the consumer API.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backoffice.ai5dev.tech;

    ssl_certificate     /etc/letsencrypt/live/backoffice.ai5dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backoffice.ai5dev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/aimess-security-headers.conf;
    include /etc/nginx/snippets/aimess-cloudflare-realip.conf;

    client_max_body_size 10m;

    access_log /var/log/nginx/backoffice.ai5dev.tech.access.log;
    error_log  /var/log/nginx/backoffice.ai5dev.tech.error.log;

    # ── OPTIONAL network-level allowlist ─────────────────────────────────────
    # backoffice-service already enforces ADMIN_IP_WHITELIST in the app, but
    # blocking at the edge keeps unauthenticated traffic off the admin API
    # entirely. Uncomment and list your office/VPN egress addresses.
    #
    # ⚠ These requests arrive via Cloudflare, so $remote_addr is a Cloudflare
    # IP, not the real client. This only works because
    # aimess-cloudflare-realip.conf rewrites $remote_addr to CF-Connecting-IP
    # first. Do not enable this without that snippet loaded, or you will lock
    # out everyone including yourself.
    #
    # allow 203.0.113.10;
    # deny  all;

    location / {
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/snippets/aimess-proxy-common.conf;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name backoffice.ai5dev.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
