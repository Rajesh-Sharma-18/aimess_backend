# GitLab CI/CD — quality, migrate smoke, Docker build, publish to Container Registry, optional VPS deploy.
#
# Stages: test → migrate → docker (image smoke) → publish (registry) → deploy (manual VPS).
# Container registry: GitLab Container Registry ($CI_REGISTRY_IMAGE/...).
# Docs: docs/DEVELOPMENT.md, docker/README.md

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|master)$/
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: never

default:
  interruptible: true

variables:
  HUSKY: "0"
  CI: "true"
  # Prisma generate / typecheck (no live DB required).
  AUTH_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aimess_auth
  USER_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aimess_users
  PNPM_STORE_DIR: "${CI_PROJECT_DIR}/.pnpm-store"

stages:
  - test
  - migrate
  - docker
  - publish
  - deploy

# ---------------------------------------------------------------------------
# Quality gate (same commands as former GitHub CI quality job)
# ---------------------------------------------------------------------------
quality:
  stage: test
  image: node:22-bookworm
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - .turbo
  before_script:
    - corepack enable && corepack prepare pnpm@11.0.8 --activate
    - pnpm config set store-dir "${PNPM_STORE_DIR}"
  script:
    - pnpm install --frozen-lockfile
    - pnpm prisma:generate
    - pnpm lint
    - pnpm format:check
    - pnpm typecheck
    - pnpm build
    - pnpm test

# ---------------------------------------------------------------------------
# Prisma migrate deploy smoke (PostgreSQL service)
# ---------------------------------------------------------------------------
prisma-migrate:
  stage: migrate
  image: node:22-bookworm
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    AUTH_DATABASE_URL: postgresql://ci:ci@postgres:5432/aimess_auth
    USER_DATABASE_URL: postgresql://ci:ci@postgres:5432/aimess_users
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - |
      for i in $(seq 1 45); do
        pg_isready -h postgres -U ci -d postgres && break
        sleep 2
      done
    - corepack enable && corepack prepare pnpm@11.0.8 --activate
    - pnpm config set store-dir "${PNPM_STORE_DIR}"
  script:
    - pnpm install --frozen-lockfile
    - export PGPASSWORD=ci
    - psql -h postgres -U ci -d postgres -c "CREATE DATABASE aimess_auth" || true
    - psql -h postgres -U ci -d postgres -c "CREATE DATABASE aimess_users" || true
    - pnpm db:migrate:deploy

# ---------------------------------------------------------------------------
# Docker build validation (no push)
# ---------------------------------------------------------------------------
docker-build:
  stage: docker
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f apps/api-gateway/Dockerfile -t aimess-api-gateway:ci .
    - docker build -f apps/auth-service/Dockerfile -t aimess-auth-service:ci .
    - docker build -f apps/user-service/Dockerfile -t aimess-user-service:ci .

# ---------------------------------------------------------------------------
# Publish HTTP service images to GitLab Container Registry
# ---------------------------------------------------------------------------
.publish:
  stage: publish
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  interruptible: false
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - |
      set -euo pipefail
      REG="$CI_REGISTRY_IMAGE"
      NAME="$APP_IMAGE"
      FILE="$DOCKERFILE"
      docker build \
        --build-arg PRISMA_BUILD_DATABASE_URL=postgresql://prisma_build:prisma_build@127.0.0.1:5432/_prisma_placeholder \
        -f "$FILE" \
        -t "$REG/$NAME:$CI_COMMIT_SHORT_SHA" \
        .
    - docker push "$REG/$NAME:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$REG/$NAME:$CI_COMMIT_SHORT_SHA" "$REG/$NAME:$CI_COMMIT_TAG"
        docker push "$REG/$NAME:$CI_COMMIT_TAG"
      fi
    - |
      if [ -z "${CI_COMMIT_TAG:-}" ] && { [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ]; }; then
        docker tag "$REG/$NAME:$CI_COMMIT_SHORT_SHA" "$REG/$NAME:latest"
        docker push "$REG/$NAME:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|master)$/
    - if: $CI_COMMIT_TAG =~ /^v/

publish:api-gateway:
  extends: .publish
  needs:
    - quality
    - prisma-migrate
    - docker-build
  variables:
    APP_IMAGE: aimess-api-gateway
    DOCKERFILE: apps/api-gateway/Dockerfile

publish:auth:
  extends: .publish
  needs:
    - quality
    - prisma-migrate
    - docker-build
  variables:
    APP_IMAGE: aimess-auth-service
    DOCKERFILE: apps/auth-service/Dockerfile

publish:user:
  extends: .publish
  needs:
    - quality
    - prisma-migrate
    - docker-build
  variables:
    APP_IMAGE: aimess-user-service
    DOCKERFILE: apps/user-service/Dockerfile

# ---------------------------------------------------------------------------
# Optional manual deploy to a VPS (set CI/CD variables in GitLab project settings)
# ---------------------------------------------------------------------------
deploy:vps:
  stage: deploy
  image: alpine:3.20
  interruptible: false
  needs:
    - publish:api-gateway
    - publish:auth
    - publish:user
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|master)$/
      when: manual
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p "${VPS_SSH_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -euo pipefail
      HEALTH_URL="${VPS_HEALTH_URL:-http://127.0.0.1:3000/health}"
      REMOTE_PATH="${VPS_DEPLOY_PATH}"
      ssh -o StrictHostKeyChecking=yes -p "${VPS_SSH_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
        "set -euo pipefail; cd \"${REMOTE_PATH}\"; docker compose pull; docker compose up -d; docker compose ps; if command -v curl >/dev/null 2>&1; then curl -fsS --max-time 20 \"${HEALTH_URL}\"; else echo \"curl missing on VPS; skipped HTTP check\"; fi"
  variables:
    VPS_SSH_PORT: "22"
