# Mute pnpm's post-install summary for deprecated transitive deps (Firebase/Google SDK, fetch-blob).
allowedDeprecatedVersions:
  node-domexception: "*"
  uuid: "*"

allowBuilds:
  "@firebase/util": false
  "@prisma/client": false
  "@prisma/engines": false
  "@scarf/scarf": false
  bcrypt: false
  esbuild: true
  msgpackr-extract: false
  prisma: false
  protobufjs: false
  unrs-resolver: true
packages:
  - apps/*
  - packages/*
  - tooling/service-template
