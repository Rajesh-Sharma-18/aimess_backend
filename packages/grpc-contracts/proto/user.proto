syntax = "proto3";

package user;

service UserService {
  rpc CheckFriendship (CheckFriendshipRequest) returns (CheckFriendshipResponse);
  rpc GetNotificationSettings (GetNotificationSettingsRequest) returns (NotificationSettings);
  rpc AdminGetProfilesByIds (AdminGetProfilesRequest) returns (AdminProfilesResponse);
  rpc AdminGetProfile (AdminGetProfileRequest) returns (AdminProfileRecord);
  // Admin Panel: search profiles by first/last/full name or username; returns
  // matching userIds only (capped) for the caller to combine into an id-set filter.
  rpc AdminSearchProfileIds (AdminSearchProfileIdsRequest) returns (AdminSearchProfileIdsResponse);
  rpc BulkGetUserSnapshots (BulkGetUserSnapshotsRequest) returns (BulkGetUserSnapshotsResponse);
  rpc CheckFriendships (CheckFriendshipsRequest) returns (CheckFriendshipsResponse);
}

message CheckFriendshipRequest {
  string user_a = 1;
  string user_b = 2;
}

message CheckFriendshipResponse {
  bool are_friends = 1;
}

message GetNotificationSettingsRequest {
  string user_id = 1;
}

// Per-category notification preferences (user-service Postgres NotificationSettings).
message NotificationSettings {
  bool   chat_enabled           = 1;
  bool   call_enabled           = 2;
  bool   friend_request_enabled = 3;
  bool   system_enabled         = 4;
  bool   community_enabled      = 5;
  bool   live_stream_enabled    = 6;
  bool   quiet_hours_enabled    = 7;
  // "HH:mm" 24h local time, or empty string when unset.
  string quiet_hours_start      = 8;
  string quiet_hours_end        = 9;
  // ISO weekday numbers the quiet-hours window applies to (1=Mon … 7=Sun).
  repeated int32 quiet_hours_days = 10;
  bool   show_preview           = 11;
}

// Admin Panel: enrich a user list with display profile data.
message AdminGetProfilesRequest {
  repeated string user_ids = 1;
}

message AdminProfileRecord {
  string user_id    = 1;
  string username   = 2;
  string avatar_url = 3;  // "" when null
  string first_name = 4;
  string last_name  = 5;
  string created_at = 6;  // ISO
}

message AdminProfilesResponse {
  repeated AdminProfileRecord profiles = 1;
}

message AdminGetProfileRequest {
  string user_id = 1;
}

message AdminSearchProfileIdsRequest {
  string search = 1;
}

message AdminSearchProfileIdsResponse {
  repeated string user_ids = 1;
}

// Internal: community-service + chat-service fetch profiles in bulk (replaces HTTP GET /api/v1/users/internal/bulk-snapshot)
message BulkGetUserSnapshotsRequest {
  repeated string user_ids = 1;
}

message UserSnapshotRecord {
  string user_id         = 1;
  string username        = 2;
  string display_name    = 3;
  string avatar_object_key = 4; // "" when null
}

message BulkGetUserSnapshotsResponse {
  repeated UserSnapshotRecord users = 1;
}

// Internal: community-service validates friendships in bulk (replaces HTTP GET /api/v1/users/internal/friendship-check)
message CheckFriendshipsRequest {
  string caller_id              = 1;
  repeated string candidate_ids = 2;
}

message CheckFriendshipsResponse {
  repeated string friend_ids = 1;
}
