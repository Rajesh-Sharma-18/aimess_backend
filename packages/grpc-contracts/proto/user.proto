syntax = "proto3";

package user;

service UserService {
  rpc CheckFriendship (CheckFriendshipRequest) returns (CheckFriendshipResponse);
  rpc GetNotificationSettings (GetNotificationSettingsRequest) returns (NotificationSettings);
  rpc AdminGetProfilesByIds (AdminGetProfilesRequest) returns (AdminProfilesResponse);
  rpc AdminGetProfile (AdminGetProfileRequest) returns (AdminProfileRecord);
  // Admin Panel: search profiles by first/last/full name or username; returns
  // matching userIds only (capped) for the caller to combine into an id-set filter.
  rpc AdminSearchProfileIds (AdminSearchProfileIdsRequest) returns (AdminSearchProfileIdsResponse);
  rpc BulkGetUserSnapshots (BulkGetUserSnapshotsRequest) returns (BulkGetUserSnapshotsResponse);
  rpc CheckFriendships (CheckFriendshipsRequest) returns (CheckFriendshipsResponse);
  // Internal: chat-service resolves the *current* friendship state for a
  // Notification Center row (Notification is an immutable event log — the
  // friendship it references can move on to ACCEPTED/REJECTED/CANCELLED/
  // BLOCKED/UNFRIENDED after the row was written). Viewer-relative.
  rpc GetFriendshipView (GetFriendshipViewRequest) returns (FriendshipViewRecord);
  // Internal: chat-service reads the callee's call-privacy setting to gate 1-to-1
  // calls (whoCanCallMe + allow-list). Callee-scoped, not per-caller.
  rpc GetCallPrivacy (GetCallPrivacyRequest) returns (GetCallPrivacyResponse);
  // Internal: the api-gateway filters `presence:subscribe` peer lists through
  // this before joining the viewer's socket into any `user:<peerId>` room.
  // Without it, ANY authenticated socket can subscribe to ANY user's presence
  // regardless of their whoCanSeeOnlineStatus setting.
  rpc FilterVisiblePresence (FilterVisiblePresenceRequest) returns (FilterVisiblePresenceResponse);
  // Internal: the INVERSE of FilterVisiblePresence — one subject, many viewers.
  // chat-service uses it on the fan-out side (presence bumps, conv:updated
  // isOffline) where the subject is fixed and the audience is the room's peers,
  // so the whole audience is evaluated in ONE call instead of one per viewer.
  rpc FilterPresenceViewers (FilterPresenceViewersRequest) returns (FilterPresenceViewersResponse);
  // Admin Panel (SUPER_ADMIN, `settings.manage`) ONLY: platform-wide maintenance
  // sweep that force-unfriends EVERY accepted friendship on the platform, not
  // just one caller's. `confirm` must be true or this returns INVALID_ARGUMENT —
  // it is a blast-radius trip-wire, not the access control (that lives in
  // backoffice-service's RBAC + audit log around this call). Never expose this
  // RPC, or a wrapper around it, without an equivalent admin gate.
  rpc AdminDisconnectAllFriendships (AdminDisconnectAllFriendshipsRequest) returns (AdminDisconnectAllFriendshipsResponse);
}

message CheckFriendshipRequest {
  string user_a = 1;
  string user_b = 2;
}

message CheckFriendshipResponse {
  bool are_friends = 1;
}

message GetNotificationSettingsRequest {
  string user_id = 1;
}

// Per-category notification preferences (user-service Postgres NotificationSettings).
message NotificationSettings {
  bool   chat_enabled           = 1;
  bool   call_enabled           = 2;
  bool   friend_request_enabled = 3;
  bool   system_enabled         = 4;
  bool   community_enabled      = 5;
  bool   live_stream_enabled    = 6;
  bool   quiet_hours_enabled    = 7;
  // "HH:mm" 24h local time, or empty string when unset.
  string quiet_hours_start      = 8;
  string quiet_hours_end        = 9;
  // ISO weekday numbers the quiet-hours window applies to (1=Mon … 7=Sun).
  repeated int32 quiet_hours_days = 10;
  bool   show_preview           = 11;
}

// Admin Panel: enrich a user list with display profile data.
message AdminGetProfilesRequest {
  repeated string user_ids = 1;
}

message AdminProfileRecord {
  string user_id    = 1;
  string username   = 2;
  string avatar_url = 3;  // "" when null
  string first_name = 4;
  string last_name  = 5;
  string created_at = 6;  // ISO
}

message AdminProfilesResponse {
  repeated AdminProfileRecord profiles = 1;
}

message AdminGetProfileRequest {
  string user_id = 1;
}

message AdminSearchProfileIdsRequest {
  string search = 1;
}

message AdminSearchProfileIdsResponse {
  repeated string user_ids = 1;
}

// Internal: community-service + chat-service fetch profiles in bulk (replaces HTTP GET /api/v1/users/internal/bulk-snapshot)
message BulkGetUserSnapshotsRequest {
  repeated string user_ids = 1;
}

message UserSnapshotRecord {
  string user_id         = 1;
  string username        = 2;
  string display_name    = 3;
  string avatar_object_key = 4; // "" when null
  // Presigned GET URL, resolved server-side (same resolver as /users/search
  // and profile responses). "" when the user has no avatar or MinIO is
  // unreachable — never persist this, it expires.
  string avatar_url      = 5;
}

message BulkGetUserSnapshotsResponse {
  repeated UserSnapshotRecord users = 1;
}

// Internal: community-service validates friendships in bulk (replaces HTTP GET /api/v1/users/internal/friendship-check)
message CheckFriendshipsRequest {
  string caller_id              = 1;
  repeated string candidate_ids = 2;
}

message CheckFriendshipsResponse {
  repeated string friend_ids = 1;
  // Full relationship (status/direction) for every requested candidate_id,
  // from caller_id's perspective — status is FRIEND|PENDING|NONE|BLOCKED.
  // Additive alongside friend_ids (kept for existing ACCEPTED-only callers).
  repeated FriendshipInfo relationships = 2;
}

message FriendshipInfo {
  string user_id = 1;
  string status = 2;    // FRIEND | PENDING | NONE | BLOCKED
  string direction = 3; // OUTGOING | INCOMING | "" (none)
  // Additive fields for the user-search-shaped relationship contract reused
  // by chat-service (private room details + inbox). "" when not applicable.
  string friendship_id = 4; // Friendship row id when FRIEND/PENDING/BLOCKED; "" otherwise.
  string requester_id  = 5; // Who sent the PENDING request; "" for FRIEND/NONE/BLOCKED.
  bool   can_accept    = 6;
  bool   can_reject    = 7;
  bool   can_cancel    = 8;
}

message GetFriendshipViewRequest {
  string friendship_id = 1;
  string viewer_id     = 2;
}

// Full viewer-relative friendship view — see user-service's buildFriendshipView().
message FriendshipViewRecord {
  bool   found      = 1;
  string status     = 2; // NONE|PENDING|ACCEPTED|REJECTED|CANCELLED|UNFRIENDED|BLOCKED
  string direction  = 3; // OUTGOING|INCOMING|"" (none)
  bool   can_accept = 4;
  bool   can_reject = 5;
  bool   can_cancel = 6;
}

message GetCallPrivacyRequest {
  string user_id = 1;
}

// who_can_call_me is "FRIENDS" | "SELECTED_FRIENDS" | "NO_ONE".
// allowed_user_ids is only meaningful when who_can_call_me == "SELECTED_FRIENDS".
message GetCallPrivacyResponse {
  string          who_can_call_me  = 1;
  repeated string allowed_user_ids = 2;
}

message FilterVisiblePresenceRequest {
  string          viewer_id = 1;
  repeated string peer_ids  = 2;
}

// The subset of peer_ids whose whoCanSeeOnlineStatus admits this viewer.
// Peers omitted here must never have their presence relayed to the viewer.
message FilterVisiblePresenceResponse {
  repeated string visible_peer_ids = 1;
}

message FilterPresenceViewersRequest {
  // Whose presence is about to be disclosed.
  string          subject_id = 1;
  repeated string viewer_ids = 2;
}

// The subset of viewer_ids that subject_id's whoCanSeeOnlineStatus admits.
// Viewers omitted here must never receive the subject's presence — including
// derived fields such as conv:updated's `isOffline`.
message FilterPresenceViewersResponse {
  repeated string allowed_viewer_ids = 1;
}

message AdminDisconnectAllFriendshipsRequest {
  bool confirm = 1;
}

message AdminDisconnectAllFriendshipsResponse {
  int32 friendships_disconnected = 1;
  int32 users_affected           = 2;
}
