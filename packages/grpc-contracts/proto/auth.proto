syntax = "proto3";
package auth;

service AuthService {
  rpc GetUserCounts (GetUserCountsRequest) returns (UserCounts);
  rpc GetActiveUserCounts (GetActiveUserCountsRequest) returns (ActiveUserCounts);
  rpc GetActiveUserSeries (ActiveUserSeriesRequest) returns (ActiveUserSeries);
  rpc AdminListUsers (AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminGetUser (AdminGetUserRequest) returns (AdminUserRecord);
  // Admin Panel announcements: the users who currently hold a live session on
  // one of the given device types. Sessions — not device tokens, not a stored
  // profile preference — are what "this user is on iOS right now" means.
  rpc AdminListUserIdsByDeviceType (AdminListUserIdsByDeviceTypeRequest) returns (AdminListUserIdsByDeviceTypeResponse);
  rpc GetAccountSummary (GetAccountSummaryRequest) returns (AccountSummary);
  rpc BulkGetAccounts (BulkGetAccountsRequest) returns (BulkGetAccountsResponse);
  // The ONLY mutation on this service. backoffice-service calls it
  // synchronously so a Super Admin ban is durable before the HTTP response
  // returns: auth-service is the sole owner of AuthUser.status, and every
  // login / social-login / refresh / password-reset path already rejects a
  // non-ACTIVE account. Also sets the Redis user-ban flag and revokes every
  // session in the same call. The admin.user.queue RabbitMQ event stays as an
  // idempotent safety net, not the primary path.
  rpc AdminSetAccountStatus (AdminSetAccountStatusRequest) returns (AdminSetAccountStatusResponse);
  // Super Admin reactivation of a soft-deleted account. Separate from
  // AdminSetAccountStatus on purpose: that RPC routes to accountBanService,
  // whose `lift` deliberately REFUSES a deleted account so an unban can never
  // resurrect an account the user asked to remove. Un-deleting is its own
  // decision, so it gets its own RPC, its own audit event and its own
  // `user.restored` fanout.
  rpc AdminRestoreAccount (AdminRestoreAccountRequest) returns (AdminRestoreAccountResponse);
}

message GetUserCountsRequest {}
message UserCounts {
  int64 total_users      = 1;
  int64 new_users_today  = 2;
  int64 banned_users     = 3;
}

message GetActiveUserCountsRequest {
  int32 dau_window_hours = 1;
  int32 mau_window_days  = 2;
}
message ActiveUserCounts {
  int64 daily_active   = 1;
  int64 monthly_active = 2;
}

// Per-day active/churned series for the admin dashboard chart.
// Dates are inclusive YYYY-MM-DD (UTC, DAY granularity).
message ActiveUserSeriesRequest {
  string start_date = 1; // inclusive YYYY-MM-DD (UTC)
  string end_date   = 2; // inclusive YYYY-MM-DD (UTC)
}
message ActiveUserSeries {
  repeated ActiveUserSeriesBucket buckets = 1;
}
message ActiveUserSeriesBucket {
  string date           = 1; // YYYY-MM-DD (UTC)
  int64  daily_active    = 2;
  int64  monthly_active  = 3;
  int64  churned         = 4;
}

// Admin Panel: list/fetch real users from auth-service.
message AdminListUsersRequest {
  string search = 1;            // case-insensitive contains over email + account
  repeated string status = 2;   // admin statuses: ACTIVE|SUSPENDED|BANNED|DELETED
  string created_after = 3;     // ISO datetime, inclusive (filter createdAt >=)
  string created_before = 4;    // ISO datetime, inclusive (filter createdAt <=)
  string sort_field = 5;        // createdAt|email|account|status  (default createdAt)
  string sort_dir = 6;          // asc|desc (default desc)
  int32  limit = 7;             // page size (default 20, clamp 1..100)
  int32  offset = 8;            // offset pagination
  repeated string user_ids = 9; // OPTIONAL: when non-empty, constrain to these ids (used by backoffice reports-bucket prefilter)
  repeated string exclude_user_ids = 10; // OPTIONAL: when non-empty, exclude these ids (used by backoffice status=ACTIVE filter to drop UserIndex-mirror-banned users; auth's own status column never reflects BANNED/SUSPENDED)
}
message AdminUserRecord {
  string id = 1;
  string account = 2;
  string email = 3;             // "" when null
  string status = 4;            // normalized admin status (see mapping)
  string created_at = 5;        // ISO
  string suspended_at = 6;      // ISO or ""
  string suspended_reason = 7;  // or ""
  string deleted_at = 8;        // ISO or ""
  string last_login_at = 9;     // ISO or ""
}
message AdminListUsersResponse {
  repeated AdminUserRecord users = 1;
  int64 total = 2;              // total matching the filter (for pagination)
}
message AdminGetUserRequest { string user_id = 1; }

message AdminListUserIdsByDeviceTypeRequest {
  repeated string device_types = 1; // ANDROID|IOS|WEB|DESKTOP — empty means every type
  int32  limit  = 2;                // page size (clamped 1..500)
  int32  offset = 3;                // offset pagination over DISTINCT user ids
}
message AdminListUserIdsByDeviceTypeResponse {
  repeated string user_ids = 1;     // distinct, ordered by id so paging is stable
  int64  total = 2;                 // distinct users matching, for pagination
}

// Permanent ban / reinstatement. There is deliberately no duration field:
// a ban lasts until a Super Admin explicitly sets the status back to ACTIVE.
message AdminSetAccountStatusRequest {
  string user_id        = 1;
  string status         = 2; // "BANNED" | "ACTIVE"
  string reason         = 3; // free text, persisted on the account; "" allowed
  string actor_admin_id = 4; // backoffice AdminUser.id (NOT an AuthUser.id)
}
message AdminRestoreAccountRequest {
  string user_id        = 1;
  string actor_admin_id = 2; // backoffice AdminUser.id (NOT an AuthUser.id)
}
message AdminRestoreAccountResponse {
  bool   ok         = 1;
  string status     = 2;  // status after the write ("" when ok=false)
  string restored_at = 3; // ISO-8601 ("" when ok=false)
  string error_code = 4;  // "USER_NOT_FOUND" | "USER_NOT_DELETED" | "RESTORE_NOT_PUBLISHED" | ""
}

message AdminSetAccountStatusResponse {
  bool   ok               = 1;
  string status           = 2; // status after the write ("" when ok=false)
  int32  revoked_sessions = 3; // sessions killed by this call (0 on unban)
  string error_code       = 4; // "USER_NOT_FOUND" | "INVALID_STATUS" | ""
}

// Internal: user-service fetches full account summary by userId (replaces HTTP GET /api/auth/internal/account)
message GetAccountSummaryRequest {
  string user_id = 1;
}

message LinkedAccountInfo {
  string provider        = 1; // EMAIL | GOOGLE | APPLE
  bool   connected       = 2;
  string provider_user_id = 3; // "" when null
  string provider_email  = 4;  // "" when null
  string linked_at       = 5;  // ISO or ""
}

message AccountSummary {
  string user_id        = 1;
  string account        = 2;
  string email          = 3;  // "" when null
  bool   email_verified = 4;
  bool   has_password   = 5;
  repeated LinkedAccountInfo providers = 6;
  string primary_account = 7; // "" when null; first sign-in method ever linked
}

// Internal: chat-service fetches account names in bulk (replaces HTTP GET /api/internal/accounts)
message BulkGetAccountsRequest {
  repeated string user_ids = 1;
}

message AccountEntry {
  string user_id  = 1;
  string account  = 2;
}

message BulkGetAccountsResponse {
  repeated AccountEntry accounts = 1;
}
