syntax = "proto3";
package messaging;

enum ConversationType {
  PRIVATE = 0;
  GROUP   = 1;
}

service MessagingService {
  rpc SendMessage             (SendMessageRequest)             returns (SendMessageResponse);
  rpc EditMessage             (EditMessageRequest)             returns (EditMessageResponse);
  rpc GetConversationMessages (GetConversationMessagesRequest) returns (GetConversationMessagesResponse);
  rpc MarkMessagesRead        (MarkMessagesReadRequest)        returns (MarkMessagesReadResponse);
  rpc MarkDelivered           (MarkDeliveredRequest)           returns (MarkDeliveredResponse);
  rpc PresenceConnect         (PresenceConnectRequest)         returns (PresenceAck);
  rpc PresenceDisconnect      (PresenceDisconnectRequest)      returns (PresenceAck);
  rpc PresenceHeartbeat       (PresenceHeartbeatRequest)       returns (PresenceAck);
  rpc SendReaction            (SendReactionRequest)            returns (SendReactionResponse);
  rpc ForwardMessage          (ForwardMessageRequest)          returns (ForwardMessageResponse);
  // Parity with community's DeleteCommunityMessage/PinCommunityMessage/
  // UnpinCommunityMessage — private/group delete/pin/unpin were REST-only with
  // no gRPC exposure, so the gateway's /chat socket namespace had no way to
  // offer message:delete/message:pin/message:unpin the way /community does.
  rpc DeleteMessage           (DeleteMessageRequest)           returns (DeleteMessageResponse);
  rpc PinMessage              (PinMessageRequest)              returns (PinMessageResponse);
  rpc UnpinMessage            (UnpinMessageRequest)            returns (UnpinMessageResponse);
  rpc GetMessageReactions     (GetMessageReactionsRequest)     returns (GetMessageReactionsResponse);
  rpc InitiateCall            (InitiateCallRequest)            returns (InitiateCallResponse);
  rpc AnswerCall              (AnswerCallRequest)              returns (AnswerCallResponse);
  rpc DeclineCall             (DeclineCallRequest)             returns (DeclineCallResponse);
  rpc EndCall                 (EndCallRequest)                 returns (EndCallResponse);
  rpc GetCallHistory          (GetCallHistoryRequest)          returns (GetCallHistoryResponse);
  // LiveKit webhook reconciliation. api-gateway verifies the signed webhook
  // and forwards `room_finished` events; chat-service flips IN_PROGRESS→ENDED
  // (idempotent for other states).
  rpc HandleLiveKitRoomFinished (HandleLiveKitRoomFinishedRequest) returns (HandleLiveKitRoomFinishedResponse);
  // LiveKit `participant_joined` — used to stamp `answeredAt` only when the
  // CALLEE's media actually joins, not when they emitted `call:answer`. This
  // is what separates a real answered-and-connected call (has a duration)
  // from an accept-then-immediately-end race (no duration, treated as
  // cancelled). Idempotent per callId.
  rpc HandleLiveKitParticipantJoined (HandleLiveKitParticipantJoinedRequest) returns (HandleLiveKitParticipantJoinedResponse);
  rpc CatchupRoom             (CatchupRoomRequest)             returns (CatchupRoomResponse);
  // Room-independent typing indicator fan-out for private/group — the exact
  // mirror of community's GetCommunityActiveMemberIds. Lets the gateway resolve
  // BOTH "is the sender a participant/active member" (membership: sender in the
  // returned list) AND the direct recipient roster in a single call, so
  // typing:start/stop can be delivered straight to each participant's
  // `user:<id>` socket room without requiring anyone to conv:join first.
  // Read-only, single query (ids only) — no N+1.
  rpc GetRoomParticipantIds   (GetRoomParticipantIdsRequest)   returns (GetRoomParticipantIdsResponse);
  // Mirror of community.proto's CheckCommunityMute, for private 1-to-1 rooms.
  // notifications-service calls this before FCM/APNs fan-out to suppress
  // push for a recipient who has muted this conversation.
  rpc CheckPrivateMute        (CheckPrivateMuteRequest)        returns (CheckPrivateMuteResponse);
  // Mirror of CheckPrivateMute, for group rooms. notifications-service calls
  // this before FCM/APNs fan-out to suppress push for a member who has muted
  // this group.
  rpc CheckGroupMute          (CheckGroupMuteRequest)          returns (CheckGroupMuteResponse);
  // Batched CheckGroupMute: which of these members have muted this group?
  // One call for a whole push fan-out, instead of CheckGroupMute once per
  // recipient — the same treatment community.proto's
  // GetCommunityNotifiableMemberIds already gives the community fan-out.
  rpc GetGroupMutedMemberIds  (GetGroupMutedMemberIdsRequest)  returns (GetGroupMutedMemberIdsResponse);
  // Admin dashboard: count of active group rooms.
  rpc GetGroupCount           (GetGroupCountRequest)           returns (GroupCount);
  // Admin Group Management: list/detail/members (owned by chat-service).
  rpc AdminListGroups         (AdminListGroupsRequest)         returns (AdminListGroupsResponse);
  rpc AdminGetGroup           (AdminGetGroupRequest)           returns (AdminGroupDetail);
  rpc AdminListGroupMembers   (AdminListGroupMembersRequest)   returns (AdminListGroupMembersResponse);
  // Admin Group Moderation: platform-admin disband / remove-member. Both reuse
  // chat-service's own write paths (invite-link revoke, group:removed eviction,
  // roster fan-out) — never a bare repository write.
  rpc AdminDisbandGroup       (AdminDisbandGroupRequest)       returns (AdminGroupMutationResult);
  rpc AdminRemoveGroupMember  (AdminRemoveGroupMemberRequest)  returns (AdminGroupMutationResult);
  // Admin Group Ban: permanent, indefinite ban of ONE member from ONE group.
  // Reuses chat-service's own ban()/unban() write paths (group:removed BAN
  // eviction, rejoin/invite-redemption block). Banning the group OWNER (role
  // ADMIN) instead CLOSES the group (owner-banned banner, roster kept) — same
  // shape as the system-ban cascade, scoped to this one group.
  rpc AdminBanGroupMember     (AdminBanGroupMemberRequest)     returns (AdminGroupBanResult);
  rpc AdminUnbanGroupMember   (AdminUnbanGroupMemberRequest)   returns (AdminGroupMutationResult);
  // Admin Group Conversation viewer (backoffice-service only): read-only,
  // membership-gate-free group message history. Same wire shape as
  // AdminGetCommunityMessages; cursor is a `before_seq` sequenceNumber boundary.
  rpc AdminGetGroupMessages   (AdminGetGroupMessagesRequest)   returns (AdminGetGroupMessagesResponse);
  // Group-side cascade of a PERMANENT system ban. Mirrors community-service's
  // AdminApplySystemBan: groups the banned user OWNS are CLOSED (not
  // disbanded — a disband hides the room from everyone, a close leaves it in
  // every member's list, readable, with a red banner), and their memberships
  // in every other group are ended. Idempotent.
  rpc AdminApplySystemBan     (AdminApplySystemBanRequest)     returns (AdminApplySystemBanResponse);

  // Admin Calling: analytics, the global kill-switch, and a lightweight health
  // ping. Calls are owned by chat-service, so the Call collection is only ever
  // reachable through these RPCs (backoffice has no direct DB access).
  rpc AdminGetCallAnalytics   (AdminGetCallAnalyticsRequest)   returns (AdminCallAnalytics);
  rpc AdminGetCallHealth      (AdminGetCallHealthRequest)      returns (AdminCallHealth);
  rpc AdminGetCallingEnabled  (AdminGetCallingEnabledRequest)  returns (AdminCallingEnabled);
  rpc AdminSetCallingEnabled  (AdminSetCallingEnabledRequest)  returns (AdminCallingEnabled);

  // Authorize a media download against resource membership. media-service calls
  // this for chat-scoped attachments because the object key encodes the uploader,
  // not the room/group/community the file belongs to. Reuses chat-service's
  // access guards (assertPrivateParticipant / assertGroupMember / assertCommunityMember).
  rpc CheckMediaAccess        (CheckMediaAccessRequest)        returns (CheckMediaAccessResponse);

  // User Search (user-service): bulk-resolve existing PrivateRoom ids for a
  // viewer against a list of candidate peer userIds in a single indexed query
  // (participantsKey is @unique) — avoids N+1 calls from the search endpoint.
  rpc ResolvePrivateRooms     (ResolvePrivateRoomsRequest)     returns (ResolvePrivateRoomsResponse);
  // User Search (user-service): list the viewer's existing private-room peer
  // ids (capped), used to classify search-matched users into "Chat" (has a
  // room) vs "Other" (doesn't) without a per-candidate round trip.
  rpc ListPrivateRooms        (ListPrivateRoomsRequest)        returns (ListPrivateRoomsResponse);
  // User Search (user-service): list/search groups for a viewer in one of
  // three modes — ACTIVE (groups the viewer belongs to), OTHER (groups they
  // don't, excluding given roomIds), BY_IDS (resolve specific roomIds, e.g.
  // to refresh a recently-viewed group's metadata).
  rpc SearchUserGroups        (SearchUserGroupsRequest)        returns (SearchUserGroupsResponse);
  // Auto-Connect (user-service): batch get-or-create private rooms for a
  // user against multiple peers. Returns existing roomId if one exists,
  // creates new one if not (and friendship is ACCEPTED).
  rpc GetOrCreatePrivateRooms (GetOrCreatePrivateRoomsRequest)  returns (GetOrCreatePrivateRoomsResponse);
}

// scope is PRIVATE_CHAT | GROUP_CHAT | COMMUNITY_CHAT; resource_id is the
// roomId / groupId / communityId the attachment belongs to.
message CheckMediaAccessRequest {
  string user_id     = 1;
  string scope       = 2;
  string resource_id = 3;
}
message CheckMediaAccessResponse {
  bool allowed = 1;
}

message ResolvePrivateRoomsRequest {
  string          viewer_id      = 1;
  repeated string peer_user_ids  = 2;
}
message PrivateRoomMatchDto {
  string peer_user_id = 1;
  string room_id      = 2;
}
message ResolvePrivateRoomsResponse {
  repeated PrivateRoomMatchDto matches = 1;
}

message ListPrivateRoomsRequest {
  string viewer_id = 1;
  int32  limit      = 2;
}
message ListPrivateRoomsResponse {
  repeated PrivateRoomMatchDto rooms = 1;
}

message GetOrCreatePrivateRoomsRequest {
  string          user_id      = 1;
  repeated string peer_user_ids = 2;
}
message GetOrCreatePrivateRoomsResponse {
  repeated PrivateRoomMatchDto rooms = 1;
}

message SearchUserGroupsRequest {
  string          viewer_id = 1;
  string          q         = 2;
  // "ACTIVE" | "OTHER" | "BY_IDS"
  string          mode      = 3;
  // BY_IDS: the roomIds to resolve. OTHER: extra roomIds to exclude
  // (e.g. ones already shown in a "recent" section) on top of the viewer's
  // own active-membership rooms.
  repeated string room_ids  = 4;
  int32           limit     = 5;
}
message GroupSummaryDto {
  string room_id          = 1;
  string name             = 2;
  string avatar           = 3;
  string description      = 4;
  int32  member_count     = 5;
  bool   is_active_member = 6;
  int64  last_message_at  = 7;
  int64  created_at       = 8;
}
message SearchUserGroupsResponse {
  repeated GroupSummaryDto groups = 1;
}

message GetGroupCountRequest {}
message GroupCount {
  int64 total = 1;
}

// ---------------------------------------------------------------------------
// Admin Group Management
// ---------------------------------------------------------------------------
message AdminGroupAdmin {
  string user_id    = 1;
  string username   = 2;
  string email      = 3;
  string avatar_url = 4;
}
message AdminGroupRow {
  string          id           = 1;
  string          name         = 2;
  string          avatar_url   = 3;
  string          description  = 4;
  int32           member_count = 5;
  int64           created_at    = 6;
  AdminGroupAdmin admin        = 7;
  // Raw lifecycle status: "ACTIVE" | "CLOSED" | "DISBANDED".
  // CLOSED = the owner was permanently system-banned; the room stays visible
  // and readable to its members but nobody can write.
  string          status       = 8;
  // Epoch ms; 0 when the group was never disbanded.
  int64           disbanded_at = 9;
  // Owner's ACCOUNT status from auth ("ACTIVE" | "SUSPENDED" | "BANNED" | "").
  string          owner_account_status = 11;
}
message AdminListGroupsRequest {
  string q          = 1;
  string from_date  = 2;
  string to_date    = 3;
  string sort_field = 4;
  string sort_dir   = 5;
  int32  page       = 6;
  int32  limit      = 7;
  // "" / "ACTIVE" = active only (default), "ALL" = no filter, else exact match.
  string status     = 10;
}
message AdminListGroupsResponse {
  repeated AdminGroupRow groups = 1;
  int32                  total  = 2;
}
message AdminGetGroupRequest {
  string group_id = 1;
}
message AdminGroupDetail {
  bool          found = 1;
  AdminGroupRow group = 2;
}
message AdminGroupMemberRow {
  string user_id    = 1;
  string username   = 2;
  string email      = 3;
  string avatar_url = 4;
  string role       = 5;
  int64  joined_at   = 6;
  // Membership status: "ACTIVE" | "LEFT" | "KICKED" | "BANNED".
  string status           = 7;
  // EFFECTIVE moderation mute — a timed mute lazily expires, so this is not the
  // raw column (see chat-service lib/access-guard.isGroupMemberMuted).
  bool   moderation_muted = 8;
  // Epoch ms; 0 when unset.
  int64  kicked_at        = 9;
  int64  banned_at        = 10;
}
message AdminListGroupMembersRequest {
  string group_id = 1;
  string q        = 2;
  string role     = 3;
  int32  page     = 4;
  int32  limit    = 5;
  // "" / "ACTIVE" = active only (default), "ALL" = no filter, else exact match.
  string status   = 6;
}
message AdminListGroupMembersResponse {
  bool                         found   = 1;
  repeated AdminGroupMemberRow members = 2;
  int32                        total   = 3;
}

message AdminDisbandGroupRequest {
  string group_id       = 1;
  // backoffice AdminUser.id — stored as GroupRoom.disbandedBy (DB-only).
  string actor_admin_id = 2;
}
message AdminApplySystemBanRequest {
  string user_id        = 1;
  string actor_admin_id = 2; // backoffice AdminUser.id
  string reason         = 3;
}
message AdminApplySystemBanResponse {
  bool            ok                = 1;
  repeated string closed_group_ids  = 2; // owned, now CLOSED (still visible)
  repeated string removed_group_ids = 3; // memberships ended
  string          error_code        = 4; // "" on success
}

message AdminRemoveGroupMemberRequest {
  string group_id       = 1;
  string user_id        = 2;
  string actor_admin_id = 3;
  // Persisted as GroupMember.kickReason.
  string reason         = 4;
}
message AdminGroupMutationResult {
  bool   ok         = 1;
  bool   found      = 2;
  // "" on success, else CHAT_GROUP_NOT_FOUND | CHAT_GROUP_ALREADY_DISBANDED | CHAT_NOT_A_MEMBER
  string error_code = 3;
}

message AdminBanGroupMemberRequest {
  string group_id       = 1;
  string user_id        = 2;
  string actor_admin_id = 3; // backoffice AdminUser.id
  // Persisted as GroupMember.kickReason.
  string reason         = 4;
}
message AdminUnbanGroupMemberRequest {
  string group_id       = 1;
  string user_id        = 2;
  string actor_admin_id = 3;
}
message AdminGroupBanResult {
  bool   ok           = 1;
  bool   found        = 2;
  // "" on success, else CHAT_GROUP_NOT_FOUND | CHAT_GROUP_NOT_ACTIVE |
  // CHAT_NOT_A_MEMBER (ban target / unban non-banned target).
  string error_code   = 3;
  // true when the target was the group OWNER, so the whole group was CLOSED
  // (ADMIN_BANNED) rather than a single membership banned.
  bool   closed_group = 4;
}

message AdminGetGroupMessagesRequest {
  string group_id = 1;
  // before_seq boundary (a sequenceNumber as a string). "" = newest page.
  string cursor   = 2;
  int32  limit    = 3;
}
message AdminGroupMessageDto {
  string message_id          = 1;
  string room_id             = 2;
  string sender_id           = 3;
  string sender_name         = 4;
  // Raw avatar object key; backoffice presigns at its output boundary.
  string sender_avatar       = 5;
  string message             = 6;   // content.text
  string content_type        = 7;   // messageType
  string media_key           = 8;   // first attachment's object key, if any
  string attachments_json    = 9;   // JSON.stringify(content.files ?? [])
  string reactions_json      = 10;
  string quote_data_json     = 11;
  int64  sent_at             = 12;  // createdAt, epoch ms
  string system_message_type = 13;  // systemEvent
  string system_metadata     = 14;  // JSON.stringify(systemData)
  bool   is_deleted          = 15;
}
message AdminGetGroupMessagesResponse {
  repeated AdminGroupMessageDto messages = 1;
  // Next before_seq boundary; "" when there is no older page.
  string next_cursor = 2;
  bool   has_more    = 3;
}

// ---------------------------------------------------------------------------
// Admin Calling — analytics, kill-switch, health. Backoffice has no direct
// access to the `calls` collection, so everything flows through these.
// ---------------------------------------------------------------------------

/** Calls started in one hour-of-day bucket (UTC), for the peak-hours chart. */
message AdminCallHourBucket {
  int32 hour  = 1; // 0-23, UTC
  int64 count = 2;
}

/** Inclusive YYYY-MM-DD range; empty strings mean "no bound". */
message AdminGetCallAnalyticsRequest {
  string from_date = 1;
  string to_date   = 2;
}

message AdminCallAnalytics {
  int64  total_calls     = 1;
  int64  audio_calls     = 2;
  int64  video_calls     = 3;
  int64  answered_calls  = 4;
  int64  missed_calls    = 5;
  int64  declined_calls  = 6;
  // missed_calls / total_calls, 0 when total_calls == 0.
  double missed_rate     = 7;
  // Mean/sum over calls that actually connected (duration_sec > 0).
  double avg_duration_sec   = 8;
  int64  total_duration_sec = 9;
  repeated AdminCallHourBucket peak_hours = 10;
  // The mean is skewed hard by calls left open by a crashed client, so p50/p90
  // are also reported — p50 is the number an admin should actually read.
  int64  median_duration_sec = 12;
  int64  p90_duration_sec    = 13;
  // Answered calls that produced real media (duration_sec > 0) ÷ answered
  // calls. Proxy for call quality: a low value means calls are being picked up
  // but the media path is failing. True MOS/jitter needs LiveKit analytics.
  double connection_success_rate = 11;
}

message AdminGetCallHealthRequest {}

message AdminCallHealth {
  int64 active_calls  = 1; // IN_PROGRESS
  int64 ringing_calls = 2; // RINGING within the ringing-timeout window
}

message AdminGetCallingEnabledRequest {}

message AdminSetCallingEnabledRequest {
  bool   enabled  = 1;
  string actor_id = 2; // admin id, recorded on the flag row
}

message AdminCallingEnabled {
  bool   enabled    = 1;
  string updated_by = 2;
  int64  updated_at = 3; // epoch ms, 0 when never set
}

message SendMessageRequest {
  string           conversation_id    = 1;
  string           sender_id          = 2;
  string           client_message_id  = 3;
  string           content_type       = 4;
  string           content_text       = 5;
  string           media_key          = 6;
  string           replied_to_id      = 7;
  string           receiver_id        = 8;
  ConversationType conversation_type  = 9;
  string           sender_name        = 10;
  string           sender_avatar      = 11;
  string           content_json       = 12;
  // §5.1: client compose time (epoch ms), display-only; never overwrites server_ts.
  int64            client_ts          = 13;
}
message SendMessageResponse {
  string message_id      = 1;
  string conversation_id = 2;
  int64  sent_at         = 3;
  bool   already_sent    = 4;
  int64  sequence_number = 5;
}
message GetConversationMessagesRequest {
  string           conversation_id    = 1;
  string           requester_id       = 2;
  string           cursor             = 3;
  int32            limit              = 4;
  ConversationType conversation_type  = 5;
}
message GetConversationMessagesResponse {
  repeated MessageDto messages   = 1;
  string              next_cursor = 2;
  bool                has_more   = 3;
}
message MessageDto {
  string message_id      = 1;
  string conversation_id = 2;
  string sender_id       = 3;
  string content_type    = 4;
  string content_text    = 5;
  string media_key       = 6;
  string replied_to_id   = 7;
  int64  sent_at         = 8;
  repeated ReactionDto reactions = 9;
  bool   is_read         = 10;
  string content_json    = 11;
  int64  sequence_number = 12;
  // Canonical grouped reactions (FE reads this; the thin `reactions` field above
  // stays for back-compat). Mirrors the GetMessageReactions/broadcast shape.
  repeated ReactionGroupDto reaction_groups = 13;
}
message ReactionDto {
  string user_id = 1;
  string emoji   = 2;
}
message EditMessageRequest {
  string           message_id        = 1;
  string           conversation_id   = 2;
  string           editor_id         = 3;
  string           content_text      = 4;
  string           content_json      = 5;
  ConversationType conversation_type = 6;
}
message EditMessageResponse {
  string message_id      = 1;
  int64  edited_at       = 2;
  string content_json    = 3;
  int64  sequence_number = 4;
}
message MarkMessagesReadRequest {
  string           conversation_id    = 1;
  string           reader_id          = 2;
  string           up_to_message_id   = 3;
  ConversationType conversation_type  = 4;
}
message MarkMessagesReadResponse {
  int32 updated_count = 1;
}
message MarkDeliveredRequest {
  string           conversation_id   = 1;
  string           recipient_id      = 2;
  string           up_to_message_id  = 3;
  ConversationType conversation_type = 4;
}
message MarkDeliveredResponse {
  int32 updated_count = 1;
}
message PresenceConnectRequest {
  string user_id     = 1;
  string device_id   = 2;
  string platform    = 3;
  string client_type = 4;
  string app_state   = 5;
}
message PresenceDisconnectRequest {
  string user_id   = 1;
  string device_id = 2;
}
message PresenceHeartbeatRequest {
  string user_id   = 1;
  string device_id = 2;
  string app_state = 3;
}
message PresenceAck {
  bool ok = 1;
}
message SendReactionRequest {
  string           message_id         = 1;
  string           conversation_id    = 2;
  string           user_id            = 3;
  string           emoji              = 4;
  ConversationType conversation_type  = 5;
  // "set" => caller ends up with exactly `emoji` (re-sending the same one clears it).
  // Empty/"toggle" (default) keeps the legacy per-emoji toggle, so existing clients are unaffected.
  string           mode               = 6;
}
message SendReactionResponse {
  string message_id        = 1;
  repeated ReactionDto reactions = 2;
}

message ForwardMessageRequest {
  string           message_id             = 1;
  string           target_conversation_id = 2;
  string           sender_id              = 3;
  string           receiver_id            = 4;
  string           client_message_id      = 5;
  ConversationType conversation_type      = 6;
  string           sender_name            = 7;
  string           sender_avatar          = 8;
}
message ForwardMessageResponse {
  string message_id      = 1;
  string conversation_id = 2;
  int64  sent_at         = 3;
  int64  sequence_number = 4;
}

message DeleteMessageRequest {
  string           conversation_id   = 1;
  string           message_id        = 2;
  string           user_id           = 3;
  // "forMe" | "forEveryone"
  string           delete_type       = 4;
  ConversationType conversation_type = 5;
}
message DeleteMessageResponse {
  string message_id      = 1;
  string conversation_id = 2;
  string delete_type     = 3;
}

message PinMessageRequest {
  string           conversation_id   = 1;
  string           message_id        = 2;
  string           user_id           = 3;
  ConversationType conversation_type = 4;
}
message PinMessageResponse {
  string message_id      = 1;
  string conversation_id = 2;
  int64  pinned_count    = 3;
  int64  pinned_at       = 4;
}

message UnpinMessageRequest {
  string           conversation_id   = 1;
  string           message_id        = 2;
  string           user_id           = 3;
  ConversationType conversation_type = 4;
}
message UnpinMessageResponse {
  string message_id      = 1;
  string conversation_id = 2;
  int64  pinned_count    = 3;
}

message GetMessageReactionsRequest {
  string           message_id         = 1;
  string           conversation_id    = 2;
  ConversationType conversation_type  = 3;
  string           requester_id       = 4;
}
message ReactionUserDto {
  string user_id      = 1;
  string display_name = 2;
  string avatar       = 3;
}
message ReactionGroupDto {
  string emoji                   = 1;
  int32  count                   = 2;
  repeated ReactionUserDto users = 3;
  bool   self_reacted            = 4;
}
message GetMessageReactionsResponse {
  string message_id                   = 1;
  repeated ReactionGroupDto reactions  = 2;
}

message InitiateCallRequest {
  string caller_id       = 1;
  string callee_id       = 2;
  string type            = 3;
  string private_room_id = 4;
  // GROUP call: set instead of callee_id — the server resolves the ring
  // roster from the group's active membership. Empty for 1:1 calls.
  string group_id        = 5;
}
message AnswerCallRequest {
  string call_id   = 1;
  string callee_id = 2;
  // One connection of the user, NOT one login: two browser tabs share a session,
  // so the client mints this per page load. The answer race is arbitrated on it —
  // one leg per callee wins and the rest get ALREADY_ANSWERED — and only the
  // winning leg may later end the call. Empty falls back to session granularity.
  string leg_id    = 3;
  // The auth session that made this request, so the "stop ringing" BACKSTOP PUSH
  // can skip the device that already acted. `leg_id` cannot do this job: it is a
  // per-page-load id the client mints, while device tokens are registered
  // against a session — `session_id` is the only value present on both sides.
  //
  // This is the push-channel twin of the socket path's `handledByLegId`
  // exclusion. Empty = exclude nothing (the previous behaviour).
  string session_id = 4;
}
message AnswerCallResponse {
  string             call_id = 1;
  string             status  = 2;
  LiveKitCredentials livekit = 3;
  // The ONE authoritative answer instant, epoch ms (0 when unknown). Every leg
  // renders the in-call timer as `now - answered_at`, so all of them count the
  // same call. Returned on the ack because the answering leg's media often comes
  // up before the `call:answered` broadcast reaches it back — without this it
  // would have to fall back to its own clock and stay offset for the whole call.
  int64              answered_at = 4;
}
message DeclineCallRequest {
  string call_id   = 1;
  string callee_id = 2;
  // See AnswerCallRequest.session_id — the device that declined must not be
  // woken by the dismissal push for its own decline.
  string session_id = 3;
}
message DeclineCallResponse {
  string call_id = 1;
  string status  = 2;
}
message EndCallRequest {
  string call_id = 1;
  string user_id = 2;
  string leg_id  = 3;
  // Why the CALLER is ending a still-ringing call. "NO_ANSWER" = their ring
  // window elapsed, which settles the call as MISSED (no answer) instead of
  // CANCELLED. Advisory only: chat-service still requires an unanswered
  // RINGING call ended by the caller before it honours it. Empty = a
  // deliberate hangup, the historical behaviour.
  string reason  = 4;
  // See AnswerCallRequest.session_id.
  string session_id = 5;
}
message EndCallResponse {
  string call_id      = 1;
  string status       = 2;
  int32  duration_sec = 3;
}
message GetCallHistoryRequest {
  string user_id = 1;
  string cursor  = 2;
  int32  limit   = 3;
}
message CallDto {
  string call_id      = 1;
  string caller_id    = 2;
  string callee_id    = 3;
  string type         = 4;
  string status       = 5;
  int64  initiated_at = 6;
  int64  answered_at  = 7;
  int64  ended_at     = 8;
  int32  duration_sec = 9;
  string ended_by     = 10;
}
message GetCallHistoryResponse {
  repeated CallDto calls = 1;
  string           next_cursor = 2;
  bool             has_more    = 3;
}

message LiveKitCredentials {
  string url   = 1;
  string token = 2;
}

message InitiateCallResponse {
  string             call_id    = 1;
  string             status     = 2;
  // Caller's LiveKit token. Callee's token ships via Redis in `call:incoming`.
  LiveKitCredentials livekit    = 3;
}

message HandleLiveKitRoomFinishedRequest {
  // LiveKit room_name == callId by our convention (see call.service.ts).
  string room_name = 1;
  // Originating LiveKit webhook: "room_finished" or "participant_left". They are
  // NOT interchangeable — only a real room close may cancel a RINGING call, since
  // during RINGING the caller is the room's sole participant.
  string event_type = 2;
  // Participants still in the room when the webhook fired. A `participant_left`
  // that leaves 2+ behind is one leg dropping out of a call that is still up
  // (e.g. a second device of one user being evicted for duplicate identity) and
  // must NOT end the call. -1 when the webhook did not report a count.
  int32 remaining_participants = 3;
}
message HandleLiveKitRoomFinishedResponse {}

message HandleLiveKitParticipantJoinedRequest {
  // LiveKit room_name == callId by our convention.
  string room_name = 1;
  // The joining participant's identity — matches the userId used to mint the
  // LiveKit token (see livekit.service.ts). Chat-service uses it to skip the
  // caller (their join is meaningless for "answered", they were in the room
  // from initiate) and only stamp answeredAt when the callee actually joins.
  string participant_identity = 2;
}
message HandleLiveKitParticipantJoinedResponse {}

message CatchupRoomRequest {
  string           conversation_id   = 1;
  string           requester_id      = 2;
  int64            since_seq         = 3;
  int32            limit             = 4;
  ConversationType conversation_type = 5;
  // ZERO-LOSS revision cursor (takes precedence over since_seq). Exclusive lower
  // bound on the per-room CHANGE revision: the server returns every message whose
  // revision > since_revision — inserts AND mutations (edit/delete/reaction) — via
  // the same core as the REST /changes feed. Feed back last_revision to continue.
  // -1 = NOT revision mode. 0 is a valid cold-start cursor and so cannot be the
  // sentinel; a raw request omitting the field defaults to 0, which must keep
  // meaning legacy since_seq mode.
  int64            since_revision    = 6;
}
message CatchupEventDto {
  string message_id      = 1;
  string conversation_id = 2;
  string sender_id       = 3;
  string content_type    = 4;
  string content_text    = 5;
  string content_json    = 6;
  int64  sent_at         = 7;
  int64  sequence_number = 8;
  bool   is_deleted      = 9;
  string deleted_type    = 10;
  int64  edited_at       = 11;
  // SYSTEM messages (group lifecycle) carry structured data so reconnecting
  // clients can localize/render them, matching the realtime message:new event.
  string system_event    = 12;
  string system_data     = 13; // JSON-encoded object ("" for non-system messages)
  // ZERO-LOSS CHANGE cursor for this message (Telegram pts). Present in both
  // catch-up modes; the client tracks the per-room max as its high-water.
  int64  revision        = 14;
  // Canonical grouped reaction state, mirroring CommunityCatchupEventDto —
  // without this a reaction applied live vanishes the next time the client
  // catches up (reopen room, reload, reconnect), since catch-up is what
  // rehydrates message state on those paths, not a plain reactions broadcast.
  repeated ReactionGroupDto reactions = 15;
}
message CatchupRoomResponse {
  string conversation_id           = 1;
  repeated CatchupEventDto events  = 2;
  bool   has_more                  = 3;
  int64  last_seq                  = 4;
  bool   authorized                = 5;
  // ZERO-LOSS revision-mode fields (0/false in since_seq mode):
  int64  room_revision             = 6; // room's current CHANGE max
  int64  last_revision             = 7; // client's new high-water; feed back as since_revision
  bool   reset_required            = 8; // since_revision below retention → re-baseline
}

