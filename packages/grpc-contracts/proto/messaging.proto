// ---- GetRoomParticipantIds ----
// Mirror of community.proto's GetCommunityActiveMemberIds, for private/group.
message GetRoomParticipantIdsRequest {
  string           conversation_id   = 1;
  ConversationType conversation_type = 2;
}
message GetRoomParticipantIdsResponse {
  repeated string user_ids = 1;
  // Subset of `user_ids` currently under a moderation mute (GROUP only; always
  // empty for PRIVATE, which has no moderation mute). The gateway drops a
  // typing/recording indicator whose SENDER appears here — a muted member is
  // send-blocked, so broadcasting "…is typing" would be a lie. Kept as a
  // separate list rather than filtering `user_ids` so a muted member still
  // RECEIVES everyone else's indicators (mute is a send restriction only).
  repeated string muted_user_ids = 2;
}

// ---- CheckPrivateMute ----
message CheckPrivateMuteRequest {
  string room_id = 1;
  // The recipient whose mute setting on this room should be checked.
  string user_id = 2;
}
message CheckPrivateMuteResponse {
  bool  is_muted    = 1;
  int64 muted_until = 2; // epoch ms; 0 = indefinite mute or not muted
}

// ---- CheckGroupMute ----
message CheckGroupMuteRequest {
  string room_id = 1;
  // The member whose mute setting on this group should be checked.
  string user_id = 2;
}
message CheckGroupMuteResponse {
  bool  is_muted    = 1;
  int64 muted_until = 2; // epoch ms; 0 = indefinite mute or not muted
}

// ---- GetGroupMutedMemberIds ----
message GetGroupMutedMemberIdsRequest {
  string room_id = 1;
  // Candidates to test. Only these are considered, so the response can never
  // be larger than the fan-out that asked for it.
  repeated string user_ids = 2;
}
message GetGroupMutedMemberIdsResponse {
  // The subset of `user_ids` that have muted this group. Empty means nobody —
  // which is also the fail-open answer, since a mute-oracle failure must never
  // suppress a push.
  repeated string user_ids = 1;
}
