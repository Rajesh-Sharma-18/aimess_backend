syntax = "proto3";
package community;

service CommunityService {
  rpc SendCommunityMessage (SendCommunityMessageRequest) returns (SendCommunityMessageResponse);
  rpc GetCommunityMessages (GetCommunityMessagesRequest) returns (GetCommunityMessagesResponse);
  // Fetch a single community message by id for moderation snapshotting (report
  // cards). Scoped by room_id (=== communityId) as an IDOR guard. Returns RAW
  // object keys — the caller resolves them to presigned URLs on read.
  rpc GetCommunityMessageById (GetCommunityMessageByIdRequest) returns (GetCommunityMessageByIdResponse);
  // Synchronous, idempotent provisioning of a community's chat room (GeneralRoom,
  // id === communityId). community-service calls this during community creation so
  // a member's first message can never race ahead of the async community.created
  // event (which remains as a backstop). Safe to call repeatedly.
  rpc EnsureCommunityRoom (EnsureCommunityRoomRequest) returns (EnsureCommunityRoomResponse);
  // Reconciliation: chat-service pulls communities (+ members) on boot to
  // provision any missing community chat rooms / sync RoomMember rows.
  rpc ListCommunities (ListCommunitiesRequest) returns (ListCommunitiesResponse);
  // Admin dashboard: count of active (non-soft-deleted) communities.
  rpc GetCommunityCount (GetCommunityCountRequest) returns (CommunityCount);

  // Authorization gate for stream-service: is `user_id` an ACTIVE member of
  // `community_id`, and what is their role. Backs the go-live check.
  rpc ValidateMembership (ValidateMembershipRequest) returns (ValidateMembershipResponse);

  // chat-service's private-message `systemAction` card (COMMUNITY_INVITATION):
  // batch-resolve, per (communityId, code) pair, whether the community still
  // exists, its current name/handle, whether `user_id` already joined, and
  // whether the carried invite code/permanent code is still usable. Read-only,
  // batched to avoid one round trip per invitation message on a history page.
  rpc GetCommunityInviteContexts (GetCommunityInviteContextsRequest) returns (GetCommunityInviteContextsResponse);

  // Synchronous companion to chat-service's async `community.activity.queue`
  // "reaction_added"/"reaction_removed" publish: chat-service calls this
  // RIGHT AFTER a reaction toggle, in addition to (never instead of) the
  // existing queue publish, which remains the resiliency backstop for when
  // this call fails (community-service down/unreachable). Closes the race
  // where `GET /communities/mine` reads the DB before the async event has
  // been consumed, making the reaction's `lastActivity` appear to vanish on
  // an immediate page reload. Delegates to the EXACT SAME
  // `setReactionActivity`/`clearReactionActivityIfCurrent` repository methods
  // the queue consumer already calls — no separate persistence logic.
  rpc UpdateReactionActivity (UpdateReactionActivityRequest) returns (UpdateReactionActivityResponse);
  // Synchronous companion to chat-service's async `community.activity.queue`
  // publish for the CANONICAL lastActivity (message send/edit/delete) — mirrors
  // UpdateReactionActivity's role for reactions. Awaited BEFORE the caller's
  // response so a client that re-fetches GET /communities/mine immediately
  // after a delete never races ahead of the DB write; the queue publish
  // remains the best-effort backstop. Two modes, discriminated by
  // `self_user_id`:
  //  - "" (empty): canonical forward-only bump (mirrors
  //    communityRepository.updateLastActivity — same as the queue consumer).
  //  - non-empty: personal self-hide overlay for delete-for-me — writes ONLY
  //    lastActivityUserId/lastActivitySelfPreview (unconditional overwrite,
  //    reusing the existing self-referential join/role-change columns), never
  //    touching the canonical fields other members see.
  rpc UpdateMessageActivity (UpdateMessageActivityRequest) returns (UpdateMessageActivityResponse);

  // ---- Backoffice (admin panel) Community Management ----
  // Read-through queries for the admin Community Management screen + the
  // close/reopen moderation command. backoffice-service is the only caller.
  rpc AdminListCommunities (AdminListCommunitiesRequest) returns (AdminListCommunitiesResponse);
  rpc AdminGetCommunity (AdminGetCommunityRequest) returns (AdminCommunityDetail);
  rpc AdminListCommunityMembers (AdminListCommunityMembersRequest) returns (AdminListCommunityMembersResponse);
  // Currently-muted members for a community (moderation mute, lazy expiration).
  // backoffice-only — the community-facing REST list is gated to MODERATOR+
  // members via CommunityService's own JWT; this RPC has no community-membership
  // requirement since the caller is a trusted platform admin.
  rpc AdminListMutedMembers (AdminListMutedMembersRequest) returns (AdminListMutedMembersResponse);
  // Batch enrichment: fetch name + avatar + category + memberCount for a set of
  // community ids. Backs the backoffice Livestream Management list/detail join
  // (one round-trip per page). avatar_url is already presigned.
  rpc AdminGetCommunitiesByIds (AdminGetCommunitiesByIdsRequest) returns (AdminGetCommunitiesByIdsResponse);
  // Batch role lookup for a set of userIds within one community. Backs the
  // backoffice Livestream Viewer List "type" (Admin|Moderator|Member) column
  // without an N+1 per-viewer lookup.
  rpc AdminGetMemberRoles (AdminGetMemberRolesRequest) returns (AdminGetMemberRolesResponse);
  // Reverse lookup for the admin User Management detail screen: the communities a
  // given user is an ACTIVE member of. Searchable by community name/id, sortable.
  rpc AdminListUserCommunities (AdminListUserCommunitiesRequest) returns (AdminListUserCommunitiesResponse);
  rpc AdminSetModerationStatus (AdminSetModerationStatusRequest) returns (AdminSetModerationStatusResponse);
  // Admin Reports search: community name lookup, returns matching communityIds
  // only (capped) for the caller to combine into an id-set filter.
  rpc AdminSearchCommunityIds (AdminSearchCommunityIdsRequest) returns (AdminSearchCommunityIdsResponse);

  // ---- Backoffice (admin panel) Category Management ----
  // Categories are owned by community-service (CommunityCategory); the
  // backoffice admin panel manages them exclusively through these RPCs — no
  // duplicate category table exists on the backoffice side.
  rpc AdminListCategories (AdminListCategoriesRequest) returns (AdminListCategoriesResponse);
  rpc AdminCreateCategory (AdminCreateCategoryRequest) returns (AdminCategoryMutationResponse);
  rpc AdminUpdateCategory (AdminUpdateCategoryRequest) returns (AdminCategoryMutationResponse);
  rpc AdminDeleteCategory (AdminDeleteCategoryRequest) returns (AdminDeleteCategoryResponse);

  // Bulk community-chat summaries for GET /communities/mine: per-community unread
  // count + last-message preview for the calling user. Member-only previews.
  rpc GetCommunityChatSummaries (GetCommunityChatSummariesRequest) returns (GetCommunityChatSummariesResponse);

  // Bulk mark-as-read: advances lastReadAt to now for the caller's active
  // member rows across the given communities. Non-member rooms are silently skipped.
  rpc BulkMarkCommunityRead (BulkMarkCommunityReadRequest) returns (BulkMarkCommunityReadResponse);

  // Offline catch-up: fetch missed messages in a community room since a known
  // message id. Used on reconnect to fill the gap without re-fetching history.
  rpc CommunityCatchup (CommunityCatchupRequest) returns (CommunityCatchupResponse);

  // Lightweight membership oracle for the gateway socket layer: lets the
  // /community namespace reject a BANNED (or non-member) user at community:join
  // before they enter the broadcast room. Read-only, single-row lookup.
  rpc CheckCommunityMembership (CheckCommunityMembershipRequest) returns (CheckCommunityMembershipResponse);

  // Socket auto-room subscription: on socket connect the gateway fetches all
  // community IDs where userId is an ACTIVE member so it can join
  // community:<id> rooms immediately — without requiring a client-emitted
  // community:join for each community. Enables typing indicators and other
  // community events to reach users regardless of which community is open.
  // Read-only, lightweight single-user membership scan.
  rpc GetUserActiveCommunityIds (GetUserActiveCommunityIdsRequest) returns (GetUserActiveCommunityIdsResponse);

  // Room-independent typing indicator fan-out: lets the gateway resolve BOTH
  // "is the sender an active member" (membership: sender in the returned list)
  // AND the direct recipient roster in a single call, so community:typing:start
  // /stop can be delivered straight to each active member's `user:<id>` socket
  // room without requiring anyone to join a community-scoped room first.
  // Read-only, single query (select userId only) — no N+1.
  rpc GetCommunityActiveMemberIds (GetCommunityActiveMemberIdsRequest) returns (GetCommunityActiveMemberIdsResponse);

  // Moderation-mute oracle for notifications-service: lets the notification
  // eligibility gate suppress community-action notifications from a member who
  // has been muted by a moderator. Read-only, single-row lookup; never throws.
  rpc CheckCommunityMute (CheckCommunityMuteRequest) returns (CheckCommunityMuteResponse);

  // Per-community notification-preference oracle for notifications-service:
  // whether `userId` wants pushes of `field` (chatEnabled/streamEnabled/
  // announcementEnabled) from `communityId`. Read-only, single-row lookup,
  // defaults to enabled=true when no preference row exists; never throws.
  rpc CheckCommunityNotificationPref (CheckCommunityNotificationPrefRequest) returns (CheckCommunityNotificationPrefResponse);

  // Toggle reaction on a community message (add if absent, remove if present).
  rpc ReactToCommunityMessage (ReactToCommunityMessageRequest) returns (ReactToCommunityMessageResponse);

  rpc EditCommunityMessage   (EditCommunityMessageRequest)   returns (EditCommunityMessageResponse);
  rpc DeleteCommunityMessage (DeleteCommunityMessageRequest) returns (DeleteCommunityMessageResponse);
  rpc PinCommunityMessage    (PinCommunityMessageRequest)    returns (PinCommunityMessageResponse);
  rpc UnpinCommunityMessage  (UnpinCommunityMessageRequest)  returns (UnpinCommunityMessageResponse);

  // ---- Member moderation (actor must be admin or moderator) ----
  rpc KickMember        (KickMemberRequest)        returns (ModerationActionResponse);
  rpc BanMember         (BanMemberRequest)         returns (ModerationActionResponse);
  rpc UnbanMember       (UnbanMemberRequest)        returns (ModerationActionResponse);
  rpc TransferAdmin     (TransferAdminRequest)      returns (ModerationActionResponse);
  rpc ChangeMemberRole  (ChangeMemberRoleRequest)   returns (ModerationActionResponse);
  rpc CreateReport      (CreateReportRequest)       returns (CreateReportResponse);
  rpc DeleteCommunity   (DeleteCommunityRequest)    returns (ModerationActionResponse);
  // Community-wide mute — the single write path for the moderation mute record.
  // Called from the community UI/socket AND from stream-service's livestream
  // "mute" action, so both entry points share one source of truth.
  rpc MuteMember        (MuteMemberRequest)        returns (ModerationActionResponse);
  rpc UnmuteMember      (UnmuteMemberRequest)      returns (ModerationActionResponse);

  // ---- Per-message read receipt (fine-grained, single room) ----
  rpc MarkCommunityMessageRead (MarkCommunityMessageReadRequest) returns (MarkCommunityMessageReadResponse);

  // ---- Full reaction user list for a message ----
  rpc GetCommunityMessageReactions (GetCommunityMessageReactionsRequest) returns (GetCommunityMessageReactionsResponse);

  // ---- Forward a community message to another community room ----
  rpc ForwardCommunityMessage (ForwardCommunityMessageRequest) returns (ForwardCommunityMessageResponse);

  // ---- Delivery receipt (client emits on receiving message:new) ----
  rpc MarkCommunityMessageDelivered (MarkCommunityMessageDeliveredRequest) returns (MarkCommunityMessageDeliveredResponse);
}

// ---- Bulk mark-as-read ----
message BulkMarkCommunityReadRequest {
  string userId = 1;
  repeated string communityIds = 2;
}
message BulkMarkCommunityReadResponse {
  int32 updatedCount = 1; // number of member rows actually updated
}

// ---- Community chat summaries (GET /communities/mine enrichment) ----
message GetCommunityChatSummariesRequest {
  string userId = 1;
  repeated string communityIds = 2;
}
message CommunityChatLastMessage {
  string username = 1;
  string message  = 2;
  int64  dateTime = 3; // epoch ms
  // True => render sender-less (a complete SYSTEM sentence). False => render as
  // "username: message" (a normal member message). Lets community-service pick
  // the correct lastActivity shape when it overlays this per-viewer message.
  bool   isSystem = 4;
  // Sender userId for the message shape ("" for SYSTEM / unknown). Backward
  // compatible: omitted by older callers, defaults to "".
  string userId   = 5;
}
message CommunityChatSummary {
  string communityId        = 1;
  int32  unreadMessageCount = 2;
  bool   hasLastMessage     = 3; // false => lastMessageActivity is null
  CommunityChatLastMessage lastMessage = 4;
  // True => the viewer HID the community-wide shared last, so lastMessage (or its
  // absence when hasLastMessage=false) is an AUTHORITATIVE per-viewer resolution:
  // community-service uses it directly (and CLEARS the column preview when there
  // is no lastMessage), rather than overlaying only-when-newer. Additive (field 6,
  // defaults false for older callers).
  bool   perUserResolved    = 6;
  // Viewer-private SYSTEM line (e.g. "You joined the community"): the latest
  // message visible ONLY to the requesting user (GeneralRoomMessage.visibleToUserId
  // == userId). community-service overlays this onto the per-viewer
  // /communities/mine lastActivity when it is newer than the community-wide
  // activity, so the joiner sees "You joined the community" while everyone else
  // keeps the community-wide message. Absent when the viewer has no personal line.
  CommunityChatLastMessage personalLastMessage = 5;
  // Oldest unread message id, so the client can jump to it. "" iff
  // unreadMessageCount == 0. Additive (field 7, defaults "" for older callers).
  string firstUnreadMessageId = 7;
}
message GetCommunityChatSummariesResponse {
  repeated CommunityChatSummary summaries = 1;
}

// ---- Synchronous chat-room provisioning (community creation) ----
message EnsureCommunityRoomRequest {
  string communityId = 1;
  string name        = 2;
  string ownerId     = 3;
  string avatarUrl   = 4;
}
message EnsureCommunityRoomResponse {
  bool   ok          = 1;
  string communityId = 2;
}

// ---- Synchronous reaction-activity companion (see UpdateReactionActivity above) ----
message UpdateReactionActivityRequest {
  string communityId          = 1;
  // true => mirrors setReactionActivity (unconditional overwrite).
  // false => mirrors clearReactionActivityIfCurrent (identity-matched clear).
  bool   added                = 2;
  string messageId             = 3;
  string emoji                 = 4;
  string actorId                = 5;
  // Only meaningful when added = true.
  string actorPreview           = 6;
  string targetId                = 7;  // "" = no target (self-reaction)
  string targetPreview           = 8;
  int64  reactedAt               = 9;  // epoch ms; only meaningful when added = true
}
message UpdateReactionActivityResponse {
  bool ok = 1;
}

message UpdateMessageActivityRequest {
  string communityId     = 1;
  // Canonical bump fields — meaningful when selfUserId is "".
  int64  lastMessageAt   = 2;  // epoch ms
  string lastMessageId   = 3;
  string senderUserId    = 4;
  string senderUsername  = 5;
  string messagePreview  = 6;
  string activityType    = 7;  // "message" | "edited" | ... (default "message")
  // Personal self-hide overlay — when non-empty, ONLY lastActivityUserId /
  // lastActivitySelfPreview are written (see rpc doc above); fields above are
  // ignored in this mode.
  string selfUserId      = 8;
  string selfPreview     = 9;
}
message UpdateMessageActivityResponse {
  bool ok = 1;
}

// ---- Backoffice Community Management ----
// "status" = admin moderation lifecycle: ACTIVE | CLOSED (CLOSED == the
// Community.moderationStatus SUSPENDED). Distinct from user soft-delete
// (deletedAt) — soft-deleted communities are excluded from these results.
message AdminListCommunitiesRequest {
  string search       = 1;  // matches community name OR admin name; "" = no filter
  string type         = 2;  // "PUBLIC" | "PRIVATE" | "" (any)
  string category     = 3;  // category slug OR id; "" = any
  string status       = 4;  // "ACTIVE" | "CLOSED" | "" (any)
  string created_from = 5;  // ISO date YYYY-MM-DD, inclusive; "" = none
  string created_to   = 6;  // ISO date YYYY-MM-DD, inclusive; "" = none
  string sort_field   = 7;  // createdAt | name | memberCount | categoryName | livestreamCount
  string sort_dir     = 8;  // asc | desc
  int32  page         = 9;  // 1-based
  int32  limit        = 10; // page size
}

// One community row, shared by the list + the detail core. Admin identity is
// sourced from the CommunityMember snapshot of Community.adminId.
message AdminCommunityRow {
  string community_id     = 1;
  string name             = 2;
  string handle           = 3;
  string admin_id         = 4;
  string admin_name       = 5;  // snapshotDisplayName of the admin member; "" if missing
  string admin_username   = 6;  // snapshotUsername; "" if missing
  string admin_avatar_url = 7;  // snapshotAvatarKey/url; "" if none
  string type             = 8;  // PUBLIC | PRIVATE
  string category_id      = 9;
  string category_name    = 10;
  string category_slug    = 11;
  string status           = 12; // ACTIVE | CLOSED
  int32  member_count     = 13;
  int32  livestream_count = 14; // STUB (0) until stream-service is wired
  int64  created_at       = 15; // epoch ms
  string community_avatar_url = 16; // presigned community avatar/profile image URL (community bucket); "" if none
  string community_cover_url  = 17; // presigned community cover/banner image URL (community bucket); "" if none
}

message AdminListCommunitiesResponse {
  repeated AdminCommunityRow communities = 1;
  int32 total = 2; // total matching the filter (for offset pagination)
}

message AdminGetCommunityRequest {
  string community_id = 1;
}

// Detail payload. Moderation history is NOT here — backoffice composes it from
// its own admin_db ModerationAction rows. owner_email / owner_account_status are
// best-effort ("" / "ACTIVE") until enriched cross-service.
message AdminCommunityDetail {
  bool   found                  = 1;
  AdminCommunityRow community    = 2;
  string description             = 3;  // "" if none
  string cover_url               = 4;  // "" if none
  int64  last_activity_at        = 5;  // epoch ms
  // Member statistics.
  int32  members_total           = 6;
  int32  members_active          = 7;
  int32  members_pending         = 8;
  int32  members_banned          = 9;
  int32  members_moderators      = 10; // ACTIVE members with role MODERATOR or ADMIN
  int32  members_joined_last_7d  = 11;
  // Settings summary.
  int32  open_reports            = 12; // CommunityReport status=OPEN count
  int32  active_invite_links     = 13; // non-revoked, non-expired invite links
  string join_policy             = 14; // "OPEN" (PUBLIC) | "REQUEST" (PRIVATE)
  // Owner extras (snapshot-sourced; "" / "ACTIVE" until enriched).
  string owner_email             = 15;
  string owner_account_status    = 16;
}

// ---- Backoffice Community Member List ----
// The "Community User List" grid on the admin User Management detail screen.
// Read-through, offset paginated; searchable by username/userId, role-filterable.
message AdminListCommunityMembersRequest {
  string community_id    = 1;
  string search          = 2;  // username or userId; "" = none
  string role            = 3;  // ADMIN|MODERATOR|MEMBER; "" = all
  int32  page            = 4;
  int32  limit           = 5;
  // "" = no exclusion. When set, this userId is excluded at the DB level and MUST
  // NEVER appear in the page (used to hide the user being viewed from their own
  // co-member grid). Never filtered in memory.
  string exclude_user_id = 6;
  // "username" | "handle" | "joinedAt" | "" (default). Default order is role asc
  // then joinedAt asc. "username" sorts on the display name, "handle" on the @handle.
  string sort_field      = 7;
  // "asc" | "desc" | "" (default asc).
  string sort_dir        = 8;
}
message AdminCommunityMemberRow {
  string user_id     = 1;
  string username    = 2;   // snapshotDisplayName (fallback snapshotUsername)
  string handle      = 3;   // snapshotUsername (the @handle)
  string avatar_url  = 4;   // resolved/presigned, "" when none
  string role        = 5;
  string status      = 6;
  string joined_at   = 7;   // ISO 8601
}
message AdminListCommunityMembersResponse {
  repeated AdminCommunityMemberRow members = 1;
  int64 total = 2;
}

// ---- Backoffice Community Muted-Member List ----
// Platform-admin view of a community's currently-muted members (moderation
// mute — see MuteMember/UnmuteMember). Offset paginated, newest mute first.
message AdminListMutedMembersRequest {
  string community_id = 1;
  int32  page         = 2;
  int32  limit        = 3;
}
message AdminMutedMemberRow {
  string user_id     = 1;
  string username    = 2;  // snapshotDisplayName (fallback snapshotUsername)
  string handle      = 3;  // snapshotUsername (the @handle)
  string avatar_url  = 4;  // resolved/presigned, "" when none
  string muted_by    = 5;  // AuthUser.id of the moderator/admin who muted
  string reason      = 6;  // "" if none
  int64  muted_at    = 7;  // epoch ms
  int64  muted_until = 8;  // epoch ms; 0 = indefinite
}
message AdminListMutedMembersResponse {
  repeated AdminMutedMemberRow members = 1;
  int64 total = 2;
}

// ---- Backoffice batch community enrichment (Livestream Management) ----
message AdminGetCommunitiesByIdsRequest {
  repeated string community_ids = 1;
}
message AdminCommunityBrief {
  string community_id  = 1;
  string name          = 2;
  string avatar_url    = 3; // presigned ("" if none)
  string category_id   = 4;
  string category_name = 5;
  string category_slug = 6;
  int64  member_count  = 7;
}
message AdminGetCommunitiesByIdsResponse {
  repeated AdminCommunityBrief communities = 1;
}

message AdminSearchCommunityIdsRequest {
  string search = 1;
}
message AdminSearchCommunityIdsResponse {
  repeated string community_ids = 1;
}

// ---- Backoffice batch member-role enrichment (Livestream Viewer List) ----
// Batch role lookup for a set of userIds within one community. Users not
// found (e.g. left the community) are simply absent from the response — the
// caller defaults them to MEMBER.
message AdminGetMemberRolesRequest {
  string community_id     = 1;
  repeated string user_ids = 2;
}
message AdminMemberRoleRow {
  string user_id = 1;
  string role    = 2; // ADMIN|MODERATOR|MEMBER
}
message AdminGetMemberRolesResponse {
  repeated AdminMemberRoleRow roles = 1;
}

// ---- Backoffice User → Communities reverse lookup ----
// The "Communities" grid on the admin User Management detail screen: the
// communities the given user is an ACTIVE member of. Driving filter is the
// user's ACTIVE memberships; name search + sort apply to the Community fields.
// Excludes soft-deleted communities. Read-through, offset paginated.
message AdminListUserCommunitiesRequest {
  string user_id    = 1;
  string search     = 2; // community name (insensitive contains) OR communityId (exact); "" = none
  string sort_field = 3; // "name" | "memberCount" | "createdAt" (default createdAt)
  string sort_dir   = 4; // "asc" | "desc" (default desc)
  int32  page       = 5;
  int32  limit      = 6;
}
message AdminUserCommunityRow {
  string community_id  = 1;
  string name          = 2;
  string avatar_url    = 3; // presigned community avatar GET URL, "" when none/unavailable
  string category_id   = 4;
  string category_name = 5; // "" if none
  string description   = 6; // "" if none
  int32  member_count  = 7;
  string role          = 8; // this user's role in the community (ADMIN|MODERATOR|MEMBER)
  string joined_at     = 9; // ISO 8601 (this user's joinedAt)
  int64  created_at    = 10; // community createdAt epoch ms
}
message AdminListUserCommunitiesResponse {
  repeated AdminUserCommunityRow communities = 1;
  int64 total = 2;
}

message AdminSetModerationStatusRequest {
  string community_id   = 1;
  string status         = 2; // "ACTIVE" (reopen) | "SUSPENDED" (close)
  string reason_code    = 3; // close reason code; "" for reopen
  string actor_admin_id = 4; // backoffice AdminUser.id (stored on close)
}

message AdminSetModerationStatusResponse {
  bool   ok         = 1;
  string status     = 2; // resulting moderation status: ACTIVE | CLOSED
  int64  closed_at  = 3; // epoch ms; 0 when ACTIVE
  // "" on success, else COMMUNITY_NOT_FOUND | COMMUNITY_ALREADY_CLOSED | COMMUNITY_NOT_CLOSED
  string error_code = 4;
}

// ---- Backoffice Category Management ----
message AdminCategoryRow {
  string id              = 1;
  string name            = 2;
  string slug            = 3;
  bool   visible         = 4; // CommunityCategory.active
  int32  order           = 5;
  int64  created_at      = 6; // epoch ms
  int64  updated_at      = 7; // epoch ms
  // Count of communities in this category with status=ACTIVE and deletedAt
  // unset (i.e. "active/non-deleted"). 0 for a just-created category.
  int32  community_count = 8;
}

message AdminListCategoriesRequest {
  string search     = 1; // "" = no filter; matches name OR description
  string status     = 2; // "visible" | "hidden" | "" (= all)
  int32  page       = 3;
  int32  limit      = 4;
  string sort_field = 5; // "name" | "order" | "createdAt" | "communityCount" | "" (default "order")
  string sort_dir    = 6; // "asc" | "desc" | "" (default "asc")
}

message AdminListCategoriesResponse {
  repeated AdminCategoryRow categories = 1;
  int64                     total      = 2;
}

message AdminCreateCategoryRequest {
  string name = 1;
}

message AdminUpdateCategoryRequest {
  string category_id  = 1;
  string name         = 2; // "" = leave unchanged
  bool   has_name      = 3; // true when `name` was provided in the request body
  bool   visible       = 4; // ignored unless has_visible
  bool   has_visible    = 5;
}

// "" on success, else CATEGORY_NOT_FOUND | CATEGORY_NAME_TAKEN
message AdminCategoryMutationResponse {
  bool             ok         = 1;
  AdminCategoryRow category   = 2;
  string           error_code = 3;
}

message AdminDeleteCategoryRequest {
  string category_id = 1;
}

// "" on success, else CATEGORY_NOT_FOUND
message AdminDeleteCategoryResponse {
  bool   ok           = 1;
  bool   soft_deleted  = 2; // true when the category was in use (soft-deleted, not removed)
  string error_code    = 3;
}

message GetCommunityCountRequest {}
message CommunityCount {
  int64 total = 1;
}

// ---- Membership validation (stream-service go-live gate) ----
message ValidateMembershipRequest {
  string community_id = 1;
  string user_id      = 2;
}
message ValidateMembershipResponse {
  bool   is_member           = 1;  // true only when an ACTIVE member
  string role                = 2;  // ADMIN | MODERATOR | MEMBER | "" when not a member
  string status               = 3;  // ACTIVE | PENDING | BANNED | LEFT | "" when no row
  // True when the community is owner-CLOSED or platform-SUSPENDED (also true
  // when the community can't be found) — callers use this to block go-live /
  // commenting even for an otherwise-valid ACTIVE member.
  bool   is_community_closed = 4;
}

// ---- Community invite context (chat-service systemAction card) ----
message CommunityInviteContextQuery {
  string community_id = 1;
  // The invite/permanent code carried on the invitation message. "" when the
  // caller only needs found/name/handle/membership, not link validity.
  string code          = 2;
}
message GetCommunityInviteContextsRequest {
  string                              user_id = 1;
  repeated CommunityInviteContextQuery queries = 2;
}
message CommunityInviteContext {
  string community_id     = 1;
  // False when the community was deleted (or never existed) — every other
  // field is meaningless in that case.
  bool   found             = 2;
  string community_name   = 3;
  string community_handle = 4;
  // True only when `user_id` is a current ACTIVE member.
  bool   is_member         = 5;
  // ACTIVE | EXPIRED | REVOKED | DELETED (DELETED mirrors `found=false`).
  string link_status      = 6;
}
message GetCommunityInviteContextsResponse {
  repeated CommunityInviteContext contexts = 1;
}

message SendCommunityMessageRequest {
  string community_id      = 1;
  string room_id           = 2;
  string sender_id         = 3;
  string client_message_id = 4;
  string message           = 5;
  string content_type      = 6;
  string media_key         = 7;  // deprecated: use attachments_json instead
  string parent_message_id = 8;  // "" when not a reply
  // JSON-encoded attachment payload: { files?, location?, contact?, sticker? }
  // Supersedes media_key for all new clients.
  string attachments_json  = 9;
}
message SendCommunityMessageResponse {
  string message_id = 1;
  string room_id    = 2;
  int64  sent_at    = 3;
}
message GetCommunityMessagesRequest {
  string room_id      = 1;
  string requester_id = 2;
  string cursor       = 3;
  int32  limit        = 4;
}
message GetCommunityMessagesResponse {
  repeated CommunityMessageDto messages   = 1;
  string                       next_cursor = 2;
  bool                         has_more   = 3;
  // JSON-encoded PinnedMessageSummary (chat-service CommunityPinService),
  // or "" when the room has no active pin. Lets the FE always know the
  // currently pinned message without depending on the PINNED_MESSAGE system
  // line, which scrolls out of view as newer messages arrive.
  string                       pinned_message_json = 4;
}
message CommunityMessageDto {
  string message_id          = 1;
  string room_id             = 2;
  string sender_id           = 3;
  string message             = 4;
  string content_type        = 5;
  string media_key           = 6;
  int64  sent_at             = 7;
  string system_message_type = 8;  // e.g. COMMUNITY_JOINED (empty for normal messages)
  string system_metadata     = 9;  // JSON string of the system metadata map
  bool   is_personal         = 10; // true = user-scoped SYSTEM message ("You joined")
  // Denormalized sender snapshot — the gateway's socket messages:fetch mapper
  // reads these directly (no separate user lookup) to build the FE message shape.
  string sender_name         = 11;
  string sender_avatar       = 12; // pre-resolved presigned URL (already resolved by toWire)
  // JSON-encoded attachment array (URLs already resolved). Supersedes media_key
  // for the api-gateway's content.files mapping — see SendCommunityMessageRequest.
  string attachments_json    = 13;
  string reactions_json      = 14; // JSON-encoded reaction summary array
  string quote_data_json     = 15; // JSON-encoded quoted-message snapshot, "" if none
}

// ---- Single message fetch for moderation report snapshots ----
message GetCommunityMessageByIdRequest {
  string room_id    = 1; // === communityId; IDOR scope
  string message_id = 2;
}
message ReportedMediaDto {
  string object_key   = 1; // RAW object key (resolve to presigned on read)
  string content_type = 2; // MIME, e.g. image/jpeg ("" if unknown)
  string file_name    = 3; // "" if unknown
  int64  size         = 4; // bytes; 0 if unknown
}
message GetCommunityMessageByIdResponse {
  bool   found        = 1; // false → missing / wrong room / deleted-for-all
  string message      = 2; // text / caption
  string content_type = 3; // canonical UPPER kind: TEXT | IMAGE | VIDEO | ...
  int64  sent_at      = 4; // epoch ms — when the content was posted
  string sender_id    = 5;
  repeated ReportedMediaDto media = 6;
}

// ---- Reconciliation (ListCommunities) ----
message ListCommunitiesRequest {
  string after_id = 1; // exclusive cursor on community id; empty = from start
  int32  limit    = 2; // page size; 0 = server default
}
message ReconcileMemberDto {
  string user_id   = 1;
  string status    = 2; // ACTIVE | PENDING | BANNED | LEFT
  string role      = 3; // ADMIN | MODERATOR | MEMBER
  int64  joined_at = 4; // epoch ms
}
message ReconcileCommunityDto {
  string id         = 1;
  string name       = 2;
  string admin_id   = 3;
  string avatar_url = 4;
  bool   deleted    = 5; // deletedAt is set (soft-deleted)
  repeated ReconcileMemberDto members = 6;
  string community_type = 7; // PUBLIC | PRIVATE — drives non-member read access
}
message ListCommunitiesResponse {
  repeated ReconcileCommunityDto communities = 1;
  string next_after_id = 2; // pass back as after_id for the next page
  bool   has_more      = 3;
}

// ---- Community offline catch-up ----
message CommunityCatchupRequest {
  string room_id       = 1;
  string requester_id  = 2;
  // Exclusive lower bound: last message id the client already has.
  // "" = fetch the latest `limit` messages (first load).
  // Provide EITHER since_id OR since_ts — not both.
  string since_id      = 3;
  int32  limit         = 4;
  // Alternative cursor: epoch-ms of updatedAt lower bound (inclusive).
  // When since_ts > 0 the server switches to an updatedAt-based query that
  // catches edits, reaction changes, and deletions (tombstones) in addition to
  // new messages. Use this after returning from the background for a full
  // mutation sweep. since_ts takes precedence over since_id when both are set.
  int64  since_ts      = 5;
  // ZERO-LOSS revision cursor (highest precedence). Exclusive lower bound on the
  // per-room CHANGE revision. When set, the server returns every message whose
  // revision > since_revision — inserts AND mutations — via the same core as the
  // REST /changes feed. Feed back the response's last_revision to continue.
  int64  since_revision = 6;
}
message CommunityCatchupEventDto {
  string message_id    = 1;
  string room_id       = 2;
  string sender_id     = 3;
  string sender_name   = 4;
  string sender_avatar = 5;
  string message       = 6;
  string content_type  = 7;
  int64  sent_at       = 8;
  bool   is_deleted    = 9;
  string deleted_type  = 10;
  int64  edited_at     = 11;
  // "new" | "edited" | "deleted" | "reacted" — what happened since the cursor.
  // In since_id mode every non-tombstone row is "new"; deleted tombstones are
  // "deleted". In since_ts mode the value is derived from updatedAt/editedAt.
  string sync_event_type                       = 12;
  // Current grouped reaction state for this message at the time of catch-up.
  repeated CommunityReactionGroupDto reactions = 13;
  // ZERO-LOSS CHANGE cursor for this message (Telegram pts). Present in every
  // catch-up mode; the client tracks the per-room max as its high-water.
  int64  revision                              = 14;
}
message CommunityCatchupResponse {
  string room_id                             = 1;
  repeated CommunityCatchupEventDto events   = 2;
  bool   has_more                            = 3;
  string last_id                             = 4; // last returned message id (use as next since_id)
  bool   authorized                          = 5;
  // Epoch-ms cursor for since_ts mode — equals the last event's updatedAt.
  // Feed back as the next since_ts to continue paging. Zero in since_id mode.
  int64  next_ts                             = 6;
  // ZERO-LOSS revision-mode fields (0/false in id/ts modes):
  int64  room_revision                       = 7; // room's current CHANGE max
  int64  last_revision                       = 8; // client's new high-water; feed back as since_revision
  bool   reset_required                      = 9; // since_revision below retention → re-baseline
}

// ---- Membership check (gateway socket ban gate) ----
message CheckCommunityMembershipRequest {
  string community_id = 1;
  string user_id      = 2;
}
message CheckCommunityMembershipResponse {
  // True only when the user has an ACTIVE membership row.
  bool   is_member = 1;
  // True when the user has a BANNED membership row (mutually exclusive with
  // is_member). Lets the gateway distinguish "banned" from "not a member".
  bool   is_banned = 2;
  // Raw membership status: ACTIVE | BANNED | LEFT | PENDING | "" (no row).
  string status    = 3;
  // ACTIVE member's role (ADMIN|MODERATOR|MEMBER); empty when not a member.
  string role      = 4;
  // True when the community is owner-CLOSED or platform-SUSPENDED. Lets the
  // gateway block new socket writes (join/typing) into a closed community.
  bool   is_community_closed = 5;
  // True when the community's visibility is PUBLIC. PUBLIC communities allow
  // non-members to READ history via REST, so the socket ban gate mirrors that
  // by letting non-member sockets subscribe to live broadcasts too — without
  // this the FE could read past messages but never receive new ones.
  bool   is_public_community = 6;
}

// ---- Moderation-mute check (notifications eligibility gate) ----
message CheckCommunityMuteRequest  { string community_id = 1; string user_id = 2; }
message CheckCommunityMuteResponse { bool is_muted = 1; int64 muted_until = 2; } // epoch ms; 0 = indefinite or not muted

// field: one of "chatEnabled" | "streamEnabled" | "announcementEnabled".
message CheckCommunityNotificationPrefRequest  { string community_id = 1; string user_id = 2; string field = 3; }
message CheckCommunityNotificationPrefResponse { bool enabled = 1; }

// ---- Community message reaction (toggle: add if absent, remove if present) ----
message ReactToCommunityMessageRequest {
  string message_id   = 1;
  string community_id = 2;
  string user_id      = 3;
  string emoji        = 4;
}
message CommunityReactionUserDto {
  string user_id      = 1;
  string display_name = 2;
  string avatar       = 3;
}
message CommunityReactionGroupDto {
  string emoji                           = 1;
  int32  count                           = 2;
  repeated CommunityReactionUserDto users = 3;
}
message ReactToCommunityMessageResponse {
  string message_id                             = 1;
  string community_id                           = 2;
  repeated CommunityReactionGroupDto reactions  = 3;
}

// ---- Edit ----
message EditCommunityMessageRequest {
  string message_id   = 1;
  string community_id = 2;
  string user_id      = 3;
  string text         = 4;
}
message EditCommunityMessageResponse {
  string message_id   = 1;
  string community_id = 2;
  string room_id      = 3;
  int64  edited_at    = 4;
  string message      = 5;
  string content_type = 6;
}

// ---- Delete ----
message DeleteCommunityMessageRequest {
  string message_id   = 1;
  string community_id = 2;
  string user_id      = 3;
  string delete_type  = 4;  // "forEveryone" | "forMe"
}
message DeleteCommunityMessageResponse {
  string message_id   = 1;
  string community_id = 2;
  string room_id      = 3;
  string delete_type  = 4;
}

// ---- Pin ----
message PinCommunityMessageRequest {
  string message_id   = 1;
  string community_id = 2;
  string room_id      = 3;
  string user_id      = 4;
}
message PinCommunityMessageResponse {
  string message_id   = 1;
  string community_id = 2;
  string room_id      = 3;
  string pinned_ids   = 4;  // JSON string of string[]
  int32  pinned_count = 5;
  int64  pinned_at    = 6;
}

// ---- Moderation ----
// Generic result for kick / ban / unban / mute / unmute / transfer-admin /
// role-change / delete.
// error_code is "" on success; "NOT_FOUND" | "FORBIDDEN" | "ALREADY_BANNED" | etc.
message ModerationActionResponse {
  bool   ok             = 1;
  string community_id   = 2;
  string target_user_id = 3;
  string error_code     = 4;
  // Only populated by MuteMember; epoch ms, 0 = indefinite mute (ignored by
  // every other moderation action that reuses this response shape).
  int64  muted_until    = 5;
}

message KickMemberRequest {
  string community_id    = 1;
  string actor_id        = 2; // performing the action (must be admin/mod)
  string target_user_id  = 3;
  string reason          = 4; // "" if not provided
}

message BanMemberRequest {
  string community_id    = 1;
  string actor_id        = 2;
  string target_user_id  = 3;
  string reason          = 4;
}

message UnbanMemberRequest {
  string community_id    = 1;
  string actor_id        = 2;
  string target_user_id  = 3;
}

// Single entry point for community moderation mute — called both from the
// community UI/socket AND from stream-service (livestream "mute" action), so
// there is exactly one mute record regardless of where it was triggered.
message MuteMemberRequest {
  string community_id     = 1;
  string actor_id         = 2; // performing the action (must be admin/mod)
  string target_user_id   = 3;
  int64  duration_minutes = 4; // 0 = indefinite
  string reason           = 5; // "" if not provided
}

message UnmuteMemberRequest {
  string community_id    = 1;
  string actor_id        = 2;
  string target_user_id  = 3;
}

message TransferAdminRequest {
  string community_id  = 1;
  string actor_id      = 2; // current admin
  string new_admin_id  = 3;
}

message ChangeMemberRoleRequest {
  string community_id    = 1;
  string actor_id        = 2;
  string target_user_id  = 3;
  string new_role        = 4; // "MODERATOR" | "MEMBER"
}

message CreateReportRequest {
  string community_id       = 1;
  string reporter_id        = 2;
  string reason             = 3;
  string target_message_id  = 4; // "" if reporting the community itself
}

message CreateReportResponse {
  string report_id = 1;
  bool   ok        = 2;
}

message DeleteCommunityRequest {
  string community_id = 1;
  string actor_id     = 2; // must be admin
  string reason       = 3; // "" if not provided
}

// ---- Mark community message read (per-message, fine-grained) ----
message MarkCommunityMessageReadRequest {
