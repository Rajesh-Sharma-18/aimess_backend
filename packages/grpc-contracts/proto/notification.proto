syntax = "proto3";
package notification;

service NotificationService {
  rpc GetNotifications         (GetNotificationsRequest)         returns (GetNotificationsResponse);
  rpc MarkNotificationsRead    (MarkNotificationsReadRequest)    returns (MarkNotificationsReadResponse);
  rpc CreateNotification       (CreateNotificationRequest)       returns (CreateNotificationResponse);
  rpc DeleteNotification       (DeleteNotificationRequest)       returns (DeleteNotificationResponse);
  // Records a user-initiated action on a login-detected notification (Terminate / Trust).
  rpc RecordSessionAction      (RecordSessionActionRequest)      returns (RecordSessionActionResponse);
}

message CreateNotificationRequest {
  string user_id  = 1;
  // Actor that triggered the notification (may be empty for system events).
  string actor_id = 2;
  string type     = 3;
  string title    = 4;
  string body     = 5;
  // Arbitrary structured context (entity ids, roster, etc.) as string→string.
  map<string, string> data = 6;
}
message CreateNotificationResponse {
  string id = 1;
}

message GetNotificationsRequest {
  string user_id = 1;
  string cursor  = 2;
  int32  limit   = 3;
}
message GetNotificationsResponse {
  repeated NotificationDto notifications = 1;
  string next_cursor  = 2;
  bool   has_more     = 3;
  int32  unread_count = 4;
}
message NotificationDto {
  string notification_id    = 1;
  string user_id            = 2;
  string type               = 3;
  string title              = 4;
  string body               = 5;
  string reference_id       = 6;
  bool   is_read            = 7;
  int64  created_at         = 8;
  // Arbitrary context bag (mirrors CreateNotificationRequest.data). Includes
  // actionTaken ("TERMINATED" | "TRUSTED") for login-detected notifications after
  // the user acts on them, so the client can restore state on page refresh.
  map<string, string> data  = 9;
}
message MarkNotificationsReadRequest {
  string          user_id          = 1;
  repeated string notification_ids = 2;
}
message MarkNotificationsReadResponse {
  int32 updated_count    = 1;
  int32 remaining_unread = 2;
}
message DeleteNotificationRequest {
  string user_id         = 1;
  string notification_id = 2;
}
message DeleteNotificationResponse {
  bool  deleted          = 1;
  int32 remaining_unread = 2;
}

message RecordSessionActionRequest {
  string user_id    = 1;
  // The sessionId stored in the login-detected notification's data.sessionId.
  string session_id = 2;
  // "TERMINATED" | "TRUSTED"
  string action     = 3;
  // Resolved body text, e.g. "Session terminated." or "Login verified."
  string body       = 4;
}
message RecordSessionActionResponse {
  string notification_id = 1;
  bool   updated         = 2;
}
