<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Socket Event Tester</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0d0d0d; color: #ccc; display: flex; flex-direction: column; height: 100vh; }

    .toolbar { display: flex; gap: 8px; padding: 8px 10px; background: #111; border-bottom: 1px solid #222; flex-wrap: wrap; align-items: center; }
    .toolbar input { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 5px 8px; color: #ddd; font-size: 12px; font-family: monospace; }
    .toolbar input:focus { outline: none; border-color: #7c83fd; }
    .w-url  { width: 180px; }
    .w-acct { width: 130px; }
    .w-pass { width: 110px; }
    .w-id   { width: 230px; }
    button  { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: monospace; }
    .btn-connect    { background: #7c83fd; color: #fff; }
    .btn-disconnect { background: #c0392b; color: #fff; }
    .btn-send       { background: #27ae60; color: #fff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #1e1e1e; color: #555; }
    .badge.on  { background: #1a3a1a; color: #4caf50; }
    .badge.err { background: #3a1a1a; color: #f44336; }

    .send-row { display: flex; gap: 6px; padding: 6px 10px; background: #0f0f0f; border-bottom: 1px solid #1a1a1a; }
    .send-row input { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 5px 10px; color: #ddd; font-size: 13px; font-family: monospace; }
    .send-row input:focus { outline: none; border-color: #27ae60; }

    .events { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
    .ev { font-size: 12px; padding: 4px 8px; border-radius: 4px; border-left: 3px solid #333; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
    .ev.in    { border-color: #4caf50; background: #0d1a0d; }
    .ev.out   { border-color: #7c83fd; background: #0d0d1a; }
    .ev.sys   { border-color: #ff9800; background: #1a1400; color: #ff9800; }
    .ev.err   { border-color: #f44336; background: #1a0d0d; color: #f44336; }
    .ev .ts   { color: #444; font-size: 11px; }
    .ev .name { font-weight: bold; }
    .ev .name.in  { color: #4caf50; }
    .ev .name.out { color: #7c83fd; }
    .clear-btn { margin-left: auto; background: #1a1a1a; color: #555; border: 1px solid #222; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #222; }
  </style>
</head>
<body>

<!-- ── Toolbar ── -->
<div class="toolbar">
  <input class="w-url"  id="url"      placeholder="http://localhost:8000" value="http://localhost:8000" title="Gateway URL" />
  <input class="w-acct" id="account"  placeholder="account / username" title="Account" />
  <input class="w-pass" id="password" type="password" placeholder="password" title="Password" />
  <input class="w-id"   id="room"     placeholder="communityId  or  roomId" title="Community / Room ID" />
  <button class="btn-connect"    id="btn-connect"    onclick="connect()">Connect</button>
  <button class="btn-disconnect" id="btn-disconnect" onclick="disconnect()" disabled>Disconnect</button>
  <span class="badge" id="badge">⚪ offline</span>
  <button class="clear-btn" onclick="clearLog()">Clear</button>
</div>

<!-- ── Send message row ── -->
<div class="send-row">
  <input id="msg" placeholder="message text  (Enter to send)" onkeydown="if(event.key==='Enter')sendMsg()" />
  <button class="btn-send" id="btn-send" onclick="sendMsg()" disabled>Send</button>
</div>

<!-- ── Event log ── -->
<div class="events" id="events"></div>

<script>
let socket = null;
let token  = null;
let userId = null;

const $ = id => document.getElementById(id);

// ── Helpers ──────────────────────────────────────────────────────────────────
function ts() { return new Date().toLocaleTimeString(); }

function addEvent(dir, name, data) {
  const el = document.createElement('div');
  el.className = `ev ${dir}`;
  const payload = data !== undefined ? '\n' + JSON.stringify(data, null, 2) : '';
  el.innerHTML = `<span class="ts">[${ts()}]</span>  <span class="name ${dir}">${dir === 'in' ? '←' : '→'} ${name}</span>${payload}`;
  $('events').appendChild(el);
  $('events').scrollTop = $('events').scrollHeight;
}

function sysLog(msg, isErr = false) {
  const el = document.createElement('div');
  el.className = `ev ${isErr ? 'err' : 'sys'}`;
  el.innerHTML = `<span class="ts">[${ts()}]</span>  ${msg}`;
  $('events').appendChild(el);
  $('events').scrollTop = $('events').scrollHeight;
}

function clearLog() { $('events').innerHTML = ''; }

function setStatus(text, cls) {
  const b = $('badge');
  b.textContent = text;
  b.className = `badge ${cls}`;
}

function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2,6)}`; }

// ── Login then connect ────────────────────────────────────────────────────────
async function connect() {
  const base     = $('url').value.trim().replace(/\/$/, '');
  const account  = $('account').value.trim();
  const password = $('password').value.trim();
  const roomId   = $('room').value.trim();

  if (!account || !password) { sysLog('Account and password required.', true); return; }
  if (!roomId)               { sysLog('communityId / roomId required.', true); return; }

  sysLog(`Logging in as "${account}"…`);

  // 1. Login
  let loginData;
  try {
    const res = await fetch(`${base}/api/v1/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account, password }),
    });
    loginData = await res.json();
    if (!res.ok) throw new Error(loginData.message || 'Login failed');
  } catch (e) {
    sysLog(`Login error: ${e.message}`, true);
    return;
  }

  token  = loginData.data?.tokens?.accessToken || loginData.data?.accessToken;
  if (!token) { sysLog('No access token in response.', true); return; }

  try {
    const p = JSON.parse(atob(token.split('.')[1]));
    userId = p.userId || p.sub || p.id;
  } catch(_) {}

  sysLog(`✓ Logged in  userId=${userId || '—'}`);

  // 2. Open socket
  $('btn-connect').disabled = true;
  setStatus('⏳ connecting…', '');

  socket = io(`${base}/community`, {
    path: '/socket.io/',
    transports: ['websocket'],
    auth: { token },
  });

  // ── System events ──
  socket.on('connect', () => {
    sysLog(`✓ Socket connected  sid=${socket.id}`);
    setStatus('🟢 connected', 'on');
    $('btn-disconnect').disabled = false;
    $('btn-send').disabled = false;

    // Join the room
    socket.emit('community:join', { communityId: roomId, roomId });
    addEvent('out', 'community:join', { communityId: roomId, roomId });
  });

  socket.on('disconnect', reason => {
    sysLog(`Socket disconnected: ${reason}`);
    setStatus('⚪ offline', '');
    $('btn-connect').disabled = false;
    $('btn-disconnect').disabled = true;
    $('btn-send').disabled = true;
  });

  socket.on('connect_error', err => {
    sysLog(`Connection error: ${err.message}`, true);
    setStatus('🔴 error', 'err');
    $('btn-connect').disabled = false;
  });

  // ── Listen to ALL incoming events and log them ──
  const EVENTS = [
    'community:message:new',
    'community:message:edited',
    'community:message:deleted',
    'community:member:joined',
    'community:member:left',
    'community:updated',
    'community:room:updated',
  ];

  EVENTS.forEach(ev => {
    socket.on(ev, data => addEvent('in', ev, data));
  });

  // Catch-all for any unlisted event
  socket.onAny((ev, data) => {
    if (!EVENTS.includes(ev)) addEvent('in', ev, data);
  });
}

// ── Disconnect ────────────────────────────────────────────────────────────────
function disconnect() {
  socket?.disconnect();
  socket = null;
  token  = null;
  $('btn-connect').disabled = false;
  $('btn-disconnect').disabled = true;
  $('btn-send').disabled = true;
  setStatus('⚪ offline', '');
}

// ── Send message ──────────────────────────────────────────────────────────────
function sendMsg() {
  const text   = $('msg').value.trim();
  const roomId = $('room').value.trim();
  if (!text || !socket || !roomId) return;

  const payload = {
    communityId:     roomId,
    roomId,
    clientMessageId: uid(),
    message:         text,
    contentType:     'TEXT',
  };

  addEvent('out', 'community:message:send', payload);

  socket.emit('community:message:send', payload, ack => {
    addEvent('in', 'community:message:send  [ack]', ack);
  });

  $('msg').value = '';
}
</script>
</body>
</html>
